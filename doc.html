<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boveda · document editor</title>
    <!-- Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- CKEditor 5 -->
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --primary: #0066CC;
            --primary-light: #E3F0FF;
            --secondary: #86868b;
            --background: #f5f5f7;
            --surface: #ffffff;
            --border: #d2d2d7;
            --text: #1d1d1f;
            --text-light: #86868b;
            --shadow: 0 4px 6px -2px rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--text);
            cursor: pointer;
        }

        .logo-icon {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .doc-type-badge {
            padding: 0.5rem 1rem;
            background: var(--primary-light);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 500;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--primary-light);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary);
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Editor header */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .editor-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .title-input {
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            width: 400px;
        }

        .title-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .editor-actions {
            display: flex;
            gap: 0.75rem;
        }

        .doc-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .doc-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .doc-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .doc-btn.primary:hover {
            background: #0052a3;
        }

        /* Type-specific fields */
        .type-fields {
            background: white;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            padding: 1.5rem;
        }

        .fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .field-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .field-input, .field-select, .field-textarea {
            padding: 0.75rem;
            border: 1px solid var(--border);
            background: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .field-input:focus, .field-select:focus, .field-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .image-preview {
            max-width: 300px;
            max-height: 200px;
            object-fit: cover;
            border: 1px solid var(--border);
            margin-top: 0.5rem;
        }

        /* Collaborators section */
        .collaborators-section {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--primary-light);
            border: 1px solid var(--border);
        }

        .collaborator-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .collaborator-row input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border);
        }

        .remove-collab {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-collab:hover {
            background: #fee2e2;
            border-color: #dc2626;
            color: #dc2626;
        }

        .add-collab {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border: 1px dashed var(--border);
            background: transparent;
            width: 100%;
            cursor: pointer;
            color: var(--primary);
        }

        /* Editor container */
        .editor-container {
            background: white;
            border: 1px solid var(--border);
            min-height: 500px;
        }

        .ck-editor__editable {
            min-height: 400px;
        }

        /* Three dots menu */
        .three-dots-menu {
            position: relative;
        }

        .dots-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dots-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .dots-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: white;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            min-width: 200px;
            display: none;
            z-index: 1000;
        }

        .dots-dropdown.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dropdown-item:hover {
            background: var(--primary-light);
        }

        .dropdown-item.delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            font-size: 1.5rem;
            color: var(--text-light);
            cursor: pointer;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .folder-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }
            
            .editor-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .title-input {
                width: 100%;
            }
            
            .fields-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="logo" onclick="window.location.href='vault.html'">
                    <span class="logo-icon">🔐</span>
                    <span>BOVEDA</span>
                </div>
                <span class="doc-type-badge" id="docTypeBadge">Note</span>
            </div>
            <div class="top-bar-right">
                <div class="user-menu">
                    <div class="user-avatar" id="userAvatar">JD</div>
                    <span class="user-name" id="userName">John</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Editor Header -->
            <div class="editor-header">
                <div class="editor-header-left">
                    <button class="back-btn" id="backBtn">
                        <i class='bx bx-arrow-back'></i>
                    </button>
                    <input type="text" class="title-input" id="docTitle" placeholder="Untitled Document">
                </div>
                <div class="editor-actions">
                    <button class="doc-btn" id="saveBtn">
                        <i class='bx bx-save'></i>
                        Save
                    </button>
                    <div class="three-dots-menu">
                        <button class="dots-btn" id="threeDotsBtn">
                            <i class='bx bx-dots-vertical-rounded'></i>
                        </button>
                        <div class="dots-dropdown" id="dotsDropdown">
                            <div class="dropdown-item" id="moveToFolder">
                                <i class='bx bx-folder'></i>
                                Move to folder
                            </div>
                            <div class="dropdown-item" id="duplicateDoc">
                                <i class='bx bx-copy'></i>
                                Duplicate
                            </div>
                            <div class="dropdown-item" id="exportDoc">
                                <i class='bx bx-export'></i>
                                Export
                            </div>
                            <div class="dropdown-item delete" id="deleteDoc">
                                <i class='bx bx-trash'></i>
                                Delete
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Type-specific fields -->
            <div class="type-fields" id="typeFields">
                <!-- Login fields -->
                <div id="loginFields" style="display: none;">
                    <div class="fields-grid">
                        <div class="field-group">
                            <label class="field-label"><i class='bx bx-globe'></i> Website URL</label>
                            <input type="url" class="field-input" id="loginUrl" placeholder="https://example.com">
                        </div>
                        <div class="field-group">
                            <label class="field-label"><i class='bx bx-user'></i> Username / Email</label>
                            <input type="text" class="field-input" id="loginUsername" placeholder="username@example.com">
                        </div>
                        <div class="field-group">
                            <label class="field-label"><i class='bx bx-lock-alt'></i> Password</label>
                            <input type="password" class="field-input" id="loginPassword" placeholder="••••••••">
                        </div>
                    </div>
                </div>

                <!-- Project fields -->
                <div id="projectFields" style="display: none;">
                    <div class="fields-grid">
                        <div class="field-group">
                            <label class="field-label"><i class='bx bx-trending-up'></i> Progress</label>
                            <input type="range" class="field-input" id="projectProgress" min="0" max="100" value="0">
                            <span id="progressValue">0%</span>
                        </div>
                        <div class="field-group">
                            <label class="field-label"><i class='bx bx-image'></i> Image URL</label>
                            <input type="url" class="field-input" id="projectImage" placeholder="https://...">
                            <img id="imagePreview" class="image-preview" style="display: none;">
                        </div>
                        <div class="field-group">
                            <label class="field-label"><i class='bx bx-status'></i> Status</label>
                            <select class="field-select" id="projectStatus">
                                <option value="starting">Starting</option>
                                <option value="in-progress">In Progress</option>
                                <option value="completed">Completed</option>
                                <option value="on-hold">On Hold</option>
                            </select>
                        </div>
                    </div>

                    <!-- Collaborators -->
                    <div class="collaborators-section">
                        <label class="field-label"><i class='bx bx-group'></i> Collaborators</label>
                        <div id="collaboratorsList"></div>
                        <button class="add-collab" id="addCollaborator">
                            <i class='bx bx-plus'></i> Add Collaborator
                        </button>
                    </div>
                </div>
            </div>

            <!-- CKEditor container -->
            <div class="editor-container">
                <textarea id="editor"></textarea>
            </div>
        </div>
    </div>

    <!-- Move to Folder Modal -->
    <div class="modal" id="moveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Move to Folder</h2>
                <i class='bx bx-x modal-close' id="closeMoveModal"></i>
            </div>
            <div class="modal-body">
                <div class="field-group">
                    <label class="field-label">Select Folder</label>
                    <select class="folder-select" id="folderSelect">
                        <option value="">Root (No Folder)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="doc-btn" id="cancelMove">Cancel</button>
                <button class="doc-btn primary" id="confirmMove">Move</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Delete Document</h2>
                <i class='bx bx-x modal-close' id="closeDeleteModal"></i>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this document? This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="doc-btn" id="cancelDelete">Cancel</button>
                <button class="doc-btn primary" style="background: #dc2626;" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Get document info from session
        const docId = sessionStorage.getItem('currentDocId');
        const docType = sessionStorage.getItem('currentDocType') || 'note';
        let editor = null;
        let currentDoc = null;
        let collaborators = [];

        // DOM elements
        const docTypeBadge = document.getElementById('docTypeBadge');
        const docTitle = document.getElementById('docTitle');
        const loginFields = document.getElementById('loginFields');
        const projectFields = document.getElementById('projectFields');
        const loginUrl = document.getElementById('loginUrl');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const projectProgress = document.getElementById('projectProgress');
        const progressValue = document.getElementById('progressValue');
        const projectImage = document.getElementById('projectImage');
        const imagePreview = document.getElementById('imagePreview');
        const projectStatus = document.getElementById('projectStatus');
        const collaboratorsList = document.getElementById('collaboratorsList');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const backBtn = document.getElementById('backBtn');
        const saveBtn = document.getElementById('saveBtn');
        const threeDotsBtn = document.getElementById('threeDotsBtn');
        const dotsDropdown = document.getElementById('dotsDropdown');
        const moveModal = document.getElementById('moveModal');
        const closeMoveModal = document.getElementById('closeMoveModal');
        const cancelMove = document.getElementById('cancelMove');
        const confirmMove = document.getElementById('confirmMove');
        const folderSelect = document.getElementById('folderSelect');
        const deleteModal = document.getElementById('deleteModal');
        const closeDeleteModal = document.getElementById('closeDeleteModal');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');

        // Set user info
        const userEmail = sessionStorage.getItem('userEmail') || 'john.doe@example.com';
        userName.textContent = userEmail.split('@')[0];
        userAvatar.textContent = userEmail.charAt(0).toUpperCase();

        // Set document type
        docTypeBadge.textContent = docType.charAt(0).toUpperCase() + docType.slice(1);
        
        // Show appropriate fields
        loginFields.style.display = docType === 'login' ? 'block' : 'none';
        projectFields.style.display = docType === 'project' ? 'block' : 'none';

        // Load data from localStorage
        const vaultData = JSON.parse(localStorage.getItem('boveda_vault')) || {
            logins: [],
            notes: [],
            projects: [],
            folders: []
        };

        // Load document if editing
        if (docId) {
            const collection = docType + 's';
            currentDoc = vaultData[collection].find(d => d.id === docId);
            
            if (currentDoc) {
                docTitle.value = currentDoc.title || '';
                
                if (docType === 'login') {
                    loginUrl.value = currentDoc.url || '';
                    loginUsername.value = currentDoc.username || '';
                    loginPassword.value = currentDoc.password || '';
                } else if (docType === 'project') {
                    projectProgress.value = currentDoc.progress || 0;
                    progressValue.textContent = currentDoc.progress + '%';
                    projectImage.value = currentDoc.image || '';
                    if (currentDoc.image) {
                        imagePreview.src = currentDoc.image;
                        imagePreview.style.display = 'block';
                    }
                    projectStatus.value = currentDoc.status || 'starting';
                    collaborators = currentDoc.collaborators || [];
                    renderCollaborators();
                }
            }
        }

        // Initialize CKEditor
        ClassicEditor
            .create(document.querySelector('#editor'), {
                toolbar: [
                    'heading', '|',
                    'bold', 'italic', 'underline', 'strikethrough', '|',
                    'alignment', '|',
                    'bulletedList', 'numberedList', '|',
                    'fontFamily', 'fontSize', 'fontColor', 'fontBackgroundColor', '|',
                    'link', 'blockQuote', 'insertTable', '|',
                    'undo', 'redo'
                ],
                heading: {
                    options: [
                        { model: 'paragraph', title: 'Paragraph', class: 'ck-heading_paragraph' },
                        { model: 'heading1', view: 'h1', title: 'Heading 1', class: 'ck-heading_heading1' },
                        { model: 'heading2', view: 'h2', title: 'Heading 2', class: 'ck-heading_heading2' },
                        { model: 'heading3', view: 'h3', title: 'Heading 3', class: 'ck-heading_heading3' }
                    ]
                }
            })
            .then(ckeditor => {
                editor = ckeditor;
                if (currentDoc && currentDoc.content) {
                    editor.setData(currentDoc.content);
                }
            })
            .catch(error => {
                console.error('CKEditor error:', error);
            });

        // Render collaborators
        function renderCollaborators() {
            collaboratorsList.innerHTML = '';
            collaborators.forEach((collab, index) => {
                const row = document.createElement('div');
                row.className = 'collaborator-row';
                row.innerHTML = `
                    <input type="text" class="collab-name" placeholder="Name" value="${collab.name || ''}">
                    <input type="url" class="collab-instagram" placeholder="Instagram URL" value="${collab.instagram || ''}">
                    <button class="remove-collab" onclick="removeCollaborator(${index})">
                        <i class='bx bx-x'></i>
                    </button>
                `;
                collaboratorsList.appendChild(row);
            });
        }

        // Add collaborator
        window.addCollaborator = function() {
            collaborators.push({ name: '', instagram: '' });
            renderCollaborators();
        };

        // Remove collaborator
        window.removeCollaborator = function(index) {
            collaborators.splice(index, 1);
            renderCollaborators();
        };

        document.getElementById('addCollaborator')?.addEventListener('click', addCollaborator);

        // Image preview
        projectImage?.addEventListener('input', (e) => {
            if (e.target.value) {
                imagePreview.src = e.target.value;
                imagePreview.style.display = 'block';
            } else {
                imagePreview.style.display = 'none';
            }
        });

        // Progress slider
        projectProgress?.addEventListener('input', (e) => {
            progressValue.textContent = e.target.value + '%';
        });

        // Save document
        function saveDocument() {
            const collection = docType + 's';
            const content = editor ? editor.getData() : '';
            
            const docData = {
                id: docId || Date.now().toString(),
                title: docTitle.value || 'Untitled',
                content: content,
                createdAt: currentDoc?.createdAt || new Date().toISOString(),
                folder: currentDoc?.folder || null
            };

            if (docType === 'login') {
                docData.url = loginUrl.value;
                docData.username = loginUsername.value;
                docData.password = loginPassword.value;
            } else if (docType === 'project') {
                docData.progress = projectProgress.value;
                docData.image = projectImage.value;
                docData.status = projectStatus.value;
                
                // Get updated collaborator data
                const rows = document.querySelectorAll('.collaborator-row');
                docData.collaborators = Array.from(rows).map(row => ({
                    name: row.querySelector('.collab-name')?.value || '',
                    instagram: row.querySelector('.collab-instagram')?.value || ''
                })).filter(c => c.name || c.instagram);
            }

            if (docId) {
                // Update existing
                const index = vaultData[collection].findIndex(d => d.id === docId);
                if (index !== -1) {
                    vaultData[collection][index] = docData;
                }
            } else {
                // Create new
                vaultData[collection].push(docData);
                sessionStorage.setItem('currentDocId', docData.id);
            }

            localStorage.setItem('boveda_vault', JSON.stringify(vaultData));
            showNotification('Document saved successfully');
        }

        // Show notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                background: white;
                border: 1px solid var(--border);
                padding: 1rem 1.5rem;
                box-shadow: var(--shadow);
                z-index: 3000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Event listeners
        saveBtn.addEventListener('click', saveDocument);

        backBtn.addEventListener('click', () => {
            window.location.href = 'vault.html';
        });

        // Three dots menu
        threeDotsBtn.addEventListener('click', () => {
            dotsDropdown.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!threeDotsBtn.contains(e.target)) {
                dotsDropdown.classList.remove('show');
            }
        });

        // Move to folder
        document.getElementById('moveToFolder').addEventListener('click', () => {
            dotsDropdown.classList.remove('show');
            
            // Populate folder select
            folderSelect.innerHTML = '<option value="">Root (No Folder)</option>';
            vaultData.folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = folder.name;
                if (currentDoc?.folder === folder.id) option.selected = true;
                folderSelect.appendChild(option);
            });
            
            moveModal.classList.add('active');
        });

        closeMoveModal.addEventListener('click', () => moveModal.classList.remove('active'));
        cancelMove.addEventListener('click', () => moveModal.classList.remove('active'));

        confirmMove.addEventListener('click', () => {
            const targetFolder = folderSelect.value;
            
            // Remove from old folder
            vaultData.folders.forEach(folder => {
                if (folder.items && docId) {
                    folder.items = folder.items.filter(id => id !== docId);
                }
            });
            
            // Add to new folder
            if (targetFolder && docId) {
                const folder = vaultData.folders.find(f => f.id === targetFolder);
                if (folder) {
                    folder.items = folder.items || [];
                    if (!folder.items.includes(docId)) {
                        folder.items.push(docId);
                    }
                }
            }
            
            if (currentDoc) {
                currentDoc.folder = targetFolder || null;
            }
            
            localStorage.setItem('boveda_vault', JSON.stringify(vaultData));
            moveModal.classList.remove('active');
            showNotification('Document moved');
        });

        // Duplicate
        document.getElementById('duplicateDoc').addEventListener('click', () => {
            const collection = docType + 's';
            const newDoc = { ...currentDoc, id: Date.now().toString(), title: (currentDoc?.title || 'Untitled') + ' (Copy)' };
            vaultData[collection].push(newDoc);
            localStorage.setItem('boveda_vault', JSON.stringify(vaultData));
            
            sessionStorage.setItem('currentDocId', newDoc.id);
            window.location.reload();
        });

        // Export
        document.getElementById('exportDoc').addEventListener('click', () => {
            const data = JSON.stringify(currentDoc, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentDoc?.title || 'document'}.json`;
            a.click();
        });

        // Delete
        document.getElementById('deleteDoc').addEventListener('click', () => {
            dotsDropdown.classList.remove('show');
            deleteModal.classList.add('active');
        });

        closeDeleteModal.addEventListener('click', () => deleteModal.classList.remove('active'));
        cancelDelete.addEventListener('click', () => deleteModal.classList.remove('active'));

        confirmDelete.addEventListener('click', () => {
            if (docId) {
                const collection = docType + 's';
                vaultData[collection] = vaultData[collection].filter(d => d.id !== docId);
                
                // Remove from folders
                vaultData.folders.forEach(folder => {
                    if (folder.items) {
                        folder.items = folder.items.filter(id => id !== docId);
                    }
                });
                
                localStorage.setItem('boveda_vault', JSON.stringify(vaultData));
                window.location.href = 'vault.html';
            }
        });

        // Add animation styles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
