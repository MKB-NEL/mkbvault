<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>closed / redirect</title>
  <!-- Modern, minimalistic design — clean typography, subtle spacing, no clutter.
       Informs that this link is closed, then auto-redirects to the new link. -->
  <style>
    /* reset & modern base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1a1a1f;
    }

    /* simple container — no card shadows, no heavy borders */
    .container {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    /* main content block — minimal and airy */
    .message-block {
      text-align: center;
    }

    /* subtle indicator — not loud */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #86868b;
      background: #f5f5f7;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: #1c1c1e;
    }

    .desc {
      font-size: 1rem;
      color: #5e5e66;
      margin-bottom: 2rem;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    /* new link highlight — minimal but clear */
    .new-link-preview {
      display: inline-block;
      background: #f5f5f7;
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 460;
      font-family: 'SF Mono', 'JetBrains Mono', monospace;
      color: #0066cc;
      margin-bottom: 2rem;
      border: 0.5px solid #e9e9ef;
    }

    /* redirect status — clean countdown row */
    .redirect-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: #3a3a42;
      background: #fafafc;
      padding: 0.7rem 1rem;
      border-radius: 60px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .timer {
      font-weight: 600;
      font-size: 1rem;
      font-family: monospace;
      background: #ffffff;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      color: #1c1c1e;
      border: 0.5px solid #e2e2e8;
    }

    /* minimal button — border only, no heavy gradient */
    .button-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid #d4d4dc;
      padding: 0.7rem 1.6rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1c1c1e;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      font-family: inherit;
    }

    .button-link:hover {
      background: #f5f5f7;
      border-color: #b0b0bc;
    }

    /* separator line — ultra light */
    .separator {
      width: 32px;
      height: 2px;
      background: #e4e4ec;
      margin: 2rem auto 1rem auto;
      border-radius: 10px;
    }

    /* footnote subtle */
    .footnote {
      font-size: 0.7rem;
      color: #8e8e98;
      margin-top: 1.5rem;
    }

    /* responsive */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.7rem;
      }
      .container {
        max-width: 100%;
      }
      .redirect-row {
        font-size: 0.85rem;
        padding: 0.5rem 0.9rem;
      }
    }

    /* No unnecessary animations, no bloat — just clean & modern */
  </style>
</head>
<body>
<div class="container">
  <div class="message-block">
    <!-- minimal badge: status -->
    <div class="badge">status • closed</div>

    <!-- main message -->
    <h1>this link is closed</h1>
    <div class="desc">
      The previous address is no longer active.<br> 
      A new working link is available.
    </div>

    <!-- new destination preview (clean) -->
    <div class="new-link-preview">
      → linkssocial.vercel.app
    </div>

    <!-- auto-redirection hint + countdown (modern minimal) -->
    <div class="redirect-row">
      <span>redirecting to new link in</span>
      <span class="timer" id="countdownDisplay">3</span>
      <span>seconds</span>
    </div>

    <!-- manual trigger: plain button without heavy styles -->
    <a href="#" id="manualRedirectBtn" class="button-link">
      <span>open new link now</span>
      <span style="font-size:1.1rem;">↗</span>
    </a>

    <div class="separator"></div>
    <div class="footnote">
      automatic redirect • if stuck, click the button
    </div>
  </div>
</div>

<script>
  // NEW DESTINATION — exactly as requested: https://linkssocial.vercel.app/
  const TARGET_URL = "https://linkssocial.vercel.app/";
  
  // countdown start value
  let secondsLeft = 3;
  const countdownElement = document.getElementById("countdownDisplay");
  let redirectTimer = null;
  let redirectDone = false;

  // safe redirect function
  function goToNewLink() {
    if (redirectDone) return;
    redirectDone = true;
    // clear any pending interval/timeout to avoid double redirect
    if (redirectTimer) clearTimeout(redirectTimer);
    window.location.href = TARGET_URL;
  }

  // update countdown UI and schedule next tick
  function tick() {
    if (redirectDone) return;
    if (secondsLeft <= 0) {
      goToNewLink();
      return;
    }
    if (countdownElement) {
      countdownElement.textContent = secondsLeft;
    }
    secondsLeft--;
    redirectTimer = setTimeout(tick, 1000);
  }

  // manual button click: override auto countdown and redirect immediately
  const manualBtn = document.getElementById("manualRedirectBtn");
  if (manualBtn) {
    manualBtn.addEventListener("click", (e) => {
      e.preventDefault();
      if (redirectDone) {
        // already redirecting (or redirected), but just in case
        if (window.location.href !== TARGET_URL) {
          window.location.href = TARGET_URL;
        }
        return;
      }
      // cancel pending auto redirect
      if (redirectTimer) clearTimeout(redirectTimer);
      // go now
      goToNewLink();
    });
  }

  // start countdown only once
  tick();

  // safety net: if something weird happens (e.g., timeout delay stuck)
  // fallback to redirect after max 5 seconds from page load, only if not done
  setTimeout(() => {
    if (!redirectDone) {
      if (redirectTimer) clearTimeout(redirectTimer);
      goToNewLink();
    }
  }, 5000);
</script>
</body>
</html>
