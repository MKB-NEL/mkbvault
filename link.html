<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>mkbvault · secure link hub</title>
  <!-- Iconify (only source for all icons) -->
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-body: #0a0a0a;
      --bg-surface: #111111;
      --bg-elevated: #1a1a1a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --border-grid: #2a2a2a;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --accent-soft: #0f2a3a;
      --row-hover: #1a1f2a;
      --modal-overlay: rgba(0, 0, 0, 0.85);
      --toast-bg: #1e1e1e;
      --glow: 0 0 8px rgba(56, 189, 248, 0.3);
    }
    body {
      background: black;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: 1rem;
      color: var(--text-primary);
      min-height: 100vh;
    }
    .vault-container {
      max-width: 1400px;
      margin: 0 auto;
      background: black;
    }
    .header {
      padding: 1rem 1.5rem;
      background: #000000;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border-grid);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo h1 {
      font-weight: 650;
      font-size: 1.4rem;
      background: linear-gradient(135deg, var(--accent), #a5f3fc);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      background: transparent;
      border: none;
      padding: 0.45rem 1rem;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 2rem;
      transition: 0.15s;
      color: var(--text-primary);
    }
    .btn-primary {
      background: var(--accent);
      color: #000000;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }
    .btn-ghost {
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .user-badge {
      background: var(--accent-soft);
      padding: 0.35rem 1rem;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      border-radius: 2rem;
    }
    .search-section {
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border-grid);
    }
    .search-box {
      flex: 2;
      min-width: 200px;
      display: flex;
      align-items: center;
      background: #000000;
      border: 1px solid var(--border-grid);
      padding: 0.5rem 1.2rem;
      gap: 10px;
      border-radius: 2rem;
      transition: 0.2s;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: var(--glow);
    }
    .search-box input {
      border: none;
      flex: 1;
      outline: none;
      background: transparent;
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .stats-badge {
      font-size: 0.75rem;
      background: #000000;
      padding: 0.4rem 1.2rem;
      color: var(--accent);
      font-weight: 500;
      border: 1px solid var(--border-grid);
      border-radius: 2rem;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    .link-table {
      width: 100%;
      min-width: 680px;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .link-table th {
      text-align: left;
      padding: 1rem;
      background: #000000;
      font-weight: 600;
      color: var(--accent);
      font-size: 0.7rem;
      border-bottom: 1px solid var(--border-grid);
    }
    .link-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-grid);
      background-color: var(--bg-surface);
    }
    .link-table tbody tr:hover td {
      background-color: #0f0f0f;
    }
    .title-cell {
      cursor: pointer;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1a1a;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      font-size: 0.7rem;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
      border-top: 1px solid var(--border-grid);
    }
    .page-btn {
      background: #000000;
      border: 1px solid var(--border-grid);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      border-radius: 2rem;
    }
    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-number {
      background: #000000;
      border: 1px solid var(--border-grid);
      padding: 0.4rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.75rem;
    }
    .page-number.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--toast-bg);
      border-left: 3px solid var(--accent);
      border-radius: 0.75rem;
      padding: 0.8rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      transform: translateX(120%);
      transition: transform 0.2s;
      font-size: 0.8rem;
      border: 1px solid var(--border-grid);
      backdrop-filter: blur(8px);
    }
    .toast.show { transform: translateX(0); }
    .toast.error { border-left-color: #f87171; }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.15s;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-card {
      background: var(--bg-elevated);
      padding: 1.8rem;
      max-width: 420px;
      width: 90%;
      border: 1px solid var(--border-grid);
      border-radius: 1.5rem;
    }
    .modal-card input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: 1px solid var(--border-grid);
      background: #000000;
      color: var(--text-primary);
      border-radius: 1rem;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }
    .auth-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-grid);
    }
    .auth-tab {
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
    }
    .auth-tab.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }
    .detail-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-overlay);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      visibility: hidden;
      opacity: 0;
    }
    .detail-modal.active {
      visibility: visible;
      opacity: 1;
    }
    .detail-card {
      background: var(--bg-elevated);
      max-width: 560px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.8rem;
      border: 1px solid var(--border-grid);
      border-radius: 1.5rem;
    }
    .star-rating {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }
    .star {
      cursor: pointer;
      font-size: 1.8rem;
    }
    .comment-list {
      margin-top: 20px;
      border-top: 1px solid var(--border-grid);
      padding-top: 16px;
    }
    .comment-item {
      background: #000000;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 1rem;
      border: 1px solid var(--border-grid);
      font-size: 0.75rem;
    }
    .comment-input-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .comment-input-group input {
      flex: 1;
      border: 1px solid var(--border-grid);
      background: #000000;
      color: var(--text-primary);
      border-radius: 2rem;
      padding: 10px 16px;
    }
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(56,189,248,0.3);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 760px) {
      body { padding: 0.5rem; }
      .link-table { min-width: 650px; }
    }
  </style>
</head>
<body>
<div class="vault-container">
  <div class="header">
    <div class="logo">
      <span class="iconify" data-icon="mdi:cube-outline" data-width="28"></span>
      <h1>mkbvault</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="headerAddBtn">➕ Add link</button>
      <div id="userArea"></div>
    </div>
  </div>
  <div class="search-section">
    <div class="search-box">
      <span class="iconify" data-icon="mdi:magnify" data-width="18"></span>
      <input type="text" id="searchInput" placeholder="Search title, description or owner...">
    </div>
    <div class="stats-badge" id="totalCount">0 links</div>
  </div>
  <div class="table-wrapper">
    <table class="link-table">
      <thead><tr><th>Title</th><th>Description</th><th>URL</th><th>Rating</th></tr></thead>
      <tbody id="tableBody"><tr><td colspan="4" class="empty-state">⟳ loading...</td></tr></tbody>
    </table>
  </div>
  <div class="pagination" id="paginationContainer"></div>
</div>

<div id="toast" class="toast"><span id="toastMsg"></span></div>

<!-- Auth Modal -->
<div id="authModal" class="modal-overlay">
  <div class="modal-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="signin">🔐 Sign In</button>
      <button class="auth-tab" data-tab="signup">✨ Sign Up</button>
    </div>
    <div id="signinForm">
      <input type="email" id="signinEmail" placeholder="Email">
      <input type="password" id="signinPassword" placeholder="Password">
      <div class="checkbox-group">
        <input type="checkbox" id="rememberMeCheckbox">
        <label>Remember me (stay signed in)</label>
      </div>
      <button class="btn btn-primary" id="confirmAuthBtn" style="width:100%">Sign In</button>
    </div>
    <div id="signupForm" style="display:none">
      <input type="text" id="signupName" placeholder="Full Name">
      <input type="email" id="signupEmail" placeholder="Email">
      <input type="password" id="signupPassword" placeholder="Password">
      <input type="text" id="signupCountry" placeholder="Country">
      <button class="btn btn-primary" id="confirmSignupBtn" style="width:100%">Create Account</button>
    </div>
  </div>
</div>

<!-- Add Link Modal -->
<div id="addLinkModal" class="modal-overlay">
  <div class="modal-card">
    <h3><span class="iconify" data-icon="mdi:link-plus" data-width="24"></span> new link</h3>
    <input type="text" id="addTitle" placeholder="Title *">
    <input type="text" id="addDesc" placeholder="Description">
    <input type="text" id="addUrl" placeholder="https://... *">
    <button class="btn btn-primary" id="confirmAddBtn" style="width:100%">Create link</button>
  </div>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="detail-modal">
  <div class="detail-card">
    <div style="display:flex; justify-content:space-between;">
      <h3 id="detailTitle"></h3>
      <div id="detailActions"></div>
    </div>
    <p id="detailDesc" style="margin:12px 0;"></p>
    <p><a id="detailUrl" target="_blank" style="color:var(--accent);"></a></p>
    <div><strong>⭐ avg: <span id="detailAvgRate">0.0</span> / 5 (<span id="detailVotes">0</span> votes)</strong></div>
    <div style="margin-top:4px;"><strong>👤 contributor: <span id="detailContributor">—</span></strong></div>
    <div class="star-rating" id="detailStars"></div>
    <div><strong>💬 comments</strong></div>
    <div id="detailComments" class="comment-list"></div>
    <div class="comment-input-group">
      <input type="text" id="newCommentText" placeholder="write a comment...">
      <button class="btn btn-primary" id="addCommentBtn">post</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- FIREBASE ----------
    const firebaseConfig = {
      apiKey: "AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0",
      authDomain: "joefootball-15e7a.firebaseapp.com",
      databaseURL: "https://joefootball-15e7a-default-rtdb.firebaseio.com",
      projectId: "joefootball-15e7a",
      storageBucket: "joefootball-15e7a.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    let currentUser = null;
    let allLinks = [];
    let searchQuery = "";
    let currentDetailLink = null;
    let currentPage = 1;
    const rowsPerPage = 25;

    // ---------- UI Helpers ----------
    function showToast(msg, type = "success") {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.add('show');
      if (type === 'error') toast.classList.add('error');
      else toast.classList.remove('error');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

    // ---------- Render Table with Pagination ----------
    function renderTable() {
      let filtered = allLinks.filter(l => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return l.title?.toLowerCase().includes(q) || l.description?.toLowerCase().includes(q) || l.ownerName?.toLowerCase().includes(q);
      });
      document.getElementById('totalCount').innerText = `${filtered.length} link${filtered.length !== 1 ? 's' : ''}`;
      const totalPages = Math.ceil(filtered.length / rowsPerPage);
      if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const paginated = filtered.slice((currentPage-1)*rowsPerPage, currentPage*rowsPerPage);
      const tbody = document.getElementById('tableBody');
      if (paginated.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">📭 no links found</td></tr>';
      } else {
        let html = '';
        for (let link of paginated) {
          const avg = (link.avgRating || 0).toFixed(1);
          html += `<tr>
            <td><span class="title-cell" data-id="${link.id}"><span class="iconify" data-icon="mdi:link-variant" data-width="16"></span> ${escapeHtml(link.title)}</span></td>
            <td>${escapeHtml(link.description?.substring(0,80) || '—')}</td>
            <td class="url-cell"><a href="${escapeHtml(link.url)}" target="_blank">${escapeHtml(link.url.length>45 ? link.url.slice(0,42)+'…' : link.url)}</a></td>
            <td><span class="rating-badge"><span class="iconify" data-icon="mdi:star" data-width="14"></span> ${avg}</span></td>
          </tr>`;
        }
        tbody.innerHTML = html;
      }
      // pagination UI
      const container = document.getElementById('paginationContainer');
      if (totalPages <= 1) { container.innerHTML = ''; return; }
      container.innerHTML = `
        <button class="page-btn" id="firstPage" ${currentPage===1 ? 'disabled' : ''}><span class="iconify" data-icon="mdi:chevron-double-left" data-width="16"></span> First</button>
        <button class="page-btn" id="prevPage" ${currentPage===1 ? 'disabled' : ''}><span class="iconify" data-icon="mdi:chevron-left" data-width="16"></span> Prev</button>
        <span class="page-number active">${currentPage}</span><span class="page-number">/ ${totalPages}</span>
        <button class="page-btn" id="nextPage" ${currentPage===totalPages ? 'disabled' : ''}>Next <span class="iconify" data-icon="mdi:chevron-right" data-width="16"></span></button>
        <button class="page-btn" id="lastPage" ${currentPage===totalPages ? 'disabled' : ''}>Last <span class="iconify" data-icon="mdi:chevron-double-right" data-width="16"></span></button>
      `;
      if (window.Iconify) window.Iconify.scan(container);
      attachTitleClickHandlers();
    }

    function attachTitleClickHandlers() {
      document.querySelectorAll('.title-cell').forEach(el => {
        el.removeEventListener('click', titleClickHandler);
        el.addEventListener('click', titleClickHandler);
      });
    }
    async function titleClickHandler(e) {
      const linkId = e.currentTarget.dataset.id;
      const link = allLinks.find(l => l.id === linkId);
      if (link) openDetailModal(link);
    }

    // ---------- Detail Modal ----------
    function openDetailModal(link) {
      currentDetailLink = link;
      document.getElementById('detailTitle').innerText = link.title;
      document.getElementById('detailDesc').innerText = link.description || 'no description';
      document.getElementById('detailUrl').innerHTML = link.url;
      document.getElementById('detailUrl').href = link.url;
      const avg = (link.avgRating || 0).toFixed(1);
      const votes = Object.keys(link.ratings || {}).length;
      document.getElementById('detailAvgRate').innerText = avg;
      document.getElementById('detailVotes').innerText = votes;
      document.getElementById('detailContributor').innerHTML = `<span class="iconify" data-icon="mdi:account" data-width="14"></span> ${escapeHtml(link.ownerName || 'anonymous')} ${link.ownerCountry ? `(${escapeHtml(link.ownerCountry)})` : ''}`;
      
      const starContainer = document.getElementById('detailStars');
      const userRating = (currentUser && link.ratings && link.ratings[currentUser.uid]) ? link.ratings[currentUser.uid] : 0;
      starContainer.innerHTML = '';
      for (let i=1;i<=5;i++) {
        const starSpan = document.createElement('span');
        starSpan.className = 'star';
        const iconName = i <= userRating ? 'mdi:star' : 'mdi:star-outline';
        starSpan.setAttribute('data-icon', iconName);
        starSpan.setAttribute('data-width', '28');
        starSpan.style.cursor = currentUser ? 'pointer' : 'default';
        starSpan.dataset.star = i;
        if (currentUser) starSpan.addEventListener('click', () => rateLink(link.id, i));
        starSpan.classList.add('iconify');
        starContainer.appendChild(starSpan);
      }
      if (window.Iconify) window.Iconify.scan(starContainer);
      
      const commentsDiv = document.getElementById('detailComments');
      const comments = link.comments || [];
      commentsDiv.innerHTML = comments.map(c => `<div class="comment-item"><b>${escapeHtml(c.author)}</b> · ${new Date(c.timestamp).toLocaleString()}<br>${escapeHtml(c.text)}</div>`).join('');
      if (!currentUser) commentsDiv.innerHTML += `<div style="margin-top:8px;">🔒 sign in to comment</div>`;
      document.getElementById('newCommentText').value = '';
      
      const actionsDiv = document.getElementById('detailActions');
      actionsDiv.innerHTML = '';
      if (currentUser && link.ownerId === currentUser.uid) {
        actionsDiv.innerHTML = `<span class="icon-btn" id="detailEditBtn" style="cursor:pointer;"><span class="iconify" data-icon="mdi:pencil" data-width="20"></span></span>
                                <span class="icon-btn" id="detailDeleteBtn" style="cursor:pointer;"><span class="iconify" data-icon="mdi:trash-can-outline" data-width="20"></span></span>`;
        if(window.Iconify) window.Iconify.scan(actionsDiv);
      }
      document.getElementById('detailModal').classList.add('active');
    }

    async function rateLink(linkId, stars) {
      if (!currentUser) { showToast("sign in to rate", "error"); return; }
      const linkRef = database.ref(`links/${linkId}`);
      const snap = await linkRef.once('value');
      const link = snap.val();
      let ratings = link.ratings || {};
      ratings[currentUser.uid] = stars;
      const values = Object.values(ratings);
      const newAvg = values.reduce((a,b)=>a+b,0)/values.length;
      await linkRef.update({ ratings, avgRating: newAvg });
      if (currentDetailLink && currentDetailLink.id === linkId) {
        currentDetailLink.ratings = ratings;
        currentDetailLink.avgRating = newAvg;
        openDetailModal(currentDetailLink);
      }
      fetchLinks();
    }

    async function addCommentToLink(linkId, text) {
      if (!currentUser) { showToast("sign in to comment", "error"); return; }
      const linkRef = database.ref(`links/${linkId}`);
      const snap = await linkRef.once('value');
      const link = snap.val();
      const comments = link.comments || [];
      comments.push({ author: currentUser.name, text: text, timestamp: Date.now() });
      await linkRef.update({ comments });
      if (currentDetailLink && currentDetailLink.id === linkId) {
        currentDetailLink.comments = comments;
        openDetailModal(currentDetailLink);
      }
      fetchLinks();
    }

    // edit/delete
    async function editLink(linkId) {
      const link = allLinks.find(l => l.id === linkId);
      if (!link || link.ownerId !== currentUser?.uid) return;
      const newTitle = prompt("Edit title:", link.title);
      if (newTitle !== null) {
        const newDesc = prompt("Edit description:", link.description || "");
        await database.ref(`links/${linkId}`).update({ title: newTitle, description: newDesc });
        fetchLinks();
        showToast("link updated", "success");
      }
    }
    async function deleteLink(linkId) {
      if (confirm("delete this link?")) {
        await database.ref(`links/${linkId}`).remove();
        fetchLinks();
        document.getElementById('detailModal').classList.remove('active');
        showToast("deleted", "success");
      }
    }

    // ---------- Add Link ----------
    async function addNewLink(title, desc, url) {
      if (!title || !url) { showToast("Title and URL required", "error"); return false; }
      let finalUrl = url.startsWith('http') ? url : 'https://' + url;
      if (allLinks.some(l => l.url === finalUrl)) { showToast("duplicate URL", "error"); return false; }
      let ownerId = currentUser?.uid || "anonymous";
      let ownerName = currentUser?.name || "anonymous";
      let ownerCountry = currentUser?.country || "";
      const newLink = {
        title, description: desc, url: finalUrl,
        ownerId, ownerName, ownerCountry,
        createdAt: Date.now(), ratings: {}, avgRating: 0, comments: []
      };
      await database.ref('links').push(newLink);
      showToast("link added", "success");
      return true;
    }

    function fetchLinks() {
      database.ref('links').once('value', (snapshot) => {
        const data = snapshot.val();
        allLinks = data ? Object.entries(data).map(([id,val]) => ({ id, ...val, ratings: val.ratings || {}, avgRating: val.avgRating || 0, comments: val.comments || [] })) : [];
        renderTable();
      });
    }

    // ---------- Auth with Persistence ----------
    async function setPersistence(remember) {
      const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
      await auth.setPersistence(persistence);
    }
    async function handleSignIn(email, password) {
      if (!email || !password) { showToast("email & password required", "error"); return false; }
      const remember = document.getElementById('rememberMeCheckbox').checked;
      const btn = document.getElementById('confirmAuthBtn');
      const orig = btn.innerHTML;
      btn.innerHTML = '<span class="loader"></span> signing...';
      btn.disabled = true;
      try {
        await setPersistence(remember);
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const uid = cred.user.uid;
        const snap = await database.ref(`users/${uid}`).once('value');
        if (snap.exists()) {
          currentUser = { uid, name: snap.val().name, email: snap.val().email, country: snap.val().country };
        }
        renderUserUI(); fetchLinks(); closeAuthModal();
        showToast(`welcome back!`, "success");
        return true;
      } catch(e) { showToast(e.message, "error"); return false; }
      finally { btn.innerHTML = orig; btn.disabled = false; }
    }
    async function handleSignUp(name, email, password, country) {
      if (!name || !email || !password) { showToast("all fields required", "error"); return false; }
      await setPersistence(true);
      const btn = document.getElementById('confirmSignupBtn');
      const orig = btn.innerHTML;
      btn.innerHTML = '<span class="loader"></span> creating...';
      btn.disabled = true;
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = cred.user.uid;
        await database.ref(`users/${uid}`).set({ uid, name, email, country: country || "", createdAt: Date.now() });
        currentUser = { uid, name, email, country };
        renderUserUI(); fetchLinks(); closeAuthModal();
        showToast(`account created! welcome ${name}`, "success");
        return true;
      } catch(e) { showToast(e.message, "error"); return false; }
      finally { btn.innerHTML = orig; btn.disabled = false; }
    }

    function renderUserUI() {
      const area = document.getElementById('userArea');
      if (currentUser) {
        area.innerHTML = `<div class="user-badge"><span class="iconify" data-icon="mdi:account-circle" data-width="16"></span> ${escapeHtml(currentUser.name)}</div>
                          <button class="btn btn-ghost" id="logoutBtn"><span class="iconify" data-icon="mdi:logout" data-width="16"></span></button>`;
        document.getElementById('logoutBtn')?.addEventListener('click', () => { auth.signOut(); currentUser = null; renderUserUI(); fetchLinks(); showToast("logged out", "success"); });
      } else {
        area.innerHTML = `<button class="btn btn-ghost" id="showAuthBtn"><span class="iconify" data-icon="mdi:login" data-width="16"></span> sign in</button>`;
        document.getElementById('showAuthBtn')?.addEventListener('click', () => openAuthModal());
      }
      if(window.Iconify) window.Iconify.scan(area);
    }

    // Modal toggles
    function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
    function openAddLinkModal() { document.getElementById('addLinkModal').classList.add('active'); }
    function closeAddLinkModal() { document.getElementById('addLinkModal').classList.remove('active'); }

    // ---------- Event Listeners (no conflicts, single bind) ----------
    document.getElementById('headerAddBtn')?.addEventListener('click', openAddLinkModal);
    document.getElementById('confirmAddBtn')?.addEventListener('click', async () => {
      const title = document.getElementById('addTitle').value.trim();
      const desc = document.getElementById('addDesc').value.trim();
      const url = document.getElementById('addUrl').value.trim();
      await addNewLink(title, desc, url);
      fetchLinks();
      closeAddLinkModal();
      document.getElementById('addTitle').value = '';
      document.getElementById('addDesc').value = '';
      document.getElementById('addUrl').value = '';
    });
    document.getElementById('addLinkModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('addLinkModal')) closeAddLinkModal(); });
    document.getElementById('addCommentBtn')?.addEventListener('click', () => {
      if (!currentDetailLink) return;
      const text = document.getElementById('newCommentText').value.trim();
      if (!text) return;
      addCommentToLink(currentDetailLink.id, text);
    });
    document.getElementById('detailModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('detailModal')) document.getElementById('detailModal').classList.remove('active'); });
    document.getElementById('searchInput')?.addEventListener('input', (e) => { searchQuery = e.target.value; currentPage = 1; renderTable(); });
    document.getElementById('paginationContainer')?.addEventListener('click', (e) => {
      const btn = e.target.closest('.page-btn');
      if (!btn) return;
      const filteredCount = allLinks.filter(l => !searchQuery || l.title?.toLowerCase().includes(searchQuery.toLowerCase()) || l.description?.toLowerCase().includes(searchQuery.toLowerCase()) || l.ownerName?.toLowerCase().includes(searchQuery.toLowerCase())).length;
      const total = Math.ceil(filteredCount / rowsPerPage);
      if (btn.id === 'firstPage' && currentPage !== 1) { currentPage = 1; renderTable(); }
      else if (btn.id === 'prevPage' && currentPage > 1) { currentPage--; renderTable(); }
      else if (btn.id === 'nextPage' && currentPage < total) { currentPage++; renderTable(); }
      else if (btn.id === 'lastPage' && currentPage !== total) { currentPage = total; renderTable(); }
    });
    document.getElementById('detailActions')?.addEventListener('click', (e) => {
      const btn = e.target.closest('.icon-btn');
      if (!btn) return;
      if (btn.id === 'detailEditBtn' && currentDetailLink) editLink(currentDetailLink.id);
      else if (btn.id === 'detailDeleteBtn' && currentDetailLink) deleteLink(currentDetailLink.id);
    });

    // Auth Tabs
    const signinDiv = document.getElementById('signinForm');
    const signupDiv = document.getElementById('signupForm');
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        if (tab.dataset.tab === 'signin') {
          signinDiv.style.display = 'block';
          signupDiv.style.display = 'none';
        } else {
          signinDiv.style.display = 'none';
          signupDiv.style.display = 'block';
        }
      });
    });
    document.getElementById('confirmAuthBtn')?.addEventListener('click', () => {
      handleSignIn(document.getElementById('signinEmail').value.trim(), document.getElementById('signinPassword').value);
    });
    document.getElementById('confirmSignupBtn')?.addEventListener('click', () => {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pwd = document.getElementById('signupPassword').value;
      const country = document.getElementById('signupCountry').value.trim();
      handleSignUp(name, email, pwd, country);
    });
    document.getElementById('authModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('authModal')) closeAuthModal(); });

    // Firebase state listener (restores session on refresh)
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const uid = user.uid;
        const snap = await database.ref(`users/${uid}`).once('value');
        if (snap.exists()) {
          currentUser = { uid, name: snap.val().name, email: snap.val().email, country: snap.val().country };
        } else {
          currentUser = { uid, name: user.email?.split('@')[0] || 'user', email: user.email, country: '' };
        }
        renderUserUI();
        fetchLinks();
      } else {
        currentUser = null;
        renderUserUI();
        fetchLinks();
      }
    });

    // Initial call
    renderUserUI();
  })();
</script>
</body>
</html>
