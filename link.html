<script>
(function() {
  const firebaseConfig = { apiKey: "AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0", authDomain: "joefootball-15e7a.firebaseapp.com", projectId: "joefootball-15e7a", storageBucket: "joefootball-15e7a.firebasestorage.app" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  let currentUser = null, allLinks = [], searchQuery = "", currentSelectedLink = null, currentPage = 1;
  const rowsPerPage = 50;
  
  const showToast = (msg, type = "success") => { const t = document.getElementById('toast'), tm = document.getElementById('toastMsg'); if(!t) return; tm.innerText = msg; t.classList.add('show'); if(type === 'error') t.classList.add('error'); else t.classList.remove('error'); setTimeout(() => t.classList.remove('show'), 3000); };
  const escapeHtml = str => { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); };
  const getRandomColor = (username) => { let hash = 0; for(let i=0;i<username.length;i++) hash = username.charCodeAt(i) + ((hash << 5) - hash); return `hsl(${Math.abs(hash % 360)}, 70%, 60%)`; };
  const openSidebar = () => document.getElementById('rightSidebar')?.classList.add('active');
  const closeSidebar = () => { document.getElementById('rightSidebar')?.classList.remove('active'); currentSelectedLink = null; };
  document.getElementById('closeSidebarBtn')?.addEventListener('click', closeSidebar);
  
  // Advanced search algorithm: uses keyword matching with relevance scoring
  function calculateRelevanceScore(link, query) {
    if (!query) return 1;
    const q = query.toLowerCase().trim();
    const title = (link.title || '').toLowerCase();
    const desc = (link.description || '').toLowerCase();
    const owner = (link.ownerName || '').toLowerCase();
    
    let score = 0;
    const words = q.split(/\s+/);
    
    for (const word of words) {
      if (word.length < 2) continue;
      // Title matches are weighted highest
      if (title.includes(word)) score += 10;
      if (title === word) score += 5;
      // Description matches
      if (desc.includes(word)) score += 3;
      // Username matches
      if (owner.includes(word)) score += 2;
      // Partial word matches (for better search results)
      if (title.split(/\s+/).some(t => t.startsWith(word) || t.includes(word))) score += 4;
      if (desc.split(/\s+/).some(d => d.startsWith(word) || d.includes(word))) score += 2;
    }
    
    // Bonus for exact phrase match
    if (title.includes(q)) score += 15;
    if (desc.includes(q)) score += 8;
    
    return score;
  }
  
  // Hybrid sorting: combines recency, rating, and random factor
  function sortLinks(links) {
    const now = Date.now();
    const maxAge = 30 * 24 * 60 * 60 * 1000; // 30 days
    
    return [...links].sort((a, b) => {
      // Recency score (newer = higher)
      const aAge = now - (a.createdAt || 0);
      const bAge = now - (b.createdAt || 0);
      const aRecency = Math.max(0, 1 - (aAge / maxAge));
      const bRecency = Math.max(0, 1 - (bAge / maxAge));
      
      // Rating score (0-5 normalized)
      const aRating = (a.avgRating || 0) / 5;
      const bRating = (b.avgRating || 0) / 5;
      
      // Random factor (±0.2 for slight variation)
      const aRandom = (a._sortRandom || 0) * 0.2;
      const bRandom = (b._sortRandom || 0) * 0.2;
      
      // Combined score: 40% recency, 40% rating, 20% random
      const aScore = (aRecency * 0.4) + (aRating * 0.4) + (aRandom * 0.2);
      const bScore = (bRecency * 0.4) + (bRating * 0.4) + (bRandom * 0.2);
      
      return bScore - aScore;
    });
  }
  
  async function rateLink(linkId, stars) {
    if (!currentUser) { showToast("sign in to rate", "error"); return; }
    const linkRef = db.collection('links').doc(linkId);
    const doc = await linkRef.get();
    if (!doc.exists) return;
    const link = doc.data();
    let ratings = link.ratings || {};
    ratings[currentUser.uid] = stars;
    const values = Object.values(ratings);
    const newAvg = values.reduce((a,b)=>a+b,0)/values.length;
    await linkRef.update({ ratings, avgRating: newAvg });
    if (currentSelectedLink && currentSelectedLink.id === linkId) { currentSelectedLink.ratings = ratings; currentSelectedLink.avgRating = newAvg; renderSidebar(currentSelectedLink); }
    await fetchLinks();
  }
  
  async function addCommentToLink(linkId, text) {
    if (!currentUser) return;
    const linkRef = db.collection('links').doc(linkId);
    const doc = await linkRef.get();
    if (!doc.exists) return;
    const link = doc.data();
    const comments = [...(link.comments || []), { author: currentUser.username, text: text, timestamp: Date.now() }];
    await linkRef.update({ comments });
    if (currentSelectedLink && currentSelectedLink.id === linkId) { currentSelectedLink.comments = comments; renderSidebar(currentSelectedLink); }
    await fetchLinks();
  }
  
  function renderSidebar(link) {
    const container = document.getElementById('sidebarDetail');
    if (!container) return;
    if (!link) { container.innerHTML = `<div class="empty-detail"><span class="iconify" data-icon="mdi:link-variant" data-width="48"></span><p>Select a link from the table</p></div>`; if(window.Iconify) window.Iconify.scan(container); return; }
    const avg = (link.avgRating || 0).toFixed(1);
    const votes = Object.keys(link.ratings || {}).length;
    const userRating = (currentUser && link.ratings?.[currentUser.uid]) ? link.ratings[currentUser.uid] : 0;
    let starsHtml = '';
    for(let i=1;i<=5;i++) { const active = i <= userRating ? 'mdi:star' : 'mdi:star-outline'; starsHtml += `<span class="sidebar-star" data-star="${i}" style="cursor:${currentUser ? 'pointer' : 'default'};"><span class="iconify" data-icon="${active}" data-width="24"></span></span>`; }
    const commentsHtml = (link.comments || []).map(c => `<div class="sidebar-comment-item"><span class="comment-username" style="color: ${getRandomColor(c.author)};">@${escapeHtml(c.author)}</span> ${escapeHtml(c.text)}</div>`).join('');
    container.innerHTML = `
      <h4>${escapeHtml(link.title)}</h4>
      <p>${escapeHtml(link.description || 'no description')}</p>
      <p><a href="${escapeHtml(link.url)}" target="_blank" class="detail-link"><span class="iconify" data-icon="mdi:open-in-new" data-width="14"></span> ${escapeHtml(link.url)}</a></p>
      <div><strong>⭐ ${avg} / 5 (${votes} votes)</strong></div>
      <div><strong>👤 contributor:</strong> @${escapeHtml(link.ownerName || 'anonymous')}</div>
      <div class="sidebar-stars" id="sidebarStars">${starsHtml}</div>
      <div><strong>💬 comments</strong></div>
      <div class="sidebar-comment-list" id="sidebarComments">${commentsHtml || '<div style="color:gray;">no comments yet</div>'}</div>
      <div class="sidebar-comment-input"><input type="text" id="sidebarCommentInput" placeholder="write a comment..." ${!currentUser ? 'disabled' : ''}><button class="btn btn-primary" id="sidebarPostComment" style="padding:0.4rem 1rem;" ${!currentUser ? 'disabled' : ''}><span class="iconify" data-icon="mdi:send" data-width="14"></span> post</button></div>
    `;
    if(window.Iconify) window.Iconify.scan(container);
    if(currentUser) { document.querySelectorAll('.sidebar-star').forEach(star => { const val = parseInt(star.dataset.star); star.onclick = () => rateLink(link.id, val); }); const btn = document.getElementById('sidebarPostComment'), inp = document.getElementById('sidebarCommentInput'); if(btn && inp) { btn.onclick = async () => { const txt = inp.value.trim(); if(txt) { await addCommentToLink(link.id, txt); inp.value = ''; } }; inp.onkeypress = (e) => { if(e.key === 'Enter') { e.preventDefault(); btn.click(); } }; } }
  }
  
  async function fetchLinks() { 
    try { 
      const snap = await db.collection('links').orderBy('createdAt', 'desc').get(); 
      allLinks = snap.docs.map(doc => ({ 
        id: doc.id, 
        ...doc.data(), 
        ratings: doc.data().ratings || {}, 
        avgRating: doc.data().avgRating || 0, 
        comments: doc.data().comments || [],
        _sortRandom: Math.random() // Add random factor for sorting
      })); 
      renderTable(); 
    } catch(e) { showToast("Error loading links", "error"); } 
  }
  
  async function addNewLink(title, desc, url) { 
    if(!title || !url) { showToast("Title and URL required", "error"); return false; } 
    let finalUrl = url.startsWith('http') ? url : 'https://' + url; 
    if(allLinks.some(l => l.url === finalUrl)) { showToast("duplicate URL", "error"); return false; } 
    const newLink = { 
      title, description: desc, url: finalUrl, 
      ownerId: currentUser?.uid || "anonymous", 
      ownerName: currentUser?.username || "anonymous", 
      ownerCountry: currentUser?.country || "", 
      createdAt: Date.now(), ratings: {}, avgRating: 0, comments: [] 
    }; 
    await db.collection('links').add(newLink); 
    showToast("link added", "success"); 
    await fetchLinks(); 
    return true; 
  }
  
  function truncateDescription(desc, maxLen = 60) { 
    if(!desc || desc.length <= maxLen) return escapeHtml(desc) || '—'; 
    const short = escapeHtml(desc.substring(0, maxLen)); 
    const full = escapeHtml(desc).replace(/'/g, "\\'");
    return `${short}<span class="read-more" onclick="this.parentElement.innerHTML='${full}'">....read more</span>`; 
  }
  
  function renderTable() {
    // Apply search with relevance scoring
    let filtered = allLinks.map(link => {
      const relevance = calculateRelevanceScore(link, searchQuery);
      return { ...link, _relevance: relevance };
    }).filter(link => link._relevance > 0 || !searchQuery);
    
    // Sort by relevance first, then by hybrid score
    if (searchQuery) {
      filtered.sort((a, b) => b._relevance - a._relevance);
    } else {
      filtered = sortLinks(filtered);
    }
    
    document.getElementById('totalCount').innerText = `${filtered.length} link${filtered.length !== 1 ? 's' : ''}`;
    const totalPages = Math.ceil(filtered.length / rowsPerPage);
    if(currentPage > totalPages && totalPages > 0) currentPage = totalPages; 
    if(currentPage < 1) currentPage = 1;
    const paginated = filtered.slice((currentPage-1)*rowsPerPage, currentPage*rowsPerPage);
    const tbody = document.getElementById('tableBody'); 
    if(!tbody) return;
    
    if(paginated.length === 0) { 
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state">📭 no links found</td></tr>'; 
    } else { 
      let html = ''; 
      for(let link of paginated) { 
        const avg = (link.avgRating || 0).toFixed(1); 
        html += `<tr>
          <td><span class="title-cell" data-id="${link.id}"><span class="iconify" data-icon="mdi:link-variant" data-width="16"></span> ${escapeHtml(link.title)}</span></td>
          <td class="description-text">${truncateDescription(link.description, 60)}</td>
          <td><a href="${escapeHtml(link.url)}" target="_blank">${escapeHtml(link.url.length>40 ? link.url.slice(0,37)+'…' : link.url)}</a></td>
          <td><span class="rating-badge"><span class="iconify" data-icon="mdi:star" data-width="16" style="color:#fbbf24"></span> ${avg}</span></td>
        </tr>`; 
      } 
      tbody.innerHTML = html; 
    }
    
    const container = document.getElementById('paginationContainer'); 
    if(container) { 
      if(totalPages <= 1) container.innerHTML = ''; 
      else container.innerHTML = `
        <button class="page-btn" id="firstPage" ${currentPage===1 ? 'disabled' : ''}><span class="iconify" data-icon="mdi:chevron-double-left" data-width="16"></span> First</button>
        <button class="page-btn" id="prevPage" ${currentPage===1 ? 'disabled' : ''}><span class="iconify" data-icon="mdi:chevron-left" data-width="16"></span> Prev</button>
        <span class="page-number active">${currentPage}</span><span class="page-number">/ ${totalPages}</span>
        <button class="page-btn" id="nextPage" ${currentPage===totalPages ? 'disabled' : ''}>Next <span class="iconify" data-icon="mdi:chevron-right" data-width="16"></span></button>
        <button class="page-btn" id="lastPage" ${currentPage===totalPages ? 'disabled' : ''}>Last <span class="iconify" data-icon="mdi:chevron-double-right" data-width="16"></span></button>
      `; 
      if(window.Iconify) window.Iconify.scan(container); 
    }
    
    document.querySelectorAll('.title-cell').forEach(el => { 
      el.onclick = () => { 
        const link = allLinks.find(l => l.id === el.dataset.id); 
        if(link) { 
          currentSelectedLink = link; 
          renderSidebar(link); 
          openSidebar(); 
        } 
      }; 
    });
  }
  
  async function updateUsername(newUsername) { 
    if(!currentUser || !newUsername?.trim()) { showToast("Username cannot be empty", "error"); return; } 
    await db.collection('users').doc(currentUser.uid).update({ username: newUsername }); 
    currentUser.username = newUsername; 
    renderUserUI(); 
    showToast(`Username updated to @${newUsername}`, "success"); 
    await fetchLinks(); 
    closeEditUsernameModal(); 
  }
  
  async function handleSignIn(email, password) { 
    if(!email || !password) { showToast("email & password required", "error"); return false; } 
    const remember = document.getElementById('rememberMeCheckbox')?.checked || false; 
    const btn = document.getElementById('confirmAuthBtn'); 
    if(!btn) return false; 
    const orig = btn.innerHTML; 
    btn.innerHTML = '<span class="loader"></span>'; 
    btn.disabled = true; 
    try { 
      await auth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION); 
      const cred = await auth.signInWithEmailAndPassword(email, password); 
      const uid = cred.user.uid; 
      const userDoc = await db.collection('users').doc(uid).get(); 
      if(userDoc.exists) currentUser = { uid, ...userDoc.data() }; 
      else currentUser = { uid, username: email.split('@')[0], name: email.split('@')[0], email, country: '' }; 
      renderUserUI(); 
      await fetchLinks(); 
      closeAuthModal(); 
      showToast(`welcome @${currentUser.username}!`, "success"); 
      return true; 
    } catch(e) { showToast(e.message, "error"); return false; } 
    finally { btn.innerHTML = orig; btn.disabled = false; } 
  }
  
  async function handleSignUp(username, name, email, password, country) { 
    if(!username || !email || !password) { showToast("Username, email & password required", "error"); return false; } 
    const btn = document.getElementById('confirmSignupBtn'); 
    if(!btn) return false; 
    const orig = btn.innerHTML; 
    btn.innerHTML = '<span class="loader"></span>'; 
    btn.disabled = true; 
    try { 
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); 
      const cred = await auth.createUserWithEmailAndPassword(email, password); 
      const uid = cred.user.uid; 
      await db.collection('users').doc(uid).set({ uid, username, name: name || username, email, country: country || "", createdAt: Date.now() }); 
      currentUser = { uid, username, name: name || username, email, country }; 
      renderUserUI(); 
      await fetchLinks(); 
      closeAuthModal(); 
      showToast(`welcome @${username}!`, "success"); 
      return true; 
    } catch(e) { showToast(e.message, "error"); return false; } 
    finally { btn.innerHTML = orig; btn.disabled = false; } 
  }
  
  function renderUserUI() { 
    const area = document.getElementById('userArea'); 
    if(!area) return; 
    if(currentUser) { 
      area.innerHTML = `<div class="user-badge" id="userBadge"><span class="iconify" data-icon="mdi:account-circle" data-width="18"></span> @${escapeHtml(currentUser.username || currentUser.name)}</div><button class="btn btn-ghost" id="logoutBtn"><span class="iconify" data-icon="mdi:logout" data-width="16"></span></button>`; 
      document.getElementById('userBadge')?.addEventListener('click', () => openEditUsernameModal()); 
      document.getElementById('logoutBtn')?.addEventListener('click', () => { auth.signOut(); currentUser = null; currentSelectedLink = null; closeSidebar(); renderUserUI(); fetchLinks(); showToast("logged out", "success"); }); 
    } else { 
      area.innerHTML = `<button class="btn btn-ghost" id="showAuthBtn"><span class="iconify" data-icon="mdi:login" data-width="16"></span> sign in</button>`; 
      document.getElementById('showAuthBtn')?.addEventListener('click', () => openAuthModal()); 
    } 
    if(window.Iconify) window.Iconify.scan(area); 
  }
  
  function openAuthModal() { document.getElementById('authModal')?.classList.add('active'); } 
  function closeAuthModal() { document.getElementById('authModal')?.classList.remove('active'); }
  function openAddLinkModal() { document.getElementById('addLinkModal')?.classList.add('active'); } 
  function closeAddLinkModal() { document.getElementById('addLinkModal')?.classList.remove('active'); }
  function openEditUsernameModal() { const m = document.getElementById('editUsernameModal'); if(m) m.classList.add('active'); const inp = document.getElementById('editUsernameInput'); if(inp && currentUser) inp.value = currentUser.username; }
  function closeEditUsernameModal() { document.getElementById('editUsernameModal')?.classList.remove('active'); }
  
  function setupListeners() {
    document.getElementById('headerAddBtn')?.addEventListener('click', openAddLinkModal);
    document.getElementById('confirmAddBtn')?.addEventListener('click', async () => { 
      await addNewLink(document.getElementById('addTitle')?.value.trim() || '', document.getElementById('addDesc')?.value.trim() || '', document.getElementById('addUrl')?.value.trim() || ''); 
      closeAddLinkModal(); 
      if(document.getElementById('addTitle')) document.getElementById('addTitle').value = ''; 
      if(document.getElementById('addDesc')) document.getElementById('addDesc').value = ''; 
      if(document.getElementById('addUrl')) document.getElementById('addUrl').value = ''; 
    });
    document.getElementById('addLinkModal')?.addEventListener('click', e => { if(e.target === document.getElementById('addLinkModal')) closeAddLinkModal(); });
    const search = document.getElementById('searchInput'); 
    if(search) { 
      search.addEventListener('input', e => { searchQuery = e.target.value; currentPage = 1; renderTable(); }); 
      search.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); search.focus(); } }); 
    }
    document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput')?.focus(); } });
    document.getElementById('paginationContainer')?.addEventListener('click', e => { 
      const btn = e.target.closest('.page-btn'); 
      if(!btn) return; 
      let filtered = allLinks.filter(l => calculateRelevanceScore(l, searchQuery) > 0 || !searchQuery);
      const total = Math.ceil(filtered.length / rowsPerPage); 
      if(btn.id === 'firstPage' && currentPage !== 1) { currentPage = 1; renderTable(); } 
      else if(btn.id === 'prevPage' && currentPage > 1) { currentPage--; renderTable(); } 
      else if(btn.id === 'nextPage' && currentPage < total) { currentPage++; renderTable(); } 
      else if(btn.id === 'lastPage' && currentPage !== total) { currentPage = total; renderTable(); } 
    });
    const signinDiv = document.getElementById('signinForm'), signupDiv = document.getElementById('signupForm'); 
    document.querySelectorAll('.auth-tab').forEach(tab => { 
      tab.addEventListener('click', () => { 
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active')); 
        tab.classList.add('active'); 
        if(tab.dataset.tab === 'signin') { signinDiv.style.display = 'block'; signupDiv.style.display = 'none'; } 
        else { signinDiv.style.display = 'none'; signupDiv.style.display = 'block'; } 
      }); 
    });
    document.getElementById('confirmAuthBtn')?.addEventListener('click', () => handleSignIn(document.getElementById('signinEmail')?.value.trim() || '', document.getElementById('signinPassword')?.value || ''));
    document.getElementById('confirmSignupBtn')?.addEventListener('click', () => handleSignUp(document.getElementById('signupUsername')?.value.trim() || '', document.getElementById('signupName')?.value.trim() || '', document.getElementById('signupEmail')?.value.trim() || '', document.getElementById('signupPassword')?.value || '', document.getElementById('signupCountry')?.value.trim() || ''));
    document.getElementById('authModal')?.addEventListener('click', e => { if(e.target === document.getElementById('authModal')) closeAuthModal(); });
    document.getElementById('confirmEditUsernameBtn')?.addEventListener('click', () => updateUsername(document.getElementById('editUsernameInput')?.value.trim() || ''));
    document.getElementById('editUsernameModal')?.addEventListener('click', e => { if(e.target === document.getElementById('editUsernameModal')) closeEditUsernameModal(); });
  }
  
  auth.onAuthStateChanged(async user => { 
    if(user) { 
      const uid = user.uid; 
      const doc = await db.collection('users').doc(uid).get(); 
      if(doc.exists) currentUser = { uid, ...doc.data() }; 
      else currentUser = { uid, username: user.email?.split('@')[0] || 'user', name: user.email?.split('@')[0] || 'user', email: user.email, country: '' }; 
      renderUserUI(); 
      await fetchLinks(); 
    } else { 
      currentUser = null; 
      currentSelectedLink = null; 
      closeSidebar(); 
      renderUserUI(); 
      await fetchLinks(); 
    } 
  });
  
  setupListeners(); 
  renderUserUI(); 
  fetchLinks();
})();
</script>
</body>
</html>
