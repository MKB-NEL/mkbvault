<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boveda · living wallpaper</title>
    <!-- Tailwind + Inter font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background: #0a0c12; /* deep base */
        }

        /* ===== LIVING WALLPAPER ===== */
        /* cinematic moving blur layers - deep, moody, constantly evolving */
        .wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: #080b14;
        }

        /* blur orbs with deep, saturated colors that move independently */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px) saturate(200%);
            mix-blend-mode: screen;
            opacity: 0.6;
            animation: orbital 35s cubic-bezier(0.45, 0.05, 0.2, 0.99) infinite alternate;
            will-change: transform, opacity, background;
        }

        /* deep purple orb - moves diagonally */
        .orb-1 {
            width: 70vh;
            height: 70vh;
            background: radial-gradient(circle at 30% 30%, #8b5cf6, #4c1d95);
            top: -10%;
            left: -10%;
            animation: float1 28s ease-in-out infinite alternate;
        }

        /* deep blue orb - slow, sweeping motion */
        .orb-2 {
            width: 90vh;
            height: 90vh;
            background: radial-gradient(circle at 70% 40%, #3b82f6, #1e3a8a);
            bottom: -30%;
            right: -15%;
            animation: float2 32s ease-in-out infinite alternate;
        }

        /* deep magenta orb - subtle movement */
        .orb-3 {
            width: 60vh;
            height: 60vh;
            background: radial-gradient(circle at 50% 50%, #ec4899, #831843);
            top: 40%;
            left: 20%;
            animation: float3 25s ease-in-out infinite alternate;
        }

        /* deep indigo orb - large and moody */
        .orb-4 {
            width: 100vh;
            height: 100vh;
            background: radial-gradient(circle at 20% 80%, #6366f1, #312e81);
            bottom: 10%;
            left: 30%;
            animation: float4 40s ease-in-out infinite alternate;
        }

        /* deep crimson orb - adds warmth */
        .orb-5 {
            width: 50vh;
            height: 50vh;
            background: radial-gradient(circle at 60% 20%, #ef4444, #7f1d1d);
            top: 60%;
            right: 25%;
            animation: float5 22s ease-in-out infinite alternate;
        }

        /* deep teal orb - cool contrast */
        .orb-6 {
            width: 80vh;
            height: 80vh;
            background: radial-gradient(circle at 40% 70%, #14b8a6, #115e59);
            top: -20%;
            right: 30%;
            animation: float6 38s ease-in-out infinite alternate;
        }

        /* secondary layer with different blend for depth */
        .orb-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px) saturate(180%);
            mix-blend-mode: soft-light;
            opacity: 0.4;
            animation: orbitalSlow 45s ease-in-out infinite alternate;
        }

        .glow-1 {
            width: 120vh;
            height: 120vh;
            background: #a78bfa;
            top: -20%;
            left: -10%;
            animation: glowFloat1 50s ease-in-out infinite alternate;
        }

        .glow-2 {
            width: 100vh;
            height: 100vh;
            background: #60a5fa;
            bottom: -30%;
            right: -10%;
            animation: glowFloat2 55s ease-in-out infinite alternate;
        }

        /* complex movement patterns */
        @keyframes float1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(15%, 10%) scale(1.3); opacity: 0.7; }
            100% { transform: translate(8%, 20%) scale(1.1); opacity: 0.6; }
        }
        @keyframes float2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(-20%, -15%) scale(1.4); opacity: 0.8; }
            100% { transform: translate(-10%, -25%) scale(1.2); opacity: 0.6; }
        }
        @keyframes float3 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(10%, -20%) scale(1.2); opacity: 0.6; }
            100% { transform: translate(-10%, 5%) scale(0.9); opacity: 0.5; }
        }
        @keyframes float4 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(-15%, 10%) scale(1.5); opacity: 0.7; }
            100% { transform: translate(10%, -10%) scale(1.2); opacity: 0.6; }
        }
        @keyframes float5 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(20%, -10%) scale(1.3); opacity: 0.6; }
            100% { transform: translate(15%, 15%) scale(1.1); opacity: 0.5; }
        }
        @keyframes float6 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(-20%, 20%) scale(1.4); opacity: 0.7; }
            100% { transform: translate(-25%, -5%) scale(1.1); opacity: 0.5; }
        }
        @keyframes glowFloat1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(10%, -15%) scale(1.3); opacity: 0.5; }
        }
        @keyframes glowFloat2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(-15%, 10%) scale(1.4); opacity: 0.5; }
        }

        /* subtle noise overlay for texture */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.02);
            backdrop-filter: blur(0.5px);
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
            mix-blend-mode: overlay;
        }

        /* Scrollable content */
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        /* Floating card - pure white blur, no borders */
        .ethereal-card {
            width: 100%;
            max-width: 480px;
            padding: 3rem 2.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 3.5rem;
            box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* NO BORDERS, NO BACKGROUNDS on elements */
        input, button, .tab, .logo-container, form, div {
            background: transparent !important;
            border: none !important;
            outline: none !important;
        }

        /* Input styling - subtle bottom line */
        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            z-index: 2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .modern-input {
            width: 100%;
            padding: 1rem 0 1rem 2.5rem;
            font-size: 1.1rem;
            color: white;
            font-weight: 500;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2) !important;
            transition: all 0.2s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .modern-input:focus {
            border-bottom-color: rgba(255, 255, 255, 0.8) !important;
        }

        .modern-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            font-size: 1rem;
        }

        /* Tabs - white text */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 2rem 0 2.5rem;
        }

        .tab {
            font-size: 1.2rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.2s;
            padding: 0.25rem 0;
            position: relative;
        }

        .tab.active {
            color: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: white;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Button - floating with glass effect */
        .elegant-btn {
            width: 100%;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.15) !important;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 3rem !important;
            cursor: pointer;
            transition: all 0.3s;
            margin: 1.5rem 0 0.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.4) !important;
        }

        .elegant-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 25px 35px -8px rgba(0, 0, 0, 0.5) !important;
        }

        .elegant-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Logo - white with glow */
        .logo {
            text-align: center;
            margin-bottom: 1rem;
        }

        .logo-icon {
            font-size: 4rem;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }

        .logo-text {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            line-height: 1.2;
        }

        .logo-tagline {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            font-weight: 400;
            margin-top: 0.25rem;
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
        }

        /* Warning - minimal */
        .warning-message {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: rgba(255, 200, 150, 0.9);
            font-size: 0.9rem;
            margin: 1rem 0;
            padding: 0.5rem 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* Grid for 2-column fields */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        /* Messages */
        .error-msg {
            color: #ffa7a7;
            font-size: 0.85rem;
            text-align: center;
            min-height: 1.5rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .success-msg {
            color: #a7ffb0;
            font-size: 0.85rem;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* spinner */
        .spinner {
            width: 1.3rem;
            height: 1.3rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Hide/Show */
        .hidden {
            display: none !important;
        }

        /* Master welcome */
        .master-welcome {
            color: white;
            font-size: 1.1rem;
            font-weight: 400;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 1.2rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- LIVING WALLPAPER - cinematic moving blur layers -->
    <div class="wallpaper">
        <!-- primary moving orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
        <div class="orb orb-6"></div>
        
        <!-- secondary glow layers for depth -->
        <div class="orb-glow glow-1"></div>
        <div class="orb-glow glow-2"></div>
        
        <!-- subtle noise texture -->
        <div class="noise"></div>
    </div>

    <!-- Content area with scroll -->
    <div class="content">
        <!-- Ethereal card - pure white blur -->
        <div class="ethereal-card">
            
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">🔐</div>
                <div class="logo-text">BOVEDA</div>
                <div class="logo-tagline">your private digital safe</div>
            </div>

            <!-- Tabs -->
            <div class="tab-container" id="tabSwitcher">
                <button class="tab active" id="tabSignIn">Sign In</button>
                <button class="tab" id="tabSignUp">Sign Up</button>
            </div>

            <!-- Forms Container -->
            <div id="formContainer">

                <!-- SIGN IN FORM -->
                <form id="signInForm" class="space-y-2">
                    <div class="input-wrapper">
                        <i class='bx bx-envelope input-icon'></i>
                        <input type="email" id="signinEmail" class="modern-input" placeholder="Email address">
                    </div>
                    <div class="input-wrapper">
                        <i class='bx bx-lock-alt input-icon'></i>
                        <input type="password" id="signinPassword" class="modern-input" placeholder="Account password">
                    </div>
                    <button type="submit" id="signinBtn" class="elegant-btn">Continue</button>
                    <div id="signinError" class="error-msg"></div>
                </form>

                <!-- SIGN UP FORM -->
                <form id="signUpForm" class="space-y-2 hidden">
                    <div class="input-wrapper">
                        <i class='bx bx-user input-icon'></i>
                        <input type="text" id="signupName" class="modern-input" placeholder="Full name">
                    </div>
                    <div class="input-wrapper">
                        <i class='bx bx-envelope input-icon'></i>
                        <input type="email" id="signupEmail" class="modern-input" placeholder="Email address">
                    </div>
                    <div class="input-grid">
                        <div class="input-wrapper">
                            <i class='bx bx-lock-alt input-icon'></i>
                            <input type="password" id="signupPassword" class="modern-input" placeholder="Password">
                        </div>
                        <div class="input-wrapper">
                            <i class='bx bx-check-shield input-icon'></i>
                            <input type="password" id="signupConfirmPassword" class="modern-input" placeholder="Confirm">
                        </div>
                    </div>
                    <div class="input-grid">
                        <div class="input-wrapper">
                            <i class='bx bx-key input-icon'></i>
                            <input type="password" id="signupMaster" class="modern-input" placeholder="Master key">
                        </div>
                        <div class="input-wrapper">
                            <i class='bx bx-check-double input-icon'></i>
                            <input type="password" id="signupConfirmMaster" class="modern-input" placeholder="Confirm">
                        </div>
                    </div>

                    <div class="warning-message">
                        <i class='bx bx-error-circle text-xl'></i>
                        <span>If you forget your Master Password, your vault cannot be recovered.</span>
                    </div>

                    <button type="submit" id="signupBtn" class="elegant-btn">Request Access</button>
                    <div id="signupError" class="error-msg"></div>
                    <div id="signupSuccess" class="success-msg"></div>
                </form>

                <!-- MASTER PASSWORD FORM -->
                <form id="masterForm" class="space-y-2 hidden">
                    <div class="master-welcome" id="masterWelcome">
                        Welcome back. Enter your Master Password to unlock.
                    </div>
                    <div class="input-wrapper">
                        <i class='bx bx-key input-icon'></i>
                        <input type="password" id="masterPassword" class="modern-input" placeholder="Master password">
                    </div>
                    <button type="submit" id="unlockBtn" class="elegant-btn">Unlock Vault</button>
                    <div id="masterError" class="error-msg"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase + Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCW0qgIGKko96RCyqVMWFWc8P-sp7LzuRo",
            authDomain: "onvault-d261b.firebaseapp.com",
            projectId: "onvault-d261b",
            storageBucket: "onvault-d261b.firebasestorage.app",
            messagingSenderId: "924974842099",
            appId: "1:924974842099:web:e9b04ffbea0318ce99f786",
            measurementId: "G-EFKXX58XL6"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.cryptoModule = {
            deriveAndVerify: async (masterPass, email) => {
                await new Promise(r => setTimeout(r, 700 + Math.random()*200));
                return { success: masterPass && masterPass.length > 0, key: 'key-' + email };
            }
        };

        // DOM elements
        const signInForm = document.getElementById('signInForm');
        const signUpForm = document.getElementById('signUpForm');
        const masterForm = document.getElementById('masterForm');
        const tabSignIn = document.getElementById('tabSignIn');
        const tabSignUp = document.getElementById('tabSignUp');
        const tabSwitcher = document.getElementById('tabSwitcher');

        const signinEmail = document.getElementById('signinEmail');
        const signinPassword = document.getElementById('signinPassword');
        const signinBtn = document.getElementById('signinBtn');
        const signinError = document.getElementById('signinError');

        const signupName = document.getElementById('signupName');
        const signupEmail = document.getElementById('signupEmail');
        const signupPassword = document.getElementById('signupPassword');
        const signupConfirmPassword = document.getElementById('signupConfirmPassword');
        const signupMaster = document.getElementById('signupMaster');
        const signupConfirmMaster = document.getElementById('signupConfirmMaster');
        const signupBtn = document.getElementById('signupBtn');
        const signupError = document.getElementById('signupError');
        const signupSuccess = document.getElementById('signupSuccess');

        const masterPassword = document.getElementById('masterPassword');
        const unlockBtn = document.getElementById('unlockBtn');
        const masterError = document.getElementById('masterError');
        const masterWelcome = document.getElementById('masterWelcome');

        function setActiveTab(active) {
            if (active === 'in') {
                tabSignIn.classList.add('active');
                tabSignUp.classList.remove('active');
            } else {
                tabSignUp.classList.add('active');
                tabSignIn.classList.remove('active');
            }
        }

        function showSignIn() {
            signInForm.classList.remove('hidden');
            signUpForm.classList.add('hidden');
            masterForm.classList.add('hidden');
            tabSwitcher.classList.remove('hidden');
            setActiveTab('in');
            clearAll();
        }

        function showSignUp() {
            signUpForm.classList.remove('hidden');
            signInForm.classList.add('hidden');
            masterForm.classList.add('hidden');
            tabSwitcher.classList.remove('hidden');
            setActiveTab('up');
            clearAll();
        }

        function showMasterStep(email) {
            signInForm.classList.add('hidden');
            signUpForm.classList.add('hidden');
            masterForm.classList.remove('hidden');
            tabSwitcher.classList.add('hidden');
            masterWelcome.innerText = `Welcome back, ${email}. Enter your Master Password to unlock.`;
            masterPassword.value = '';
            masterError.innerText = '';
        }

        function clearAll() {
            document.querySelectorAll('input').forEach(i => i.value = '');
            signinError.innerText = signupError.innerText = masterError.innerText = '';
            if (signupSuccess) signupSuccess.innerText = '';
        }

        function setButtonLoading(btn, isLoading, originalText) {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<span class="flex items-center justify-center gap-2"><span class="spinner"></span> processing</span>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        tabSignIn.addEventListener('click', showSignIn);
        tabSignUp.addEventListener('click', showSignUp);

        // SIGN IN
        signInForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            signinError.innerText = '';
            const email = signinEmail.value.trim();
            const pwd = signinPassword.value;
            if (!email || !pwd) { signinError.innerText = 'All fields required'; return; }
            
            setButtonLoading(signinBtn, true, 'Continue');
            try {
                const userCred = await signInWithEmailAndPassword(auth, email, pwd);
                const uid = userCred.user.uid;
                
                const userDoc = await getDoc(doc(db, 'users', uid));
                if (!userDoc.exists()) throw new Error('no account');
                
                if (userDoc.data().status !== 'approved') {
                    await auth.signOut();
                    signinError.innerText = 'Account pending approval';
                    signinPassword.value = '';
                    return;
                }
                
                showMasterStep(email);
                signinPassword.value = '';
            } catch (err) {
                signinError.innerText = 'Authentication failed';
                signinPassword.value = '';
            } finally {
                setButtonLoading(signinBtn, false, 'Continue');
            }
        });

        // SIGN UP
        signUpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            signupError.innerText = '';
            if (signupSuccess) signupSuccess.innerText = '';
            
            const name = signupName.value.trim();
            const email = signupEmail.value.trim();
            const pwd = signupPassword.value;
            const cpwd = signupConfirmPassword.value;
            const master = signupMaster.value;
            const cmaster = signupConfirmMaster.value;

            if (!name || !email || !pwd || !cpwd || !master || !cmaster) {
                signupError.innerText = 'All fields required'; return;
            }
            if (pwd !== cpwd) {
                signupError.innerText = 'Passwords do not match';
                signupPassword.value = signupConfirmPassword.value = ''; return;
            }
            if (master !== cmaster) {
                signupError.innerText = 'Master passwords do not match';
                signupMaster.value = signupConfirmMaster.value = ''; return;
            }

            setButtonLoading(signupBtn, true, 'Request Access');
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pwd);
                const uid = userCred.user.uid;
                
                await setDoc(doc(db, 'users', uid), {
                    name: name,
                    email: email,
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    masterHash: 'stub_hash'
                });
                
                signupSuccess.innerText = '✓ Account created, pending admin approval';
                signupPassword.value = signupConfirmPassword.value = signupMaster.value = signupConfirmMaster.value = '';
                signupName.value = ''; signupEmail.value = '';
                
                setTimeout(() => showSignIn(), 2000);
            } catch (err) {
                signupError.innerText = 'Account creation failed';
                signupPassword.value = signupConfirmPassword.value = signupMaster.value = signupConfirmMaster.value = '';
            } finally {
                setButtonLoading(signupBtn, false, 'Request Access');
            }
        });

        // MASTER UNLOCK
        masterForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            masterError.innerText = '';
            const master = masterPassword.value;
            if (!master) { masterError.innerText = 'Enter master password'; return; }

            setButtonLoading(unlockBtn, true, 'Unlock Vault');
            try {
                const result = await window.cryptoModule.deriveAndVerify(master, '');
                if (result.success) {
                    sessionStorage.setItem('vaultKey', result.key);
                    window.location.href = 'vault.html';
                } else {
                    masterError.innerText = 'Invalid master password';
                    masterPassword.value = '';
                }
            } catch {
                masterError.innerText = 'Unlock failed';
                masterPassword.value = '';
            } finally {
                setButtonLoading(unlockBtn, false, 'Unlock Vault');
            }
        });

        showSignIn();
        tabSignIn.addEventListener('click', clearAll);
        tabSignUp.addEventListener('click', clearAll);
    </script>
</body>
</html>
