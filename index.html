<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>matrix: init → terminal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* base black – true dark */
    body {
      background: black;
      min-height: 100vh;
      font-family: 'SFMono', 'Menlo', 'Monaco', 'Fira Code', 'Courier New', monospace;
    }

    /* container that holds both phases */
    #stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ----- MATRIX RAIN (canvas) ----- */
    #matrixCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 5;
      background: black;
    }

    /* ----- TERMINAL (hidden until matrix fades) ----- */
    .terminal {
      position: relative;
      z-index: 10;
      background: transparent;
      width: 100%;
      max-width: 720px;
      padding: 2rem 2rem 2.8rem;
      color: #c6dcff;
      opacity: 0;
      transition: opacity 0.4s ease-in;
      pointer-events: none;
      border: none;
      box-shadow: none;
    }

    .terminal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* line style */
    .line {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .prompt {
      color: #7ab7ef;
      font-weight: 400;
      white-space: nowrap;
    }

    .output {
      color: #b8cdf5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .accent-blue {
      color: #7ab7ef;
      font-weight: 450;
    }

    .dim {
      color: #5b7293;
    }

    /* input row */
    .input-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
      width: 100%;
    }

    .input-prompt {
      color: #7ab7ef;
      font-size: 1.1rem;
      white-space: nowrap;
    }

    #password-field {
      background: transparent;
      border: none;
      outline: none;
      color: #7ab7ef;
      font-size: 1.2rem;
      font-family: inherit;
      caret-color: #7ab7ef;
      flex: 1 1 200px;
      padding: 0.2rem 0;
      border-bottom: 1px solid #1f3447;
    }

    #password-field::placeholder {
      color: #2e4460;
      font-size: 1rem;
    }

    .blink {
      display: inline-block;
      width: 0.6rem;
      height: 1.2rem;
      background-color: #7ab7ef;
      margin-left: 0.2rem;
      animation: pulse 1s step-end infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .error-message {
      color: #f09494;
      margin-top: 0.25rem;
    }

    #hidden-submit {
      display: none;
    }

    .fade-out {
      animation: fadeOut 1.2s forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    @media (max-width: 450px) {
      .terminal {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="matrixCanvas"></canvas>
    <div class="terminal" id="terminalWindow"></div>
  </div>

  <!-- External script containing hardcoded password (more secure) -->
  <script src="auth.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
