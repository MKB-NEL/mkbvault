<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault · MK Bertrand</title>

    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- ===== ICONIFY ===== -->
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: #eff6ff;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Poppins', -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .page-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .login-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
        }

        /* ---------- LEFT COLUMN ---------- */
        .brand-column {
            background: var(--bg-card);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .brand-image {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .brand-image:hover {
            transform: scale(1.02);
        }

        .brand-column h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
            letter-spacing: -0.02em;
        }

        .brand-column .owner-name {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
        }

        .brand-column .owner-name strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        .separator {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 0.8rem auto;
            width: 80%;
            max-width: 200px;
        }

        .separator .line {
            flex: 1;
            height: 1px;
            background: var(--bg-primary);
        }

        .separator .diamond {
            width: 6px;
            height: 6px;
            background: var(--accent);
            transform: rotate(45deg);
            flex-shrink: 0;
            opacity: 0.6;
        }

        .brand-column .contact-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
            font-weight: 300;
            flex-wrap: wrap;
        }

        .brand-column .contact-info iconify-icon {
            color: var(--accent);
            font-size: 1.1rem;
        }

        .brand-column .contact-info .highlight {
            color: var(--accent);
            font-weight: 500;
        }

        .brand-column .contact-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            font-weight: 300;
        }

        /* ---------- RIGHT COLUMN ---------- */
        .form-column {
            background: var(--bg-card);
            padding: 2.5rem 2rem 2.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .form-header p {
            font-size: 0.9rem;
            font-weight: 300;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }

        /* ---------- FORM ---------- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper:focus-within {
            background: #e9edf2;
            box-shadow: 0 0 0 2px var(--accent-light);
        }

        .input-wrapper .input-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0 0 1rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .input-wrapper .input-icon iconify-icon {
            font-size: 1.2rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 0.75rem;
            border: none;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-primary);
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 0.95rem;
        }

        .input-wrapper .toggle-visibility {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem 0 0.5rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s ease;
            flex-shrink: 0;
        }

        .input-wrapper .toggle-visibility:hover {
            color: var(--text-secondary);
        }

        .input-wrapper .toggle-visibility iconify-icon {
            font-size: 1.2rem;
        }

        /* ---------- FEEDBACK ---------- */
        .feedback-message {
            min-height: 1.5rem;
            font-size: 0.85rem;
            font-weight: 400;
            margin-top: -0.5rem;
            opacity: 0;
            transition: opacity 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .feedback-message.visible {
            opacity: 1;
        }

        .feedback-message.error {
            color: var(--error);
        }

        .feedback-message.success {
            color: var(--success);
        }

        .feedback-message.warning {
            color: var(--warning);
        }

        .feedback-message iconify-icon {
            font-size: 1.1rem;
        }

        /* ---------- SUBMIT BUTTON ---------- */
        .submit-btn {
            position: relative;
            width: 100%;
            padding: 0.9rem 1.5rem;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.25rem;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn .btn-icon iconify-icon {
            font-size: 1.3rem;
        }

        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- SHIMMER LOADING ---------- */
        .shimmer-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .shimmer-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .shimmer-loading .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .shimmer-loading .loader .spinner-ring {
            width: 48px;
            height: 48px;
            border: 3px solid var(--bg-primary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .shimmer-loading .loader p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ---------- FOOTER ---------- */
        .professional-footer {
            background: var(--bg-primary);
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .professional-footer .footer-copy {
            font-size: 0.75rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .professional-footer .footer-copy .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        .professional-footer .footer-copy .brand-highlight {
            color: var(--accent);
            font-weight: 500;
        }

        .professional-footer .footer-links {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .professional-footer .footer-links a {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s ease;
        }

        .professional-footer .footer-links a:hover {
            color: var(--accent);
        }

        .professional-footer .footer-links a iconify-icon {
            font-size: 1rem;
        }

        .professional-footer .footer-links .dot {
            color: var(--text-muted);
            font-size: 0.3rem;
            opacity: 0.4;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 820px) {
            .login-grid {
                grid-template-columns: 1fr;
            }

            .brand-column {
                padding: 2rem 1.5rem 1.5rem;
                border-bottom: 1px solid var(--bg-primary);
            }

            .brand-image {
                max-width: 120px;
            }

            .brand-column h1 {
                font-size: 1.2rem;
            }

            .form-column {
                padding: 2rem 1.5rem 2.2rem;
            }

            .form-header h2 {
                font-size: 1.3rem;
            }

            .professional-footer {
                flex-direction: column;
                text-align: center;
                padding: 1rem 1.5rem;
            }

            .professional-footer .footer-links {
                justify-content: center;
            }
        }

        @media (max-width: 400px) {
            .brand-column {
                padding: 1.5rem 1rem 1.2rem;
            }

            .form-column {
                padding: 1.5rem 1rem 1.8rem;
            }

            .brand-image {
                max-width: 100px;
            }

            .separator {
                width: 60%;
            }

            .input-wrapper input {
                font-size: 0.9rem;
                padding: 0.7rem 0.75rem 0.7rem 0.5rem;
            }

            .submit-btn {
                font-size: 0.9rem;
                padding: 0.75rem 1rem;
            }

            .professional-footer .footer-links {
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>

                </a>

                <a href="https://www.instagram.com/kai_b3rt" target="_blank" rel="noopener noreferrer">

                </a>
                <span class="dot" aria-hidden="true">●</span>
                <a href="#" aria-label="Privacy Policy">

    <!-- ============================================================ -->
    <!-- ===== FIREBASE + LOGIC ===== -->
    <!-- ============================================================ -->

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        // =============================================================
        // 1. IMPORTS
        // =============================================================
        import { initializeApp } from 'firebase/app';
        import {
            getFirestore,
            doc,
            getDoc
        } from 'firebase/firestore';

        // =============================================================
        // 2. FIREBASE CONFIG
        // =============================================================
        const firebaseConfig = {
            apiKey: 'AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0',
            authDomain: 'joefootball-15e7a.firebaseapp.com',
            databaseURL: 'https://joefootball-15e7a-default-rtdb.firebaseio.com',
            projectId: 'joefootball-15e7a',
            storageBucket: 'joefootball-15e7a.firebasestorage.app',
            messagingSenderId: '976347287101',
            appId: '1:976347287101:web:93a93c519fff7e60986454',
            measurementId: 'G-3Q10KV3HE3'
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // =============================================================
        // 3. CONSTANTS
        // =============================================================
        const PASSWORD_COLLECTION = 'password';
        const PASSWORD_DOCUMENT = 'master-key';

        // ⚠️ NO HARDCODED PASSWORD — only Firestore

        // =============================================================
        // 4. DOM REFS
        // =============================================================
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitBtn');
        const feedback = document.getElementById('feedbackMessage');
        const feedbackText = document.getElementById('feedbackText');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const toggleBtn = document.getElementById('toggleVisibility');
        const eyeIcon = document.getElementById('eyeIcon');
        const shimmer = document.getElementById('shimmerLoader');

        // =============================================================
        // 5. FOOTER: SET CURRENT YEAR
        // =============================================================
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // =============================================================
        // 6. HIDE SHIMMER LOADER
        // =============================================================
        setTimeout(() => {
            shimmer.classList.add('hidden');
        }, 600);

        // =============================================================
        // 7. UTILITY FUNCTIONS
        // =============================================================

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function showFeedback(message, type = 'error') {
            feedback.className = 'feedback-message visible';
            feedback.classList.add(type);
            feedbackText.textContent = message;

            const iconMap = {
                error: 'mdi:alert-circle',
                success: 'mdi:check-circle',
                warning: 'mdi:alert'
            };
            feedbackIcon.setAttribute('icon', iconMap[type] || 'mdi:information');
        }

        function clearFeedback() {
            feedback.className = 'feedback-message';
            feedbackText.textContent = '';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
            } else {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        function redirectToVault() {
            window.location.href = 'vault.html';
        }

        // =============================================================
        // 8. TOGGLE PASSWORD VISIBILITY
        // =============================================================
        let isPasswordVisible = false;

        toggleBtn.addEventListener('click', () => {
            isPasswordVisible = !isPasswordVisible;
            passwordInput.type = isPasswordVisible ? 'text' : 'password';
            eyeIcon.setAttribute('icon', isPasswordVisible ? 'mdi:eye-off' : 'mdi:eye');
            passwordInput.focus();
        });

        // =============================================================
        // 9. CORE LOGIN LOGIC (Firestore ONLY — no fallback)
        // =============================================================

        async function handleLogin(event) {
            event.preventDefault();
            clearFeedback();

            const enteredPassword = passwordInput.value.trim();

            if (!enteredPassword) {
                showFeedback('Please enter your master password.', 'warning');
                passwordInput.focus();
                return;
            }

            setLoading(true);
            showFeedback('Verifying credentials ...', 'warning');

            try {
                // Fetch stored password hash from Firestore
                const docRef = doc(db, PASSWORD_COLLECTION, PASSWORD_DOCUMENT);
                const docSnap = await getDoc(docRef);

                // ⚠️ CRITICAL: If document doesn't exist, login is impossible
                if (!docSnap.exists()) {
                    showFeedback(
                        'No master password set. Please contact your administrator.',
                        'error'
                    );
                    setLoading(false);
                    return;
                }

                const data = docSnap.data();
                const storedHash = data.value || null;

                if (!storedHash) {
                    showFeedback(
                        'Invalid password configuration. Please contact support.',
                        'error'
                    );
                    setLoading(false);
                    return;
                }

                // Hash the entered password
                const enteredHash = await hashPassword(enteredPassword);

                // Compare
                if (enteredHash === storedHash) {
                    showFeedback('Access granted! Redirecting ...', 'success');
                    sessionStorage.setItem('vault_authenticated', 'true');
                    sessionStorage.setItem('vault_login_time', Date.now().toString());
                    setLoading(false);
                    setTimeout(() => {
                        redirectToVault();
                    }, 600);
                } else {
                    showFeedback('Incorrect password. Please try again.', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                    setLoading(false);
                }

            } catch (error) {
                console.error('Login error:', error);
                setLoading(false);
                showFeedback('Unable to connect to secure storage. Please check your connection.', 'error');
            }
        }

        // =============================================================
        // 10. EVENT LISTENERS
        // =============================================================

        form.addEventListener('submit', handleLogin);

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });

        passwordInput.addEventListener('input', () => {
            if (feedback.classList.contains('visible')) {
                clearFeedback();
            }
        });

        // =============================================================
        // 11. AUTO-FOCUS
        // =============================================================
        setTimeout(() => {
            passwordInput.focus();
        }, 800);

        // =============================================================
        // 12. SESSION CHECK
        // =============================================================
        const isAuth = sessionStorage.getItem('vault_authenticated');
        if (isAuth === 'true') {
            const loginTime = parseInt(sessionStorage.getItem('vault_login_time') || '0');
            const now = Date.now();
            if (now - loginTime < 24 * 60 * 60 * 1000) {
                redirectToVault();
            } else {
                sessionStorage.removeItem('vault_authenticated');
                sessionStorage.removeItem('vault_login_time');
            }
        }

        console.log('🔐 Vault login ready — Firestore authentication active.');
        console.log(`📁 Path: ${PASSWORD_COLLECTION}/${PASSWORD_DOCUMENT}`);
        console.log('⚠️ No hardcoded password — Firestore only.');
        console.log('🗑️ Session storage is cleared when browser is closed.');
    </script>
</body>
</html>
