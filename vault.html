<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>vault · minimal</title>
  <!-- Poppins font & boxicons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    /* main vault container — no shadows, no borders, minimal */
    .vault {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* header — clean, no borders */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1rem 0.6rem 1rem;
      background: #000000;
    }

    .session {
      font-size: 0.8rem;
      font-weight: 300;
      color: #7ab7ef;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .new-btn {
      background: transparent;
      border: none;
      color: #7ab7ef;
      font-size: 0.9rem;
      font-weight: 400;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .new-btn i {
      font-size: 1.2rem;
    }

    /* search — minimal, flat */
    .search-container {
      padding: 0.8rem 1rem;
    }

    .search-bar {
      width: 100%;
      background: #111111;
      border: none;
      padding: 0.8rem 1rem;
      color: #ffffff;
      font-size: 0.9rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
    }

    .search-bar::placeholder {
      color: #444444;
    }

    .search-bar:focus {
      outline: none;
      background: #1a1a1a;
    }

    /* main content — scroll */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 1rem 2rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    /* section titles — minimal */
    .section-title {
      font-size: 0.7rem;
      font-weight: 400;
      text-transform: uppercase;
      color: #666666;
      margin: 1.2rem 0 0.6rem 0;
      letter-spacing: 0.3px;
    }

    /* favorites row */
    .favorites {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .fav-item {
      background: #0a0a0a;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      font-weight: 300;
      color: #cccccc;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
    }

    .fav-item i {
      color: #7ab7ef;
      font-size: 0.9rem;
    }

    /* tabs — minimal underline */
    .tabs {
      display: flex;
      gap: 1.5rem;
      margin: 1rem 0 1.2rem 0;
    }

    .tab {
      padding: 0.3rem 0;
      font-size: 0.9rem;
      font-weight: 400;
      color: #666666;
      cursor: pointer;
      border-bottom: 1px solid transparent;
    }

    .tab.active {
      color: #7ab7ef;
      border-bottom: 1px solid #7ab7ef;
    }

    /* item list — no borders, no radius */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .item-card {
      background: #0a0a0a;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .item-info h4 {
      font-size: 0.95rem;
      font-weight: 400;
      margin-bottom: 0.2rem;
      color: #ffffff;
    }

    .item-info p {
      font-size: 0.7rem;
      font-weight: 300;
      color: #888888;
    }

    .item-icon {
      font-size: 1.2rem;
      color: #7ab7ef;
    }

    /* panel overlay — no blur, just dark */
    .panel-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      z-index: 20;
    }

    .panel-overlay.active {
      display: flex;
    }

    .detail-panel {
      width: 100%;
      max-width: 480px;
      background: #000000;
      height: 100%;
      padding: 1.5rem 1rem;
      overflow-y: auto;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #7ab7ef;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 300;
    }

    /* form — minimal, flat */
    .field-group {
      margin-bottom: 1.2rem;
    }

    .field-label {
      font-size: 0.7rem;
      font-weight: 300;
      color: #777777;
      margin-bottom: 0.2rem;
      text-transform: uppercase;
    }

    .field-input, .field-textarea, select {
      width: 100%;
      background: #111111;
      border: none;
      padding: 0.8rem;
      color: #ffffff;
      font-size: 0.9rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
    }

    .field-textarea {
      min-height: 80px;
      resize: vertical;
    }

    select {
      appearance: none;
      background: #111111;
    }

    .row-2col {
      display: flex;
      gap: 0.8rem;
    }

    .btn {
      background: #111111;
      border: none;
      padding: 0.8rem 1.2rem;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 300;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
    }

    .btn-primary {
      background: #7ab7ef;
      color: #000000;
      font-weight: 400;
    }

    .action-buttons {
      display: flex;
      gap: 0.8rem;
      margin: 1.5rem 0;
    }

    .copy-icon {
      margin-left: 0.5rem;
      cursor: pointer;
      color: #7ab7ef;
      font-size: 1rem;
    }

    .custom-fields {
      margin-top: 1.5rem;
    }

    .type-chooser {
      position: absolute;
      top: 70px;
      right: 10px;
      background: #111111;
      display: none;
      flex-direction: column;
      z-index: 25;
      min-width: 140px;
    }

    .type-chooser.show {
      display: flex;
    }

    .type-option {
      padding: 0.8rem 1rem;
      cursor: pointer;
      color: #cccccc;
      font-size: 0.9rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .type-option:hover {
      background: #1a1a1a;
    }

    .type-option i {
      color: #7ab7ef;
      font-size: 1rem;
    }

    .loading {
      color: #666666;
      text-align: center;
      padding: 2rem;
      font-weight: 300;
    }
  </style>
</head>
<body>
<div class="vault" id="vaultApp">
  <!-- header -->
  <div class="header">
    <span class="session"><i class='bx bx-circle' style="color:#7ab7ef; font-size:0.6rem;"></i> session started</span>
    <button class="new-btn" id="newMainBtn"><i class='bx bx-plus'></i> New</button>
  </div>

  <!-- type chooser -->
  <div class="type-chooser" id="typeChooser">
    <div class="type-option" data-type="login"><i class='bx bx-lock-alt'></i> Login</div>
    <div class="type-option" data-type="note"><i class='bx bx-note'></i> Note</div>
    <div class="type-option" data-type="project"><i class='bx bx-folder'></i> Project</div>
    <div class="type-option" data-type="folder"><i class='bx bx-folder-open'></i> Folder</div>
  </div>

  <!-- search -->
  <div class="search-container">
    <input type="text" class="search-bar" id="searchInput" placeholder="search vault...">
  </div>

  <!-- main content -->
  <div class="content" id="mainContent">
    <div class="section-title"><i class='bx bx-star' style="color:#7ab7ef;"></i> favorites</div>
    <div class="favorites" id="favoritesContainer"></div>

    <div class="tabs">
      <span class="tab active" data-view="all">all items</span>
      <span class="tab" data-view="folders">folders</span>
    </div>

    <div class="item-list" id="itemListContainer">
      <div class="loading">loading vault...</div>
    </div>
  </div>

  <!-- right panel overlay -->
  <div class="panel-overlay" id="panelOverlay">
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</div>

<!-- Firebase SDK (modular) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0",
    authDomain: "joefootball-15e7a.firebaseapp.com",
    databaseURL: "https://joefootball-15e7a-default-rtdb.firebaseio.com",
    projectId: "joefootball-15e7a",
    storageBucket: "joefootball-15e7a.firebasestorage.app",
    messagingSenderId: "976347287101",
    appId: "1:976347287101:web:93a93c519fff7e60986454",
    measurementId: "G-3Q10KV3HE3"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const database = getDatabase(app);
  const itemsRef = ref(database, 'vault-items');

  window.firebaseDB = database;
  window.firebaseRef = ref;
  window.firebaseOnValue = onValue;
  window.firebasePush = push;
  window.firebaseSet = set;
  window.firebaseUpdate = update;
  window.firebaseRemove = remove;
  window.itemsRef = itemsRef;
</script>

<script type="module">
  import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

  (function() {
    // Wait for firebase
    const checkFirebase = setInterval(() => {
      if (window.itemsRef) {
        clearInterval(checkFirebase);
        initVault();
      }
    }, 50);

    function initVault() {
      const itemsRef = window.itemsRef;
      const database = window.firebaseDB;

      // state
      let items = [];
      let currentView = 'all';
      let searchTerm = '';
      let foldersList = [];

      // DOM elements
      const favoritesContainer = document.getElementById('favoritesContainer');
      const itemListContainer = document.getElementById('itemListContainer');
      const searchInput = document.getElementById('searchInput');
      const tabs = document.querySelectorAll('.tab');
      const newBtn = document.getElementById('newMainBtn');
      const chooser = document.getElementById('typeChooser');
      const overlay = document.getElementById('panelOverlay');
      const panel = document.getElementById('detailPanel');

      // load real data from firebase
      onValue(itemsRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          items = Object.entries(data).map(([id, value]) => ({ id, ...value }));
        } else {
          items = [];
        }
        foldersList = items.filter(i => i.type === 'folder').map(f => f.title);
        fullRender();
      });

      // helpers
      function fullRender() {
        renderFavorites();
        renderList();
      }

      function renderFavorites() {
        const favItems = items.filter(i => i.favorite && i.type !== 'folder').slice(0, 5);
        favoritesContainer.innerHTML = '';
        favItems.forEach(item => {
          const chip = document.createElement('span');
          chip.className = 'fav-item';
          chip.innerHTML = `<i class='bx bx-star'></i> ${item.title.length > 18 ? item.title.slice(0,16)+'…' : item.title}`;
          chip.addEventListener('click', (e) => { e.stopPropagation(); openDetailPanel(item.id); });
          favoritesContainer.appendChild(chip);
        });
        if (favItems.length === 0) {
          favoritesContainer.innerHTML = '<span style="color:#333; font-size:0.8rem;">no favorites</span>';
        }
      }

      function filterItems() {
        let filtered = items.filter(i => i.type !== 'folder' || currentView === 'folders');
        if (currentView === 'folders') {
          filtered = items.filter(i => i.type === 'folder');
        }
        if (searchTerm.trim() !== '') {
          const term = searchTerm.toLowerCase();
          filtered = filtered.filter(i => 
            (i.title && i.title.toLowerCase().includes(term)) ||
            (i.username && i.username.toLowerCase().includes(term)) ||
            (i.content && i.content.toLowerCase().includes(term)) ||
            (i.url && i.url.toLowerCase().includes(term)) ||
            (i.folder && i.folder.toLowerCase().includes(term))
          );
        }
        return filtered;
      }

      function renderList() {
        const filtered = filterItems();
        itemListContainer.innerHTML = '';
        if (filtered.length === 0) {
          itemListContainer.innerHTML = '<div style="color:#333; text-align:center; margin-top:2rem;">— empty —</div>';
          return;
        }
        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.setAttribute('data-id', item.id);
          
          let icon = 'bx-lock-alt';
          if (item.type === 'note') icon = 'bx-note';
          else if (item.type === 'project') icon = 'bx-folder';
          else if (item.type === 'folder') icon = 'bx-folder-open';
          
          let subtitle = item.type;
          if (item.type === 'login' && item.username) subtitle = item.username;
          else if (item.type === 'folder') subtitle = 'folder';
          
          card.innerHTML = `
            <div class="item-info">
              <h4>${item.title} ${item.favorite ? '<i class="bx bxs-star" style="color:#7ab7ef;"></i>' : ''}</h4>
              <p>${subtitle}</p>
            </div>
            <div class="item-icon"><i class='bx ${icon}'></i></div>
          `;
          card.addEventListener('click', () => openDetailPanel(item.id));
          itemListContainer.appendChild(card);
        });
      }

      // search debounce
      let searchTimeout;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          searchTerm = e.target.value;
          renderList();
        }, 300);
      });

      // tabs
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentView = tab.dataset.view;
          renderList();
        });
      });

      // new button chooser
      newBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        chooser.classList.toggle('show');
      });
      document.addEventListener('click', (e) => {
        if (!chooser.contains(e.target) && e.target !== newBtn) chooser.classList.remove('show');
      });

      document.querySelectorAll('.type-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const type = opt.dataset.type;
          chooser.classList.remove('show');
          openCreatePanel(type);
        });
      });

      // panel functions
      function closePanel() {
        overlay.classList.remove('active');
      }

      window.openDetailPanel = function(itemId) {
        const item = items.find(i => i.id === itemId);
        if (!item) return;

        let html = `
          <div class="panel-header">
            <button class="back-btn" id="backFromDetail"><i class='bx bx-arrow-back'></i></button>
            <span class="panel-title">${item.title}</span>
          </div>
        `;

        if (item.type === 'login') {
          html += `
            <div class="field-group"><div class="field-label">username</div><input class="field-input" value="${item.username || ''}" id="detailUsername"></div>
            <div class="field-group"><div class="field-label">password</div><div style="display:flex;"><input class="field-input" type="password" value="${item.password || ''}" id="detailPassword" style="flex:1;"><i class='bx bx-copy copy-icon' data-copy="password"></i></div></div>
            <div class="field-group"><div class="field-label">website</div><input class="field-input" value="${item.url || ''}" id="detailUrl"></div>
          `;
        } else if (item.type === 'note' || item.type === 'project') {
          html += `<div class="field-group"><div class="field-label">content</div><textarea class="field-textarea" id="detailContent">${item.content || ''}</textarea></div>`;
        } else if (item.type === 'folder') {
          html += `<div class="field-group"><div class="field-label">folder name</div><input class="field-input" value="${item.title}" id="detailFolderName"></div>`;
          const contents = items.filter(i => i.folder === item.title);
          if (contents.length) {
            html += '<div style="margin:1rem 0; color:#666;">contains:</div>';
            contents.forEach(c => {
              html += `<div style="padding:0.3rem 0; font-size:0.8rem;">• ${c.title}</div>`;
            });
          }
        }

        html += `<div class="action-buttons">
          <button class="btn btn-primary" id="saveItemBtn">save</button>
          <button class="btn" id="deleteItemBtn">delete</button>
          <button class="btn" id="cancelPanelBtn">cancel</button>
        </div>`;
        
        html += `<div class="custom-fields"><button class="btn" id="addCustomField"><i class='bx bx-plus'></i> add field</button><div id="customFieldsArea"></div></div>`;

        panel.innerHTML = html;
        overlay.classList.add('active');

        document.getElementById('backFromDetail').addEventListener('click', closePanel);
        document.getElementById('cancelPanelBtn').addEventListener('click', closePanel);
        document.getElementById('deleteItemBtn').addEventListener('click', () => {
          if (confirm('delete?')) {
            const itemRef = ref(database, 'vault-items/' + itemId);
            remove(itemRef);
            closePanel();
          }
        });
        document.getElementById('saveItemBtn').addEventListener('click', () => {
          const updates = {};
          if (item.type === 'login') {
            updates.username = document.getElementById('detailUsername')?.value;
            updates.password = document.getElementById('detailPassword')?.value;
            updates.url = document.getElementById('detailUrl')?.value;
          } else if (item.type === 'note' || item.type === 'project') {
            updates.content = document.getElementById('detailContent')?.value;
          } else if (item.type === 'folder') {
            updates.title = document.getElementById('detailFolderName')?.value;
          }
          const itemRef = ref(database, 'vault-items/' + itemId);
          update(itemRef, updates);
          closePanel();
        });

        document.querySelectorAll('.copy-icon').forEach(icon => {
          icon.addEventListener('click', (e) => {
            const input = document.getElementById('detailPassword');
            if (input) {
              navigator.clipboard.writeText(input.value);
              alert('copied');
            }
          });
        });

        document.getElementById('addCustomField')?.addEventListener('click', () => {
          const area = document.getElementById('customFieldsArea');
          const div = document.createElement('div');
          div.className = 'field-group';
          div.style.display = 'flex';
          div.style.gap = '0.5rem';
          div.innerHTML = `<input class="field-input" placeholder="name" style="width:40%"> <input class="field-input" placeholder="value" style="width:55%">`;
          area.appendChild(div);
        });
      };

      function openCreatePanel(type) {
        let title = type.charAt(0).toUpperCase() + type.slice(1);
        let html = `
          <div class="panel-header">
            <button class="back-btn" id="backFromDetail"><i class='bx bx-arrow-back'></i></button>
            <span class="panel-title">new ${type}</span>
          </div>
        `;

        if (type === 'folder') {
          html += `<div class="field-group"><div class="field-label">folder name</div><input class="field-input" id="folderName" placeholder="e.g. work"></div>`;
        } else {
          html += `<div class="field-group"><div class="field-label">title</div><input class="field-input" id="itemTitle" placeholder="title"></div>`;
          html += `<div class="field-group"><div class="field-label">folder</div><select class="field-input" id="itemFolder"><option value="">none</option>${foldersList.map(f => `<option>${f}</option>`).join('')}</select></div>`;
          if (type === 'login') {
            html += `<div class="field-group"><div class="field-label">username</div><input class="field-input" id="loginUser"></div>`;
            html += `<div class="field-group"><div class="field-label">password</div><input class="field-input" type="password" id="loginPass"></div>`;
            html += `<div class="field-group"><div class="field-label">website</div><input class="field-input" id="loginUrl"></div>`;
          } else {
            html += `<div class="field-group"><div class="field-label">content</div><textarea class="field-textarea" id="noteContent"></textarea></div>`;
          }
        }

        html += `<div class="action-buttons"><button class="btn btn-primary" id="createItemBtn">create</button><button class="btn" id="cancelPanelBtn">cancel</button></div>`;

        panel.innerHTML = html;
        overlay.classList.add('active');

        document.getElementById('backFromDetail').addEventListener('click', closePanel);
        document.getElementById('cancelPanelBtn').addEventListener('click', closePanel);
        document.getElementById('createItemBtn').addEventListener('click', () => {
          const newItem = { type, favorite: false };
          if (type === 'folder') {
            newItem.title = document.getElementById('folderName')?.value || 'untitled';
          } else {
            newItem.title = document.getElementById('itemTitle')?.value || 'untitled';
            newItem.folder = document.getElementById('itemFolder')?.value || null;
            if (type === 'login') {
              newItem.username = document.getElementById('loginUser')?.value;
              newItem.password = document.getElementById('loginPass')?.value;
              newItem.url = document.getElementById('loginUrl')?.value;
            } else {
              newItem.content = document.getElementById('noteContent')?.value;
            }
          }
          const newRef = push(itemsRef);
          set(newRef, newItem);
          closePanel();
        });
      }

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closePanel();
      });
    }
  })();
</script>
</body>
</html>
