<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault · Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

    <style>
        /* ---------- AUTH CHECK OVERLAY ---------- */
        #authGuard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 1.5rem;
            transition: opacity 0.6s ease;
        }

        #authGuard.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #authGuard .spinner-ring {
            width: 48px;
            height: 48px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #authGuard p {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: #475569;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        #authGuard .error-icon {
            font-size: 3rem;
            color: #ef4444;
        }

        #authGuard .error-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            color: #0f172a;
            font-weight: 500;
        }

        #authGuard .error-sub {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 300;
        }

        #authGuard .redirect-btn {
            margin-top: 0.5rem;
            padding: 0.7rem 2rem;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
        }

        #authGuard .redirect-btn:hover {
            background: #2563eb;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- VAULT CONTENT (hidden initially) ---------- */
        #vaultContent {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #vaultContent.visible {
            display: block;
            opacity: 1;
        }

        /* ---------- VAULT STYLES (placeholder for now) ---------- */
        body {
            font-family: 'Poppins', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 2rem;
            color: #0f172a;
        }

        .vault-header {
            max-width: 1000px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .vault-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .vault-header .logout-btn {
            padding: 0.5rem 1.2rem;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s ease;
        }

        .vault-header .logout-btn:hover {
            background: #cbd5e1;
        }

        .vault-content {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 2rem;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .vault-header h1 {
                font-size: 1.2rem;
            }
            .vault-content {
                padding: 1.5rem;
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== AUTH GUARD (overlay) ===== -->
    <div id="authGuard">
        <div class="spinner-ring" id="authSpinner"></div>
        <p id="authStatus">Verifying session ...</p>
    </div>

    <!-- ===== VAULT CONTENT ===== -->
    <div id="vaultContent">
        <div class="vault-header">
            <h1>
                <iconify-icon icon="mdi:lock-open" style="color:#3b82f6;"></iconify-icon>
                MK Bertrand · Vault
            </h1>
            <button class="logout-btn" id="logoutBtn">
                <iconify-icon icon="mdi:logout"></iconify-icon>
                Logout
            </button>
        </div>
        <div class="vault-content">
            <p style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
                <iconify-icon icon="mdi:database-check" style="font-size:2.5rem;color:#3b82f6;"></iconify-icon>
                <span>Vault content will appear here.</span>
                <span style="font-size:0.85rem;color:#94a3b8;">(Full vault UI coming next.)</span>
            </p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== AUTH VALIDATION LOGIC ===== -->
    <!-- ============================================================ -->

    <script>
        // =============================================================
        // 1. DOM REFS
        // =============================================================
        const authGuard = document.getElementById('authGuard');
        const authStatus = document.getElementById('authStatus');
        const authSpinner = document.getElementById('authSpinner');
        const vaultContent = document.getElementById('vaultContent');
        const logoutBtn = document.getElementById('logoutBtn');

        // =============================================================
        // 2. CONSTANTS
        // =============================================================
        const SESSION_KEY = 'vault_authenticated';
        const SESSION_TIME_KEY = 'vault_login_time';
        const SESSION_DURATION_MS = 24 * 60 * 60 * 1000; // 24 hours

        // =============================================================
        // 3. AUTH CHECK
        // =============================================================

        function checkAuthentication() {
            const isAuth = sessionStorage.getItem(SESSION_KEY);
            const loginTime = parseInt(sessionStorage.getItem(SESSION_TIME_KEY) || '0');
            const now = Date.now();

            // Case 1: No session → not authenticated
            if (isAuth !== 'true') {
                showAuthError('No active session found.');
                return false;
            }

            // Case 2: Session expired
            if (now - loginTime > SESSION_DURATION_MS) {
                sessionStorage.removeItem(SESSION_KEY);
                sessionStorage.removeItem(SESSION_TIME_KEY);
                showAuthError('Your session has expired. Please log in again.');
                return false;
            }

            // Case 3: Valid session
            return true;
        }

        function showAuthError(message) {
            authSpinner.style.display = 'none';
            authStatus.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;text-align:center;">
                    <iconify-icon icon="mdi:alert-circle" style="font-size:3rem;color:#ef4444;"></iconify-icon>
                    <span style="font-size:1rem;font-weight:500;color:#0f172a;">Access Denied</span>
                    <span style="font-size:0.85rem;color:#64748b;font-weight:300;">${message}</span>
                    <a href="index.html" class="redirect-btn">Return to Login</a>
                </div>
            `;
        }

        function grantAccess() {
            // Hide auth guard, show vault
            authGuard.classList.add('hidden');
            vaultContent.classList.add('visible');

            // Update session timestamp (keep alive)
            sessionStorage.setItem(SESSION_TIME_KEY, Date.now().toString());
        }

        // =============================================================
        // 4. RUN AUTH CHECK
        // =============================================================

        setTimeout(() => {
            const isValid = checkAuthentication();

            if (isValid) {
                grantAccess();
            }
            // If invalid, auth guard shows error (already handled)
        }, 400); // Small delay for smooth transition

        // =============================================================
        // 5. LOGOUT
        // =============================================================

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem(SESSION_KEY);
            sessionStorage.removeItem(SESSION_TIME_KEY);
            window.location.href = 'index.html';
        });

        // =============================================================
        // 6. PREVENT BACK/FORWARD NAVIGATION ISSUES
        // =============================================================

        // If user navigates back here from vault, re-check
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                // Page was loaded from cache (back button)
                const isValid = checkAuthentication();
                if (isValid) {
                    grantAccess();
                }
            }
        });

        console.log('🔐 Vault dashboard loaded — auth check complete.');
    </script>

</body>
</html>
