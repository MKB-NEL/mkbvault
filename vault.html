<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boveda · document studio</title>
    <!-- Inter font - 2026 standard -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f8f9fc;
            color: #1e293b;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 2026 design system - subtle rounded corners (4px) */
        :root {
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --surface: #ffffff;
            --background: #f8f9fc;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-light: #64748b;
            --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1);
            --radius: 4px;
        }

        /* Layout */
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--text);
        }

        .logo-icon {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .search-container {
            position: relative;
            width: 280px;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--primary-light);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary);
        }

        /* Main container - split view */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 61px);
            overflow: hidden;
        }

        /* Left Navigation */
        .left-nav {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .nav-section {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text);
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
            margin-bottom: 0.25rem;
        }

        .nav-item i {
            font-size: 1.25rem;
            color: var(--text-light);
        }

        .nav-item:hover {
            background: var(--primary-light);
        }

        .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 500;
        }

        .nav-item.active i {
            color: var(--primary);
        }

        .nav-item-count {
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--text-light);
            background: var(--background);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius);
        }

        /* Folders list */
        .folders-list {
            margin-top: 0.5rem;
        }

        .folder-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
        }

        .folder-item:hover {
            background: var(--primary-light);
        }

        .folder-item i {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .folder-item .folder-name {
            flex: 1;
            font-size: 0.95rem;
        }

        .folder-item .folder-count {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* Main content area */
        .main-content {
            flex: 1;
            background: var(--background);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Document toolbar - WPS style */
        .document-toolbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding-right: 1rem;
            border-right: 1px solid var(--border);
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .toolbar-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .toolbar-select {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            font-size: 0.95rem;
            color: var(--text);
            cursor: pointer;
        }

        .toolbar-color {
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
        }

        /* Document info bar */
        .document-info {
            padding: 1rem 1.5rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .document-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .title-input {
            font-size: 1.25rem;
            font-weight: 600;
            padding: 0.5rem;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text);
            width: 300px;
        }

        .title-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .document-actions {
            display: flex;
            gap: 0.5rem;
        }

        .doc-action {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .doc-action:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .doc-action.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .doc-action.primary:hover {
            background: var(--primary-dark);
        }

        /* Three dots menu */
        .three-dots-menu {
            position: relative;
        }

        .dots-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dots-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .dots-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            min-width: 200px;
            display: none;
            z-index: 1000;
        }

        .dots-dropdown.show {
            display: block;
        }

        .dropdown-item {
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dropdown-item:hover {
            background: var(--primary-light);
        }

        .dropdown-item i {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .dropdown-item.delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        .dropdown-item.delete:hover i {
            color: #dc2626;
        }

        /* Document editor */
        .document-editor {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background: var(--background);
        }

        .editor-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            min-height: 600px;
            padding: 2rem;
        }

        .editor-content {
            width: 100%;
            min-height: 500px;
            border: none;
            outline: none;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text);
            resize: none;
            font-family: "Inter", sans-serif;
        }

        .editor-content[contenteditable="true"] {
            cursor: text;
        }

        /* Image in editor */
        .editor-image {
            max-width: 100%;
            margin: 1rem 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .image-container {
            position: relative;
            display: inline-block;
        }

        .image-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 30px;
            height: 30px;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-container:hover .image-remove {
            opacity: 1;
        }

        /* Login specific */
        .login-fields {
            background: var(--primary-light);
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1rem;
        }

        .login-field {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .login-field input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
        }

        /* Project specific */
        .project-progress {
            margin: 1rem 0;
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            position: relative;
            border-radius: var(--radius);
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: var(--radius);
        }

        /* Folder view */
        .folder-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .folder-item-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .folder-item-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        /* Modal - subtle rounded corners */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            font-size: 1.5rem;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .folder-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            font-size: 1rem;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .left-nav {
                width: 240px;
            }
            
            .search-container {
                width: 200px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .left-nav {
                width: 100%;
                height: auto;
                max-height: 300px;
            }
            
            .document-toolbar {
                overflow-x: auto;
            }
            
            .title-input {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="logo">
                    <span class="logo-icon">🔐</span>
                    <span>BOVEDA</span>
                </div>
                <div class="search-container">
                    <i class='bx bx-search search-icon'></i>
                    <input type="text" class="search-input" id="globalSearch" placeholder="Search documents...">
                </div>
            </div>
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">JD</div>
                <span class="user-name" id="userName">John</span>
            </div>
        </div>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Left Navigation -->
            <div class="left-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Workspace</div>
                    <div class="nav-item active" data-type="logins" id="navLogins">
                        <i class='bx bx-lock-alt'></i>
                        <span>Logins</span>
                        <span class="nav-item-count" id="loginCount">0</span>
                    </div>
                    <div class="nav-item" data-type="notes" id="navNotes">
                        <i class='bx bx-note'></i>
                        <span>Notes</span>
                        <span class="nav-item-count" id="noteCount">0</span>
                    </div>
                    <div class="nav-item" data-type="projects" id="navProjects">
                        <i class='bx bx-briefcase'></i>
                        <span>Projects</span>
                        <span class="nav-item-count" id="projectCount">0</span>
                    </div>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Folders</div>
                    <div class="folders-list" id="foldersList">
                        <!-- Folders will be added here dynamically -->
                    </div>
                    <div class="nav-item" id="addFolderBtn">
                        <i class='bx bx-folder-plus'></i>
                        <span>New Folder</span>
                    </div>
                </div>

                <div class="nav-section">
                    <div class="nav-item" id="newDocumentBtn">
                        <i class='bx bx-plus-circle'></i>
                        <span>New Document</span>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="main-content">
                <!-- Document Toolbar - WPS Style -->
                <div class="document-toolbar" id="documentToolbar">
                    <div class="toolbar-group">
                        <select class="toolbar-select" id="fontFamily">
                            <option value="Inter">Inter</option>
                            <option value="Arial">Arial</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                        </select>
                        <select class="toolbar-select" id="fontSize">
                            <option value="12">12px</option>
                            <option value="14">14px</option>
                            <option value="16" selected>16px</option>
                            <option value="18">18px</option>
                            <option value="20">20px</option>
                            <option value="24">24px</option>
                        </select>
                    </div>
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="boldBtn" title="Bold"><i class='bx bx-bold'></i></button>
                        <button class="toolbar-btn" id="italicBtn" title="Italic"><i class='bx bx-italic'></i></button>
                        <button class="toolbar-btn" id="underlineBtn" title="Underline"><i class='bx bx-underline'></i></button>
                        <button class="toolbar-btn" id="strikethroughBtn" title="Strikethrough"><i class='bx bx-strikethrough'></i></button>
                    </div>
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="alignLeftBtn" title="Align Left"><i class='bx bx-align-left'></i></button>
                        <button class="toolbar-btn" id="alignCenterBtn" title="Align Center"><i class='bx bx-align-middle'></i></button>
                        <button class="toolbar-btn" id="alignRightBtn" title="Align Right"><i class='bx bx-align-right'></i></button>
                        <button class="toolbar-btn" id="alignJustifyBtn" title="Justify"><i class='bx bx-align-justify'></i></button>
                    </div>
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="bulletListBtn" title="Bullet List"><i class='bx bx-list-ul'></i></button>
                        <button class="toolbar-btn" id="numberListBtn" title="Number List"><i class='bx bx-list-ol'></i></button>
                    </div>
                    <div class="toolbar-group">
                        <input type="color" class="toolbar-color" id="textColor" value="#2563eb">
                        <input type="color" class="toolbar-color" id="bgColor" value="#ffffff">
                    </div>
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="imageBtn" title="Insert Image"><i class='bx bx-image-add'></i></button>
                        <button class="toolbar-btn" id="linkBtn" title="Insert Link"><i class='bx bx-link'></i></button>
                    </div>
                </div>

                <!-- Document Info Bar -->
                <div class="document-info">
                    <div class="document-title">
                        <input type="text" class="title-input" id="docTitle" placeholder="Untitled Document">
                        <span class="document-type" id="docTypeBadge">Note</span>
                    </div>
                    <div class="document-actions">
                        <button class="doc-action" id="saveDocBtn">
                            <i class='bx bx-save'></i>
                            Save
                        </button>
                        <div class="three-dots-menu">
                            <button class="dots-btn" id="threeDotsBtn">
                                <i class='bx bx-dots-vertical-rounded'></i>
                            </button>
                            <div class="dots-dropdown" id="dotsDropdown">
                                <div class="dropdown-item" id="moveToFolder">
                                    <i class='bx bx-folder'></i>
                                    Move to folder
                                </div>
                                <div class="dropdown-item" id="duplicateDoc">
                                    <i class='bx bx-copy'></i>
                                    Duplicate
                                </div>
                                <div class="dropdown-item" id="exportDoc">
                                    <i class='bx bx-export'></i>
                                    Export
                                </div>
                                <div class="dropdown-item delete" id="deleteDoc">
                                    <i class='bx bx-trash'></i>
                                    Delete
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Document Editor -->
                <div class="document-editor">
                    <div class="editor-container">
                        <!-- Login specific fields (shown only for logins) -->
                        <div id="loginFields" style="display: none;">
                            <div class="login-fields">
                                <div class="login-field">
                                    <i class='bx bx-globe'></i>
                                    <input type="url" id="loginUrl" placeholder="https://example.com">
                                </div>
                                <div class="login-field">
                                    <i class='bx bx-user'></i>
                                    <input type="text" id="loginUsername" placeholder="Username">
                                </div>
                                <div class="login-field">
                                    <i class='bx bx-lock-alt'></i>
                                    <input type="password" id="loginPassword" placeholder="Password">
                                </div>
                            </div>
                        </div>

                        <!-- Project progress (shown only for projects) -->
                        <div id="projectFields" style="display: none;">
                            <div class="project-progress">
                                <label>Progress: <span id="progressValue">0</span>%</label>
                                <input type="range" id="progressSlider" min="0" max="100" value="0">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Main editor content -->
                        <div id="editor" class="editor-content" contenteditable="true">
                            Start writing your document...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Folder Modal -->
    <div class="modal" id="folderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create New Folder</h2>
                <i class='bx bx-x modal-close' id="closeFolderModal"></i>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Folder Name</label>
                    <input type="text" class="form-input" id="folderName" placeholder="Enter folder name">
                </div>
            </div>
            <div class="modal-footer">
                <button class="doc-action" id="cancelFolder">Cancel</button>
                <button class="doc-action primary" id="createFolder">Create Folder</button>
            </div>
        </div>
    </div>

    <!-- Move to Folder Modal -->
    <div class="modal" id="moveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Move to Folder</h2>
                <i class='bx bx-x modal-close' id="closeMoveModal"></i>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Select Folder</label>
                    <select class="folder-select" id="folderSelect">
                        <option value="">Root (No Folder)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="doc-action" id="cancelMove">Cancel</button>
                <button class="doc-action primary" id="moveDocument">Move</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal (in-app, no browser confirm) -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Delete Document</h2>
                <i class='bx bx-x modal-close' id="closeDeleteModal"></i>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this document? This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="doc-action" id="cancelDelete">Cancel</button>
                <button class="doc-action primary" style="background: #dc2626;" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Data store
        let documents = {
            logins: JSON.parse(localStorage.getItem('boveda_logins')) || [],
            notes: JSON.parse(localStorage.getItem('boveda_notes')) || [],
            projects: JSON.parse(localStorage.getItem('boveda_projects')) || [],
            folders: JSON.parse(localStorage.getItem('boveda_folders')) || []
        };

        let currentType = 'notes';
        let currentDocId = null;
        let currentFolder = null;

        // DOM elements
        const editor = document.getElementById('editor');
        const docTitle = document.getElementById('docTitle');
        const docTypeBadge = document.getElementById('docTypeBadge');
        const loginFields = document.getElementById('loginFields');
        const projectFields = document.getElementById('projectFields');
        const loginUrl = document.getElementById('loginUrl');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const progressSlider = document.getElementById('progressSlider');
        const progressValue = document.getElementById('progressValue');
        const progressFill = document.getElementById('progressFill');
        const foldersList = document.getElementById('foldersList');
        const loginCount = document.getElementById('loginCount');
        const noteCount = document.getElementById('noteCount');
        const projectCount = document.getElementById('projectCount');
        const threeDotsBtn = document.getElementById('threeDotsBtn');
        const dotsDropdown = document.getElementById('dotsDropdown');
        const folderSelect = document.getElementById('folderSelect');

        // Update counts
        function updateCounts() {
            loginCount.textContent = documents.logins.length;
            noteCount.textContent = documents.notes.length;
            projectCount.textContent = documents.projects.length;
        }

        // Render folders
        function renderFolders() {
            foldersList.innerHTML = '';
            documents.folders.forEach(folder => {
                const folderElement = document.createElement('div');
                folderElement.className = 'folder-item';
                folderElement.innerHTML = `
                    <i class='bx bx-folder'></i>
                    <span class="folder-name">${folder.name}</span>
                    <span class="folder-count">${folder.items?.length || 0}</span>
                `;
                folderElement.addEventListener('click', () => openFolder(folder.id));
                foldersList.appendChild(folderElement);
            });
        }

        // Open folder
        function openFolder(folderId) {
            currentFolder = folderId;
            // Filter documents in this folder
            const folder = documents.folders.find(f => f.id === folderId);
            if (folder) {
                // Show folder view in editor
                editor.innerHTML = '<div class="folder-view"></div>';
                const folderView = editor.querySelector('.folder-view');
                
                folder.items.forEach(itemId => {
                    // Find item in any category
                    const item = [...documents.logins, ...documents.notes, ...documents.projects]
                        .find(d => d.id === itemId);
                    if (item) {
                        const itemCard = document.createElement('div');
                        itemCard.className = 'folder-item-card';
                        itemCard.innerHTML = `
                            <i class='bx bx-file'></i>
                            <strong>${item.title || 'Untitled'}</strong>
                        `;
                        folderView.appendChild(itemCard);
                    }
                });
            }
        }

        // Save current document
        function saveDocument() {
            if (!currentDocId) {
                // Create new document
                currentDocId = Date.now().toString();
            }

            const docData = {
                id: currentDocId,
                title: docTitle.value || 'Untitled',
                content: editor.innerHTML,
                lastModified: new Date().toISOString(),
                folder: currentFolder || null
            };

            // Add type-specific fields
            if (currentType === 'logins') {
                docData.url = loginUrl.value;
                docData.username = loginUsername.value;
                docData.password = loginPassword.value;
                documents.logins = documents.logins.filter(d => d.id !== currentDocId);
                documents.logins.push(docData);
            } else if (currentType === 'notes') {
                documents.notes = documents.notes.filter(d => d.id !== currentDocId);
                documents.notes.push(docData);
            } else if (currentType === 'projects') {
                docData.progress = progressSlider.value;
                documents.projects = documents.projects.filter(d => d.id !== currentDocId);
                documents.projects.push(docData);
            }

            // Save to localStorage
            localStorage.setItem('boveda_logins', JSON.stringify(documents.logins));
            localStorage.setItem('boveda_notes', JSON.stringify(documents.notes));
            localStorage.setItem('boveda_projects', JSON.stringify(documents.projects));
            localStorage.setItem('boveda_folders', JSON.stringify(documents.folders));

            updateCounts();
        }

        // Navigation
        document.querySelectorAll('.nav-item[data-type]').forEach(item => {
            item.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                currentType = item.dataset.type;
                docTypeBadge.textContent = currentType.charAt(0).toUpperCase() + currentType.slice(1);
                
                // Show/hide type-specific fields
                loginFields.style.display = currentType === 'logins' ? 'block' : 'none';
                projectFields.style.display = currentType === 'projects' ? 'block' : 'none';
                
                // Clear editor for new document
                currentDocId = null;
                docTitle.value = '';
                editor.innerHTML = 'Start writing your document...';
                loginUrl.value = '';
                loginUsername.value = '';
                loginPassword.value = '';
                progressSlider.value = 0;
                progressFill.style.width = '0%';
                progressValue.textContent = '0';
            });
        });

        // New document
        document.getElementById('newDocumentBtn').addEventListener('click', () => {
            currentDocId = null;
            docTitle.value = '';
            editor.innerHTML = 'Start writing your document...';
            loginUrl.value = '';
            loginUsername.value = '';
            loginPassword.value = '';
            progressSlider.value = 0;
            progressFill.style.width = '0%';
            progressValue.textContent = '0';
        });

        // Save button
        document.getElementById('saveDocBtn').addEventListener('click', saveDocument);

        // Progress slider
        progressSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            progressValue.textContent = val;
            progressFill.style.width = val + '%';
        });

        // Three dots menu
        threeDotsBtn.addEventListener('click', () => {
            dotsDropdown.classList.toggle('show');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!threeDotsBtn.contains(e.target)) {
                dotsDropdown.classList.remove('show');
            }
        });

        // Delete document (in-app modal)
        const deleteModal = document.getElementById('deleteModal');
        const closeDeleteModal = document.getElementById('closeDeleteModal');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');

        document.getElementById('deleteDoc').addEventListener('click', () => {
            dotsDropdown.classList.remove('show');
            if (currentDocId) {
                deleteModal.classList.add('active');
            }
        });

        closeDeleteModal.addEventListener('click', () => deleteModal.classList.remove('active'));
        cancelDelete.addEventListener('click', () => deleteModal.classList.remove('active'));

        confirmDelete.addEventListener('click', () => {
            if (currentDocId) {
                // Remove from appropriate array
                if (currentType === 'logins') {
                    documents.logins = documents.logins.filter(d => d.id !== currentDocId);
                } else if (currentType === 'notes') {
                    documents.notes = documents.notes.filter(d => d.id !== currentDocId);
                } else if (currentType === 'projects') {
                    documents.projects = documents.projects.filter(d => d.id !== currentDocId);
                }
                
                localStorage.setItem('boveda_logins', JSON.stringify(documents.logins));
                localStorage.setItem('boveda_notes', JSON.stringify(documents.notes));
                localStorage.setItem('boveda_projects', JSON.stringify(documents.projects));
                
                currentDocId = null;
                docTitle.value = '';
                editor.innerHTML = 'Start writing your document...';
                updateCounts();
                deleteModal.classList.remove('active');
            }
        });

        // Move to folder
        const moveModal = document.getElementById('moveModal');
        const closeMoveModal = document.getElementById('closeMoveModal');
        const cancelMove = document.getElementById('cancelMove');

        document.getElementById('moveToFolder').addEventListener('click', () => {
            dotsDropdown.classList.remove('show');
            // Populate folder select
            folderSelect.innerHTML = '<option value="">Root (No Folder)</option>';
            documents.folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = folder.name;
                folderSelect.appendChild(option);
            });
            moveModal.classList.add('active');
        });

        closeMoveModal.addEventListener('click', () => moveModal.classList.remove('active'));
        cancelMove.addEventListener('click', () => moveModal.classList.remove('active'));

        document.getElementById('moveDocument').addEventListener('click', () => {
            if (currentDocId) {
                const targetFolder = folderSelect.value;
                
                // Remove from old folder if any
                documents.folders.forEach(f => {
                    f.items = f.items?.filter(id => id !== currentDocId) || [];
                });
                
                // Add to new folder
                if (targetFolder) {
                    const folder = documents.folders.find(f => f.id === targetFolder);
                    if (folder) {
                        folder.items = folder.items || [];
                        folder.items.push(currentDocId);
                    }
                }
                
                currentFolder = targetFolder || null;
                localStorage.setItem('boveda_folders', JSON.stringify(documents.folders));
                moveModal.classList.remove('active');
            }
        });

        // Folder modal
        const folderModal = document.getElementById('folderModal');
        const closeFolderModal = document.getElementById('closeFolderModal');
        const cancelFolder = document.getElementById('cancelFolder');
        const createFolder = document.getElementById('createFolder');
        const folderName = document.getElementById('folderName');

        document.getElementById('addFolderBtn').addEventListener('click', () => {
            folderModal.classList.add('active');
        });

        closeFolderModal.addEventListener('click', () => folderModal.classList.remove('active'));
        cancelFolder.addEventListener('click', () => folderModal.classList.remove('active'));

        createFolder.addEventListener('click', () => {
            if (folderName.value.trim()) {
                const newFolder = {
                    id: Date.now().toString(),
                    name: folderName.value,
                    items: []
                };
                documents.folders.push(newFolder);
                localStorage.setItem('boveda_folders', JSON.stringify(documents.folders));
                renderFolders();
                folderModal.classList.remove('active');
                folderName.value = '';
            }
        });

        // Text formatting
        document.getElementById('boldBtn').addEventListener('click', () => {
            document.execCommand('bold', false, null);
        });

        document.getElementById('italicBtn').addEventListener('click', () => {
            document.execCommand('italic', false, null);
        });

        document.getElementById('underlineBtn').addEventListener('click', () => {
            document.execCommand('underline', false, null);
        });

        document.getElementById('strikethroughBtn').addEventListener('click', () => {
            document.execCommand('strikethrough', false, null);
        });

        document.getElementById('alignLeftBtn').addEventListener('click', () => {
            document.execCommand('justifyLeft', false, null);
        });

        document.getElementById('alignCenterBtn').addEventListener('click', () => {
            document.execCommand('justifyCenter', false, null);
        });

        document.getElementById('alignRightBtn').addEventListener('click', () => {
            document.execCommand('justifyRight', false, null);
        });

        document.getElementById('alignJustifyBtn').addEventListener('click', () => {
            document.execCommand('justifyFull', false, null);
        });

        document.getElementById('bulletListBtn').addEventListener('click', () => {
            document.execCommand('insertUnorderedList', false, null);
        });

        document.getElementById('numberListBtn').addEventListener('click', () => {
            document.execCommand('insertOrderedList', false, null);
        });

        document.getElementById('fontFamily').addEventListener('change', (e) => {
            document.execCommand('fontName', false, e.target.value);
        });

        document.getElementById('fontSize').addEventListener('change', (e) => {
            document.execCommand('fontSize', false, e.target.value);
        });

        document.getElementById('textColor').addEventListener('input', (e) => {
            document.execCommand('foreColor', false, e.target.value);
        });

        document.getElementById('bgColor').addEventListener('input', (e) => {
            document.execCommand('hiliteColor', false, e.target.value);
        });

        // Image insertion
        document.getElementById('imageBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'editor-image';
                    
                    const container = document.createElement('div');
                    container.className = 'image-container';
                    
                    const removeBtn = document.createElement('div');
                    removeBtn.className = 'image-remove';
                    removeBtn.innerHTML = '<i class="bx bx-x"></i>';
                    removeBtn.onclick = () => container.remove();
                    
                    container.appendChild(img);
                    container.appendChild(removeBtn);
                    
                    // Insert at cursor position
                    const selection = window.getSelection();
                    if (selection.rangeCount > 0) {
                        const range = selection.getRangeAt(0);
                        range.insertNode(container);
                        range.collapse(false);
                    } else {
                        editor.appendChild(container);
                    }
                };
                reader.readAsDataURL(file);
            };
            input.click();
        });

        // Link insertion
        document.getElementById('linkBtn').addEventListener('click', () => {
            const url = prompt('Enter URL:');
            if (url) {
                document.execCommand('createLink', false, url);
            }
        });

        // Global search
        document.getElementById('globalSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            // Filter documents in current view
            if (term) {
                const allDocs = [...documents.logins, ...documents.notes, ...documents.projects];
                const filtered = allDocs.filter(doc => 
                    doc.title?.toLowerCase().includes(term) ||
                    doc.content?.toLowerCase().includes(term)
                );
                // Display results in editor
                editor.innerHTML = '<div class="search-results"></div>';
                const results = editor.querySelector('.search-results');
                filtered.forEach(doc => {
                    results.innerHTML += `<div>📄 ${doc.title}</div>`;
                });
            }
        });

        // Initialize
        updateCounts();
        renderFolders();
    </script>
</body>
</html>
