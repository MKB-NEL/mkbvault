<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boveda · document OS</title>
    <!-- Inter font - 2026 standard -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 2026 design system - clean lines */
        :root {
            --primary: #0066CC;
            --primary-light: #E3F0FF;
            --secondary: #86868b;
            --background: #f5f5f7;
            --surface: #ffffff;
            --border: #d2d2d7;
            --text: #1d1d1f;
            --text-light: #86868b;
            --shadow: 0 4px 6px -2px rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        /* Layout */
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--text);
            cursor: pointer;
        }

        .logo-icon {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .nav-menu {
            display: flex;
            gap: 0.25rem;
        }

        .nav-item {
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            border: none;
            background: transparent;
            transition: all 0.2s;
            position: relative;
        }

        .nav-item:hover {
            color: var(--text);
            background: rgba(0,0,0,0.02);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -0.75rem;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .search-container {
            position: relative;
            width: 280px;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--primary-light);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary);
        }

        .user-name {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Document header */
        .doc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .doc-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .doc-actions {
            display: flex;
            gap: 0.75rem;
        }

        .doc-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .doc-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .doc-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .doc-btn.primary:hover {
            background: #0052a3;
        }

        /* Workspace tabs */
        .workspace-tabs {
            display: flex;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .workspace-tab {
            padding: 1rem 2rem;
            background: white;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            justify-content: center;
        }

        .workspace-tab i {
            font-size: 1.25rem;
        }

        .workspace-tab:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .workspace-tab.active {
            background: white;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        /* Document grid */
        .document-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .document-item {
            background: white;
            padding: 1.5rem;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .document-item:hover {
            background: #fafafa;
        }

        .document-item.selected {
            background: var(--primary-light);
            border-left: 3px solid var(--primary);
        }

        .document-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .document-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .document-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            padding: 0.25rem 0.5rem;
            border: 1px solid var(--border);
            background: white;
        }

        .document-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .document-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .document-preview {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            line-height: 1.6;
            max-height: 4.8rem;
            overflow: hidden;
        }

        .document-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .document-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .document-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid var(--border);
            background: white;
            color: var(--text-light);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            background: var(--primary-light);
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .document-actions {
            display: flex;
            gap: 0.5rem;
        }

        .doc-action-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .doc-action-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Login specific */
        .login-credentials {
            background: var(--primary-light);
            padding: 0.75rem;
            border: 1px solid var(--border);
            margin: 1rem 0;
            font-family: monospace;
        }

        /* Folder specific */
        .folder-stats {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .stat {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* Project specific */
        .project-progress {
            margin: 1rem 0;
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
        }

        .collaborators {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--primary-light);
            border: 1px solid var(--border);
        }

        .collaborator {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .collaborator i {
            color: var(--primary);
        }

        .collaborator a {
            color: var(--primary);
            text-decoration: none;
        }

        .collaborator a:hover {
            text-decoration: underline;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            font-size: 1.5rem;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 1.5rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            background: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Collaborator row */
        .collaborator-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .collaborator-row input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border);
        }

        .remove-collab {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-collab:hover {
            background: #fee2e2;
            border-color: #dc2626;
            color: #dc2626;
        }

        .add-collab {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border: 1px dashed var(--border);
            background: transparent;
            width: 100%;
            cursor: pointer;
            color: var(--primary);
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .breadcrumb-item {
            font-size: 0.95rem;
            color: var(--text-light);
            cursor: pointer;
        }

        .breadcrumb-item:hover {
            color: var(--primary);
        }

        .breadcrumb-item.active {
            color: var(--text);
            font-weight: 500;
        }

        .breadcrumb-separator {
            color: var(--border);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            padding: 4rem;
            text-align: center;
            background: white;
            border: 1px solid var(--border);
        }

        .empty-icon {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 1rem;
        }

        .empty-text {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .top-bar {
                padding: 0.75rem 1rem;
            }
            
            .search-container {
                width: 200px;
            }
            
            .workspace-tab {
                padding: 1rem;
            }
        }

        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }
            
            .search-container {
                width: 160px;
            }
            
            .doc-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .workspace-tabs {
                flex-direction: column;
            }
            
            .document-grid {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="logo" onclick="window.location.href='vault.html'">
                    <span class="logo-icon">🔐</span>
                    <span>BOVEDA</span>
                </div>
                <div class="nav-menu">
                    <button class="nav-item active">Documents</button>
                    <button class="nav-item">Recent</button>
                    <button class="nav-item">Shared</button>
                    <button class="nav-item">Trash</button>
                </div>
            </div>
            <div class="top-bar-right">
                <div class="search-container">
                    <i class='bx bx-search search-icon'></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search documents...">
                </div>
                <div class="user-menu">
                    <div class="user-avatar">JD</div>
                    <span class="user-name" id="userName">John</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Document Header -->
            <div class="doc-header">
                <div class="doc-header-left">
                    <button class="back-btn" id="backBtn">
                        <i class='bx bx-arrow-back'></i>
                    </button>
                    <h1 class="page-title">Document Workspace</h1>
                </div>
                <div class="doc-actions">
                    <button class="doc-btn" id="exportBtn">
                        <i class='bx bx-export'></i>
                        Export All
                    </button>
                </div>
            </div>

            <!-- Breadcrumb -->
            <div class="breadcrumb" id="breadcrumb">
                <span class="breadcrumb-item active">All Documents</span>
            </div>

            <!-- Workspace Tabs -->
            <div class="workspace-tabs" id="workspaceTabs">
                <button class="workspace-tab active" data-category="logins">
                    <i class='bx bx-lock-alt'></i>
                    <span>Logins</span>
                </button>
                <button class="workspace-tab" data-category="notes">
                    <i class='bx bx-note'></i>
                    <span>Notes</span>
                </button>
                <button class="workspace-tab" data-category="projects">
                    <i class='bx bx-briefcase'></i>
                    <span>Projects</span>
                </button>
                <button class="workspace-tab" data-category="folders">
                    <i class='bx bx-folder'></i>
                    <span>Folders</span>
                </button>
            </div>

            <!-- Document Grid -->
            <div class="document-grid" id="documentGrid">
                <!-- Dynamic content will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Folder Modal -->
    <div class="modal" id="folderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="folderModalTitle">Folder Contents</h2>
                <i class='bx bx-x modal-close' id="closeFolderModal"></i>
            </div>
            <div class="modal-body">
                <div class="folder-header" style="margin-bottom: 1.5rem;">
                    <h3 id="folderModalName" style="font-size: 1.5rem; font-weight: 600;"></h3>
                </div>
                <div class="document-grid" id="folderItemsGrid" style="grid-template-columns: 1fr;">
                    <!-- Folder items will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Delete Document</h2>
                <i class='bx bx-x modal-close' id="closeDeleteModal"></i>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this document? This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="doc-btn" id="cancelDelete">Cancel</button>
                <button class="doc-btn primary" style="background: #dc2626;" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Load data from localStorage
        let vaultData = JSON.parse(localStorage.getItem('boveda_vault')) || {
            logins: [],
            notes: [],
            projects: [],
            folders: []
        };

        let currentCategory = 'logins';
        let searchTerm = '';
        let itemToDelete = null;

        // DOM elements
        const documentGrid = document.getElementById('documentGrid');
        const searchInput = document.getElementById('searchInput');
        const workspaceTabs = document.querySelectorAll('.workspace-tab');
        const exportBtn = document.getElementById('exportBtn');
        const backBtn = document.getElementById('backBtn');
        const folderModal = document.getElementById('folderModal');
        const closeFolderModal = document.getElementById('closeFolderModal');
        const folderModalName = document.getElementById('folderModalName');
        const folderItemsGrid = document.getElementById('folderItemsGrid');
        const userName = document.getElementById('userName');
        const deleteModal = document.getElementById('deleteModal');
        const closeDeleteModal = document.getElementById('closeDeleteModal');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');

        // Set user name
        const userEmail = sessionStorage.getItem('userEmail') || 'john.doe@example.com';
        userName.textContent = userEmail.split('@')[0];

        // Save data
        function saveData() {
            localStorage.setItem('boveda_vault', JSON.stringify(vaultData));
        }

        // Render documents
        function renderDocuments() {
            let items = vaultData[currentCategory] || [];
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                items = items.filter(item => 
                    item.title?.toLowerCase().includes(term) ||
                    item.username?.toLowerCase().includes(term) ||
                    item.text?.toLowerCase().includes(term) ||
                    item.content?.toLowerCase().includes(term)
                );
            }

            if (items.length === 0) {
                documentGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📄</div>
                        <div class="empty-text">No ${currentCategory} found</div>
                        <button class="doc-btn primary" onclick="createNewDocument()">
                            <i class='bx bx-plus'></i>
                            Create New ${currentCategory.slice(0, -1)}
                        </button>
                    </div>
                `;
                return;
            }

            documentGrid.innerHTML = items.map(item => {
                if (currentCategory === 'logins') {
                    return `
                        <div class="document-item" onclick="openDocument('${item.id}', 'logins')">
                            <div class="document-header">
                                <div class="document-icon"><i class='bx bx-lock-alt'></i></div>
                                <span class="document-type">Login</span>
                            </div>
                            <div class="document-title">${item.title || 'Untitled'}</div>
                            <div class="document-meta">
                                <span><i class='bx bx-globe'></i> ${item.url || 'No URL'}</span>
                                <span><i class='bx bx-user'></i> ${item.username || 'No username'}</span>
                            </div>
                            <div class="document-footer">
                                <div class="document-tags">
                                    <span class="tag">${item.folder ? 'In folder' : 'Root'}</span>
                                </div>
                                <div class="document-actions" onclick="event.stopPropagation()">
                                    <button class="doc-action-btn" onclick="editDocument('${item.id}', 'logins')"><i class='bx bx-edit'></i></button>
                                    <button class="doc-action-btn" onclick="deleteDocument('${item.id}', 'logins')"><i class='bx bx-trash'></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentCategory === 'notes') {
                    return `
                        <div class="document-item" onclick="openDocument('${item.id}', 'notes')">
                            <div class="document-header">
                                <div class="document-icon"><i class='bx bx-note'></i></div>
                                <span class="document-type">Note</span>
                            </div>
                            <div class="document-title">${item.title || 'Untitled'}</div>
                            <div class="document-meta">
                                <span><i class='bx bx-calendar'></i> ${new Date(item.createdAt || Date.now()).toLocaleDateString()}</span>
                            </div>
                            <div class="document-preview">${(item.content || '').replace(/<[^>]*>/g, '').substring(0, 120)}...</div>
                            <div class="document-footer">
                                <div class="document-tags">
                                    <span class="tag">${item.folder ? 'In folder' : 'Root'}</span>
                                </div>
                                <div class="document-actions" onclick="event.stopPropagation()">
                                    <button class="doc-action-btn" onclick="editDocument('${item.id}', 'notes')"><i class='bx bx-edit'></i></button>
                                    <button class="doc-action-btn" onclick="deleteDocument('${item.id}', 'notes')"><i class='bx bx-trash'></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentCategory === 'projects') {
                    return `
                        <div class="document-item" onclick="openDocument('${item.id}', 'projects')">
                            <div class="document-header">
                                <div class="document-icon"><i class='bx bx-briefcase'></i></div>
                                <span class="document-type">Project</span>
                            </div>
                            <div class="document-title">${item.title || 'Untitled'}</div>
                            <div class="document-meta">
                                <span><i class='bx bx-calendar'></i> ${new Date(item.createdAt || Date.now()).toLocaleDateString()}</span>
                                <span class="status-badge">${item.status || 'starting'}</span>
                            </div>
                            ${item.image ? `<img src="${item.image}" class="document-image" alt="Project">` : ''}
                            <div class="project-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${item.progress || 0}%"></div>
                                </div>
                            </div>
                            <div class="document-footer">
                                <div class="document-tags">
                                    <span class="tag">${item.folder ? 'In folder' : 'Root'}</span>
                                </div>
                                <div class="document-actions" onclick="event.stopPropagation()">
                                    <button class="doc-action-btn" onclick="editDocument('${item.id}', 'projects')"><i class='bx bx-edit'></i></button>
                                    <button class="doc-action-btn" onclick="deleteDocument('${item.id}', 'projects')"><i class='bx bx-trash'></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (currentCategory === 'folders') {
                    const items = item.items || [];
                    return `
                        <div class="document-item" onclick="openFolder('${item.id}')">
                            <div class="document-header">
                                <div class="document-icon"><i class='bx bx-folder'></i></div>
                                <span class="document-type">Folder</span>
                            </div>
                            <div class="document-title">${item.name}</div>
                            <div class="document-meta">
                                <span><i class='bx bx-file'></i> ${items.length} items</span>
                            </div>
                            <div class="folder-stats">
                                <span class="stat"><i class='bx bx-lock-alt'></i> ${items.filter(id => vaultData.logins.find(l => l.id === id)).length}</span>
                                <span class="stat"><i class='bx bx-note'></i> ${items.filter(id => vaultData.notes.find(n => n.id === id)).length}</span>
                                <span class="stat"><i class='bx bx-briefcase'></i> ${items.filter(id => vaultData.projects.find(p => p.id === id)).length}</span>
                            </div>
                            <div class="document-footer">
                                <div class="document-actions" onclick="event.stopPropagation()">
                                    <button class="doc-action-btn" onclick="editFolder('${item.id}')"><i class='bx bx-edit'></i></button>
                                    <button class="doc-action-btn" onclick="deleteFolder('${item.id}')"><i class='bx bx-trash'></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // Open document in doc.html
        function openDocument(id, type) {
            sessionStorage.setItem('currentDocId', id);
            sessionStorage.setItem('currentDocType', type);
            window.location.href = 'doc.html';
        }

        // Create new document
        window.createNewDocument = function() {
            sessionStorage.removeItem('currentDocId');
            sessionStorage.setItem('currentDocType', currentCategory.slice(0, -1));
            window.location.href = 'doc.html';
        };

        // Edit document
        window.editDocument = function(id, type) {
            sessionStorage.setItem('currentDocId', id);
            sessionStorage.setItem('currentDocType', type);
            window.location.href = 'doc.html';
        };

        // Delete document
        window.deleteDocument = function(id, type) {
            itemToDelete = { id, type };
            deleteModal.classList.add('active');
        };

        // Confirm delete
        confirmDelete.addEventListener('click', () => {
            if (itemToDelete) {
                vaultData[itemToDelete.type] = vaultData[itemToDelete.type].filter(item => item.id !== itemToDelete.id);
                
                // Remove from folders
                vaultData.folders.forEach(folder => {
                    if (folder.items) {
                        folder.items = folder.items.filter(itemId => itemId !== itemToDelete.id);
                    }
                });
                
                saveData();
                renderDocuments();
                deleteModal.classList.remove('active');
                itemToDelete = null;
            }
        });

        // Open folder
        window.openFolder = (folderId) => {
            const folder = vaultData.folders.find(f => f.id === folderId);
            if (folder) {
                folderModalName.textContent = folder.name;
                
                const items = folder.items || [];
                if (items.length === 0) {
                    folderItemsGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📂</div>
                            <div class="empty-text">Folder is empty</div>
                        </div>
                    `;
                } else {
                    folderItemsGrid.innerHTML = items.map(id => {
                        const login = vaultData.logins.find(l => l.id === id);
                        const note = vaultData.notes.find(n => n.id === id);
                        const project = vaultData.projects.find(p => p.id === id);
                        const item = login || note || project;
                        
                        if (item) {
                            return `
                                <div class="document-item" onclick="openDocument('${item.id}', '${login ? 'logins' : note ? 'notes' : 'projects'}')">
                                    <div class="document-header">
                                        <div class="document-icon"><i class='bx ${login ? 'bx-lock-alt' : note ? 'bx-note' : 'bx-briefcase'}'></i></div>
                                        <span class="document-type">${login ? 'Login' : note ? 'Note' : 'Project'}</span>
                                    </div>
                                    <div class="document-title">${item.title || 'Untitled'}</div>
                                </div>
                            `;
                        }
                    }).join('');
                }
                
                folderModal.classList.add('active');
            }
        };

        // Edit folder
        window.editFolder = (id) => {
            const newName = prompt('Enter new folder name:');
            if (newName) {
                const folder = vaultData.folders.find(f => f.id === id);
                if (folder) {
                    folder.name = newName;
                    saveData();
                    renderDocuments();
                }
            }
        };

        // Delete folder
        window.deleteFolder = (id) => {
            if (confirm('Delete this folder? Items inside will not be deleted.')) {
                vaultData.folders = vaultData.folders.filter(f => f.id !== id);
                saveData();
                renderDocuments();
            }
        };

        // Event listeners
        workspaceTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                workspaceTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                renderDocuments();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderDocuments();
        });

        exportBtn.addEventListener('click', () => {
            const data = JSON.stringify(vaultData, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `boveda-export-${new Date().toISOString()}.json`;
            a.click();
        });

        backBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Modal close
        closeFolderModal.addEventListener('click', () => {
            folderModal.classList.remove('active');
        });

        folderModal.addEventListener('click', (e) => {
            if (e.target === folderModal) {
                folderModal.classList.remove('active');
            }
        });

        closeDeleteModal.addEventListener('click', () => {
            deleteModal.classList.remove('active');
            itemToDelete = null;
        });

        cancelDelete.addEventListener('click', () => {
            deleteModal.classList.remove('active');
            itemToDelete = null;
        });

        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                deleteModal.classList.remove('active');
                itemToDelete = null;
            }
        });

        // Initialize
        renderDocuments();
    </script>
</body>
</html>
