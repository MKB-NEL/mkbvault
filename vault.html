<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Vault · Dashboard</title>

    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ===== ICONIFY ===== -->
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f6f8f6;
            --bg-card: #ffffff;
            --bg-input: #f2f2f2;
            --text-primary: #333333;
            --text-secondary: #7A7A7A;
            --text-muted: #aaaaaa;
            --accent: #2395ed;
            --accent-hover: #016fc6;
            --accent-light: #e8f4fd;
            --success: #1aaa4d;
            --error: #dc2626;
            --warning: #f59e0b;
            --border-light: #f0f0f0;
            --border-medium: #cccccc;
            --radius-sm: 6px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.10);
            --transition: 0.2s ease;
            --header-bg: #2395ed;
            --header-bg-scrolled: #1180d6;
            --yellow-light: #fff9e6;
            --yellow-box: #fef3c7;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- AUTH GUARD ---------- */
        #authGuard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 1.5rem;
            transition: opacity 0.6s ease;
        }
        #authGuard.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #authGuard .spinner-ring {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #authGuard p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        #authGuard .error-icon { font-size: 3rem; color: var(--error); }
        #authGuard .error-text { font-size: 1rem; color: var(--text-primary); font-weight: 500; }
        #authGuard .error-sub { font-size: 0.85rem; color: var(--text-secondary); font-weight: 300; }
        #authGuard .redirect-btn {
            margin-top: 0.5rem;
            padding: 0.7rem 2rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
        }
        #authGuard .redirect-btn:hover {
            background: var(--accent-hover);
        }

        /* ---------- VAULT CONTENT ---------- */
        #vaultContent {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px 24px;
        }
        #vaultContent.visible {
            display: block;
            opacity: 1;
        }

        /* ============================================================ */
        /* ===== HERO SECTION ===== */
        /* ============================================================ */
        .hero {
            position: relative;
            height: 180px;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 24px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            background-size: cover;
            background-position: center;
        }
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 1rem 2rem;
        }
        .hero-content h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .hero-content p {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.9;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* ============================================================ */
        /* ===== HEADER (Start.me style) ===== */
        /* ============================================================ */
        .vault-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            height: 52px;
            max-height: 52px;
            padding: 0 16px;
            margin: 0 -16px 16px;
            background: var(--header-bg);
            color: #fff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
        }

        .vault-header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .vault-header .brand .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
        }
        .vault-header .brand .logo-icon iconify-icon {
            font-size: 1.2rem;
        }
        .vault-header .brand h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .vault-header .brand .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 400;
            opacity: 0.7;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.05rem 0.5rem;
            border-radius: 20px;
            margin-left: 4px;
        }

        .vault-header .search-wrapper {
            flex: 1 1 auto;
            max-width: 400px;
            margin: 0 16px;
            position: relative;
        }
        .vault-header .search-wrapper input {
            width: 100%;
            height: 34px;
            padding: 0 12px 0 34px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: background 0.2s ease;
        }
        .vault-header .search-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        .vault-header .search-wrapper input:focus {
            background: rgba(255, 255, 255, 0.3);
        }
        .vault-header .search-wrapper iconify-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            pointer-events: none;
        }

        .vault-header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .vault-header .actions .btn {
            padding: 0.4rem 0.9rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s ease, transform 0.15s ease;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .vault-header .actions .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .vault-header .actions .btn:active {
            transform: scale(0.97);
        }
        .vault-header .actions .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .vault-header .actions .btn-primary:hover {
            background: var(--accent-hover);
        }
        .vault-header .actions .btn-danger {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .vault-header .actions .btn-danger:hover {
            background: rgba(220, 38, 38, 0.3);
            border-color: #dc2626;
        }

        /* ============================================================ */
        /* ===== WIDGETS LAYOUT ===== */
        /* ============================================================ */
        .widgets-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 16px;
        }
        .widgets-grid .widget {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 600px;
        }
        .widget-header {
            padding: 10px 14px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .widget-header .widget-title {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .widget-header .widget-title iconify-icon {
            font-size: 1.1rem;
        }
        .widget-header .widget-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .widget-header .widget-controls .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 0 8px;
            height: 28px;
            transition: border-color 0.2s;
        }
        .widget-header .widget-controls .search-box:focus-within {
            border-color: var(--accent);
        }
        .widget-header .widget-controls .search-box iconify-icon {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .widget-header .widget-controls .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.8rem;
            padding: 0 4px;
            width: 80px;
            font-family: 'Inter', sans-serif;
        }
        .widget-header .widget-controls .search-box input:focus {
            width: 120px;
        }
        .widget-header .widget-controls .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            gap: 3px;
            transition: background 0.2s;
        }
        .widget-header .widget-controls .btn-icon:hover {
            background: var(--bg-primary);
        }
        .widget-header .widget-controls .btn-icon.primary {
            color: var(--accent);
        }
        .widget-header .widget-controls .btn-icon.danger {
            color: var(--error);
        }
        .widget-header .widget-controls .btn-icon:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .widget-header .widget-controls .match-count {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 2px;
        }
        .widget-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            position: relative;
        }
        .widget-body::-webkit-scrollbar {
            width: 5px;
        }
        .widget-body::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 10px;
        }

        /* ---------- CREDENTIALS WIDGET (list) ---------- */
        .credential-groups {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .credential-group {
            border-bottom: 1px solid var(--border-light);
        }
        .credential-group:last-child {
            border-bottom: none;
        }
        .group-header {
            display: flex;
            align-items: center;
            padding: 6px 0;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            gap: 6px;
            user-select: none;
        }
        .group-header iconify-icon {
            transition: transform 0.2s;
            font-size: 1rem;
        }
        .group-header .group-name {
            flex: 1;
        }
        .group-header .group-count {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-right: 4px;
        }
        .group-header .group-actions {
            display: flex;
            gap: 4px;
        }
        .group-header .group-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 4px;
            font-size: 0.8rem;
        }
        .group-header .group-actions button:hover {
            color: var(--text-primary);
        }
        .group-content {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            padding-left: 24px;
        }
        .group-content.expanded {
            max-height: 3000px;
        }
        .credential-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-light);
            transition: background 0.1s;
        }
        .credential-item:last-child {
            border-bottom: none;
        }
        .credential-item .item-checkbox {
            display: none;
        }
        .credential-item .item-checkbox.show {
            display: inline-flex;
        }
        .credential-item .item-title {
            flex: 1;
            cursor: pointer;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .credential-item .item-title .highlight {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }
        .credential-item .item-title:hover {
            text-decoration: underline;
        }
        .credential-item .item-actions {
            display: flex;
            gap: 4px;
        }
        .credential-item .item-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 0 4px;
        }
        .credential-item .item-actions button:hover {
            color: var(--text-primary);
        }
        .credential-item .item-actions .delete:hover {
            color: var(--error);
        }
        .multi-select-actions {
            display: none;
            padding: 4px 0 8px;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-light);
            margin-top: 4px;
        }
        .multi-select-actions.show {
            display: flex;
        }
        .multi-select-actions .btn-icon {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 2px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .multi-select-actions .btn-icon:hover {
            background: var(--accent-light);
        }

        /* ---------- BOOKMARK WIDGET (grid) ---------- */
        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 4px 0;
        }
        .bookmark-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
            position: relative;
            text-align: center;
        }
        .bookmark-item:hover {
            border-color: var(--accent-light);
            background: var(--accent-light);
        }
        .bookmark-item .bookmark-checkbox {
            position: absolute;
            top: 4px;
            left: 4px;
            display: none;
        }
        .bookmark-item .bookmark-checkbox.show {
            display: block;
        }
        .bookmark-item .favicon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-bottom: 4px;
        }
        .bookmark-item .b-title {
            font-size: 0.7rem;
            font-weight: 500;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bookmark-item .b-title .highlight {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }
        .bookmark-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 8px 0 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .bookmark-pagination button {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 2px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .bookmark-pagination button:hover {
            background: var(--bg-primary);
        }
        .bookmark-pagination button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* ---------- NOTES WIDGET (grid yellow) ---------- */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .note-box {
            background: var(--yellow-box);
            border-radius: var(--radius-sm);
            padding: 12px 8px;
            text-align: center;
            font-weight: 500;
            color: #1a1a1a;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            font-size: 0.85rem;
        }
        .note-box:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* ---------- PROJECTS WIDGET (list) ---------- */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .project-item {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.1s;
        }
        .project-item:hover {
            background: var(--bg-primary);
        }
        .project-item:last-child {
            border-bottom: none;
        }

        /* ---------- RECENTS SECTION ---------- */
        .recent-section {
            padding: 6px 12px 10px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-primary);
        }
        .recent-section .recent-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .recent-items {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .recent-item {
            font-size: 0.75rem;
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            cursor: pointer;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .recent-item:hover {
            background: var(--accent-light);
            color: var(--text-primary);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1000px) {
            .widgets-grid {
                grid-template-columns: 1fr;
            }
            .bookmark-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
        @media (max-width: 600px) {
            .vault-header {
                flex-wrap: wrap;
                height: auto;
                padding: 8px 12px;
            }
            .vault-header .brand { flex: 0 0 auto; }
            .vault-header .search-wrapper {
                order: 3;
                flex: 1 1 100%;
                margin: 8px 0 0;
                max-width: 100%;
            }
            .vault-header .actions { flex: 0 0 auto; }
            .hero { height: 120px; }
            .hero-content h1 { font-size: 1.4rem; }
            .hero-content p { font-size: 0.85rem; }
            .bookmark-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .notes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .widget-header .widget-controls .search-box input {
                width: 60px;
            }
            .widget-header .widget-controls .search-box input:focus {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== AUTH GUARD ===== -->
    <div id="authGuard">
        <div class="spinner-ring" id="authSpinner"></div>
        <p id="authStatus">Verifying session ...</p>
    </div>

    <!-- ===== VAULT CONTENT ===== -->
    <div id="vaultContent">

        <!-- ===== HERO SECTION ===== -->
        <section class="hero" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200&h=300&fit=crop&crop=center');">
            <div class="hero-content">
                <h1>Welcome back, Bertrand</h1>
                <p>Your digital vault — secure, organized, always accessible.</p>
            </div>
        </section>

        <!-- ===== HEADER ===== -->
        <header class="vault-header">
            <div class="brand">
                <div class="logo-icon">
                    <iconify-icon icon="mdi:lock-open"></iconify-icon>
                </div>
                <h1>Vault <span class="mono">· MK Bertrand</span></h1>
            </div>
            <div class="search-wrapper">
                <iconify-icon icon="mdi:search"></iconify-icon>
                <input type="text" id="globalSearch" placeholder="Search across vault ..." />
            </div>
            <div class="actions">
                <button class="btn btn-danger" id="logoutBtn">
                    <iconify-icon icon="mdi:logout"></iconify-icon> Logout
                </button>
            </div>
        </header>

        <!-- ===== WIDGETS GRID ===== -->
        <div class="widgets-grid">

            <!-- ===== CREDENTIALS WIDGET ===== -->
            <div class="widget" id="credentialWidget">
                <div class="widget-header">
                    <div class="widget-title">
                        <iconify-icon icon="mdi:key"></iconify-icon>
                        Credentials
                    </div>

    <script type="importmap">
        {

            }
        }
    </script>

    <script type="module">
        // =============================================================
        // 1. IMPORTS & CONFIG
        // =============================================================
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, onValue, push, set, update, remove } from 'firebase/database';

        const firebaseConfig = {
            apiKey: 'AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0',
            authDomain: 'joefootball-15e7a.firebaseapp.com',
            databaseURL: 'https://joefootball-15e7a-default-rtdb.firebaseio.com',
            projectId: 'joefootball-15e7a',
            storageBucket: 'joefootball-15e7a.firebasestorage.app',
            messagingSenderId: '976347287101',
            appId: '1:976347287101:web:93a93c519fff7e60986454',
            measurementId: 'G-3Q10KV3HE3'
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const itemsRef = ref(database, 'vault-items');

        // =============================================================
        // 2. SESSION / AUTH
        // =============================================================
        const SESSION_KEY = 'vault_authenticated';
        const SESSION_TIME_KEY = 'vault_login_time';
        const SESSION_DURATION_MS = 24 * 60 * 60 * 1000;

        const authGuard = document.getElementById('authGuard');
        const authStatus = document.getElementById('authStatus');
        const authSpinner = document.getElementById('authSpinner');
        const vaultContent = document.getElementById('vaultContent');

        function checkAuthentication() {
            const isAuth = sessionStorage.getItem(SESSION_KEY);
            const loginTime = parseInt(sessionStorage.getItem(SESSION_TIME_KEY) || '0');
            const now = Date.now();
            if (isAuth !== 'true' || now - loginTime > SESSION_DURATION_MS) {
                sessionStorage.removeItem(SESSION_KEY);
                sessionStorage.removeItem(SESSION_TIME_KEY);
                showAuthError('Your session has expired or is invalid.');
                return false;
            }
            return true;
        }

        function showAuthError(message) {
            authSpinner.style.display = 'none';
            authStatus.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;text-align:center;">
                    <iconify-icon icon="mdi:alert-circle" style="font-size:3rem;color:#ef4444;"></iconify-icon>
                    <span style="font-size:1rem;font-weight:500;color:#0f172a;">Access Denied</span>
                    <span style="font-size:0.85rem;color:#64748b;font-weight:300;">${message}</span>
                    <a href="index.html" class="redirect-btn">Return to Login</a>
                </div>
            `;
        }

        function grantAccess() {
            authGuard.classList.add('hidden');
            vaultContent.classList.add('visible');
            sessionStorage.setItem(SESSION_TIME_KEY, Date.now().toString());
            initVault();
        }

        setTimeout(() => {
            if (checkAuthentication()) grantAccess();
        }, 400);

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem(SESSION_KEY);
            sessionStorage.removeItem(SESSION_TIME_KEY);
            window.location.href = 'index.html';
        });

        document.getElementById('footerYear').textContent = new Date().getFullYear();

        // =============================================================
        // 3. STATE
        // =============================================================
        let allItems = [];
        let credentialGroups = {}; // { groupName: [itemIds] }
        let bookmarkCategories = {}; // { categoryName: [itemIds] }
        let credentialSelectMode = false;
        let bookmarkSelectMode = false;
        let selectedCredIds = new Set();
        let selectedBookIds = new Set();

        // Bookmark pagination
        let bookPage = 0;
        const BOOKS_PER_PAGE = 10;

        // Search state
        let credSearchTerm = '';
        let bookSearchTerm = '';
        let globalSearchTerm = '';

        // =============================================================
        // 4. UTILITY FUNCTIONS
        // =============================================================

        function formatDate(ts) {
            return new Date(ts).toLocaleDateString();
        }

        function debounce(fn, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        // =============================================================
        // 5. FIREBASE READ
        // =============================================================

        function initVault() {
            onValue(itemsRef, (snapshot) => {
                const data = snapshot.val();
                allItems = data ? Object.entries(data).map(([id, value]) => ({
                    id,
                    ...value,
                    createdAt: value.createdAt || Date.now()
                })) : [];
                buildIndexes();
                renderAll();
            }, (error) => {
                console.error('Firebase read error:', error);
                showToast('Error loading vault data.', 'error');
            });
        }

        function buildIndexes() {
            // Credential groups
            credentialGroups = {};
            const creds = allItems.filter(i => i.type === 'credential' && !i.trash);
            creds.forEach(item => {
                const group = item.group || 'General';
                if (!credentialGroups[group]) credentialGroups[group] = [];
                credentialGroups[group].push(item.id);
            });
            // Ensure General exists
            if (!credentialGroups['General']) credentialGroups['General'] = [];

            // Bookmark categories
            bookmarkCategories = {};
            const books = allItems.filter(i => i.type === 'bookmark' && !i.trash);
            books.forEach(item => {
                const cat = item.category || 'Uncategorized';
                if (!bookmarkCategories[cat]) bookmarkCategories[cat] = [];
                bookmarkCategories[cat].push(item.id);
            });
            if (!bookmarkCategories['Uncategorized']) bookmarkCategories['Uncategorized'] = [];
        }

        // =============================================================
        // 6. RENDER ALL WIDGETS
        // =============================================================

        function renderAll() {
            renderCredentials();
            renderBookmarks();
            renderNotes();
            renderProjects();
            renderRecents();
        }

        // =============================================================
        // 7. CREDENTIALS WIDGET
        // =============================================================

        function renderCredentials() {
            const container = document.getElementById('credGroups');
            const searchTerm = credSearchTerm.toLowerCase().trim();
            const matchCount = document.getElementById('credMatchCount');

            // Filter items based on search
            let filteredGroups = {};
            let totalMatches = 0;

            // Determine which groups to show and which items inside match
            const allGroups = Object.keys(credentialGroups);
            allGroups.forEach(group => {
                const ids = credentialGroups[group] || [];
                const items = ids.map(id => allItems.find(i => i.id === id)).filter(Boolean);
                // Filter items by search
                let matchedItems = items;
                if (searchTerm) {
                    matchedItems = items.filter(item =>
                        (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                        (item.username && item.username.toLowerCase().includes(searchTerm)) ||
                        (item.url && item.url.toLowerCase().includes(searchTerm))
                    );
                }
                if (matchedItems.length > 0 || !searchTerm) {
                    filteredGroups[group] = matchedItems;
                    totalMatches += matchedItems.length;
                }
            });

            matchCount.textContent = searchTerm ? `(${totalMatches} matches)` : '';

            // Build HTML
            let html = '';
            const groupNames = Object.keys(filteredGroups).sort((a, b) => a.localeCompare(b));
            // Ensure General is first if exists
            if (groupNames.includes('General')) {
                groupNames.splice(groupNames.indexOf('General'), 1);
                groupNames.unshift('General');
            }

            groupNames.forEach(group => {
                const items = filteredGroups[group];
                const isExpanded = true; // we'll let user toggle with click

                html += `<div class="credential-group" data-group="${group}">
                    <div class="group-header" data-toggle="group">
                        <iconify-icon icon="mdi:chevron-down"></iconify-icon>
                        <span class="group-name">${group}</span>
                        <span class="group-count">(${items.length})</span>
                        <div class="group-actions">
                            <button class="btn-icon" data-action="renameGroup" title="Rename">✎</button>
                            <button class="btn-icon danger" data-action="deleteGroup" title="Delete group">✕</button>
                        </div>
                    </div>
                    <div class="group-content expanded">
                        ${items.map(item => {
                            const isSelected = selectedCredIds.has(item.id);
                            const titleHtml = item.title ? item.title.replace(new RegExp(searchTerm, 'gi'), match => `<span class="highlight">${match}</span>`) : 'Untitled';
                            return `
                                <div class="credential-item" data-id="${item.id}">
                                    <span class="item-checkbox ${credentialSelectMode ? 'show' : ''}">
                                        <input type="checkbox" ${isSelected ? 'checked' : ''} data-id="${item.id}" class="cred-check" />
                                    </span>
                                    <span class="item-title" data-action="openCred" title="${item.title || ''}">${titleHtml}</span>
                                    <div class="item-actions">
                                        <button data-action="openCred" title="Open">📂</button>
                                        <button class="delete" data-action="deleteCred" title="Delete">🗑</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
            });

            container.innerHTML = html;

            // Toggle group expansion
            container.querySelectorAll('[data-toggle="group"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.group-actions')) return;
                    const content = el.parentElement.querySelector('.group-content');
                    if (content) {
                        content.classList.toggle('expanded');
                        const icon = el.querySelector('iconify-icon');
                        if (icon) icon.setAttribute('icon', content.classList.contains('expanded') ? 'mdi:chevron-down' : 'mdi:chevron-right');
                    }
                });
            });

            // Attach event listeners for item actions
            container.querySelectorAll('[data-action="openCred"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const itemEl = el.closest('.credential-item');
                    if (!itemEl) return;
                    const id = itemEl.dataset.id;
                    openCredential(id);
                });
            });

            container.querySelectorAll('[data-action="deleteCred"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const itemEl = el.closest('.credential-item');
                    if (!itemEl) return;
                    const id = itemEl.dataset.id;
                    if (confirm('Move this credential to trash?')) {
                        moveToTrash(id);
                    }
                });
            });

            // Select checkboxes
            container.querySelectorAll('.cred-check').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = cb.dataset.id;
                    if (cb.checked) selectedCredIds.add(id);
                    else selectedCredIds.delete(id);
                    updateCredMultiActions();
                });
            });

            // Multi-select actions visibility
            updateCredMultiActions();
        }

        function updateCredMultiActions() {
            const container = document.getElementById('credMultiActions');
            const show = credentialSelectMode && selectedCredIds.size > 0;
            container.classList.toggle('show', show);
            document.getElementById('credOpenMulti').disabled = !show;
            document.getElementById('credDeleteMulti').disabled = !show;
        }

        // Toggle select mode
        document.getElementById('credSelectToggle').addEventListener('change', (e) => {
            credentialSelectMode = e.target.checked;
            if (!credentialSelectMode) {
                selectedCredIds.clear();
            }
            renderCredentials();
        });

        // Multi-select actions
        document.getElementById('credOpenMulti').addEventListener('click', () => {
            if (selectedCredIds.size === 0) return;
            selectedCredIds.forEach(id => openCredential(id));
        });

        document.getElementById('credDeleteMulti').addEventListener('click', () => {
            if (selectedCredIds.size === 0) return;
            if (confirm(`Delete ${selectedCredIds.size} credential(s)?`)) {
                selectedCredIds.forEach(id => moveToTrash(id));
                selectedCredIds.clear();
                renderCredentials();
                showToast('Credentials moved to trash', 'warning');
            }
        });

        // Add group
        document.getElementById('credAddGroup').addEventListener('click', () => {
            const name = prompt('Enter new group name:');
            if (name && name.trim() && !credentialGroups[name.trim()]) {
                credentialGroups[name.trim()] = [];
                // Optionally, we could store groups in Firebase, but we derive from items.
                // For now, we just re-render.
                renderCredentials();
                showToast(`Group "${name.trim()}" created`, 'success');
            } else if (name && name.trim()) {
                showToast('Group already exists.', 'warning');
            }
        });

        // Group rename/delete via delegated events
        document.getElementById('credBody').addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            const groupHeader = target.closest('.group-header');
            if (!groupHeader) return;
            const groupName = groupHeader.querySelector('.group-name')?.textContent;
            if (!groupName) return;

            if (action === 'renameGroup') {
                const newName = prompt(`Rename group "${groupName}" to:`, groupName);
                if (newName && newName.trim() && newName.trim() !== groupName) {
                    // Update all items in this group
                    const ids = credentialGroups[groupName] || [];
                    const updates = {};
                    ids.forEach(id => {
                        updates[`vault-items/${id}/group`] = newName.trim();
                    });
                    update(ref(database), updates);
                    showToast(`Group renamed to "${newName.trim()}"`, 'success');
                }
            } else if (action === 'deleteGroup') {
                if (confirm(`Delete group "${groupName}" and move its items to "General"?`)) {
                    const ids = credentialGroups[groupName] || [];
                    const updates = {};
                    ids.forEach(id => {
                        updates[`vault-items/${id}/group`] = 'General';
                    });
                    update(ref(database), updates);
                    showToast(`Group "${groupName}" deleted, items moved to General`, 'warning');
                }
            }
        });

        // =============================================================
        // 8. BOOKMARK WIDGET
        // =============================================================

        function renderBookmarks() {
            const grid = document.getElementById('bookGrid');
            const searchTerm = bookSearchTerm.toLowerCase().trim();
            const matchCount = document.getElementById('bookMatchCount');

            let books = allItems.filter(i => i.type === 'bookmark' && !i.trash);
            if (searchTerm) {
                books = books.filter(item =>
                    (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                    (item.url && item.url.toLowerCase().includes(searchTerm)) ||
                    (item.description && item.description.toLowerCase().includes(searchTerm))
                );
            }
            matchCount.textContent = searchTerm ? `(${books.length} matches)` : '';

            // Pagination
            const totalPages = Math.ceil(books.length / BOOKS_PER_PAGE) || 1;
            if (bookPage >= totalPages) bookPage = totalPages - 1;
            if (bookPage < 0) bookPage = 0;
            const start = bookPage * BOOKS_PER_PAGE;
            const pageBooks = books.slice(start, start + BOOKS_PER_PAGE);

            // Build grid
            let html = '';
            pageBooks.forEach(item => {
                const isSelected = selectedBookIds.has(item.id);
                const titleDisplay = item.title ? item.title.slice(0, 5) : 'Link';
                const titleHtml = item.title ? item.title.replace(new RegExp(searchTerm, 'gi'), match => `<span class="highlight">${match}</span>`) : 'Link';
                html += `
                    <div class="bookmark-item" data-id="${item.id}" title="${item.title || ''}">
                        <span class="bookmark-checkbox ${bookmarkSelectMode ? 'show' : ''}">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} data-id="${item.id}" class="book-check" />
                        </span>
                        <img class="favicon" src="${item.favicon || 'https://www.google.com/s2/favicons?domain=' + (item.url || '')}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>'" />
                        <span class="b-title">${titleHtml}</span>
                    </div>
                `;
            });

            if (pageBooks.length === 0) {
                html = `<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted);">No bookmarks found.</div>`;
            }

            grid.innerHTML = html;

            // Pagination controls
            document.getElementById('bookPageInfo').textContent = `${bookPage + 1} / ${totalPages}`;
            document.getElementById('bookPrev').disabled = bookPage === 0;
            document.getElementById('bookNext').disabled = bookPage >= totalPages - 1;

            // Click on bookmark to open
            grid.querySelectorAll('.bookmark-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.book-check')) return;
                    const id = el.dataset.id;
                    const item = allItems.find(i => i.id === id);
                    if (item && item.url) {
                        window.open(item.url, '_blank');
                    }
                });
            });

            // Checkboxes
            grid.querySelectorAll('.book-check').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = cb.dataset.id;
                    if (cb.checked) selectedBookIds.add(id);
                    else selectedBookIds.delete(id);
                    updateBookMultiActions();
                });
            });

            updateBookMultiActions();
        }

        function updateBookMultiActions() {
            const container = document.getElementById('bookMultiActions');
            const show = bookmarkSelectMode && selectedBookIds.size > 0;
            container.classList.toggle('show', show);
            document.getElementById('bookOpenMulti').disabled = !show;
            document.getElementById('bookDeleteMulti').disabled = !show;
        }

        document.getElementById('bookSelectToggle').addEventListener('change', (e) => {
            bookmarkSelectMode = e.target.checked;
            if (!bookmarkSelectMode) {
                selectedBookIds.clear();
            }
            renderBookmarks();
        });

        document.getElementById('bookOpenMulti').addEventListener('click', () => {
            if (selectedBookIds.size === 0) return;
            selectedBookIds.forEach(id => {
                const item = allItems.find(i => i.id === id);
                if (item && item.url) window.open(item.url, '_blank');
            });
        });

        document.getElementById('bookDeleteMulti').addEventListener('click', () => {
            if (selectedBookIds.size === 0) return;
            if (confirm(`Delete ${selectedBookIds.size} bookmark(s)?`)) {
                selectedBookIds.forEach(id => moveToTrash(id));
                selectedBookIds.clear();
                renderBookmarks();
                showToast('Bookmarks moved to trash', 'warning');
            }
        });

        // Pagination buttons
        document.getElementById('bookPrev').addEventListener('click', () => {
            if (bookPage > 0) { bookPage--; renderBookmarks(); }
        });
        document.getElementById('bookNext').addEventListener('click', () => {
            const total = Math.ceil(allItems.filter(i => i.type === 'bookmark' && !i.trash).length / BOOKS_PER_PAGE);
            if (bookPage < total - 1) { bookPage++; renderBookmarks(); }
        });

        // Add link
        document.getElementById('bookAddLink').addEventListener('click', () => {
            const url = prompt('Enter URL:');
            if (!url || !url.trim()) return;
            const trimmedUrl = url.trim();
            // Attempt to fetch metadata
            fetchMetadata(trimmedUrl).then(meta => {
                const category = prompt('Category (or leave blank for Uncategorized):') || 'Uncategorized';
                const newItem = {
                    type: 'bookmark',
                    title: meta.title || trimmedUrl,
                    url: trimmedUrl,
                    favicon: meta.favicon || `https://www.google.com/s2/favicons?domain=${trimmedUrl}`,
                    description: meta.description || '',
                    category: category.trim() || 'Uncategorized',
                    favorite: false,
                    trash: false,
                    createdAt: Date.now()
                };
                const newRef = push(itemsRef);
                set(newRef, newItem);
                showToast('Bookmark added!', 'success');
            }).catch(() => {
                // Fallback: manual entry
                const title = prompt('Enter title (or use URL):') || trimmedUrl;
                const category = prompt('Category (or leave blank for Uncategorized):') || 'Uncategorized';
                const newItem = {
                    type: 'bookmark',
                    title: title,
                    url: trimmedUrl,
                    favicon: `https://www.google.com/s2/favicons?domain=${trimmedUrl}`,
                    description: '',
                    category: category.trim() || 'Uncategorized',
                    favorite: false,
                    trash: false,
                    createdAt: Date.now()
                };
                const newRef = push(itemsRef);
                set(newRef, newItem);
                showToast('Bookmark added (manual).', 'success');
            });
        });

        async function fetchMetadata(url) {
            try {
                // Use a simple service to fetch metadata (we'll just try to get title from HTML)
                // For simplicity, we use a free API or fetch the page directly (CORS issues).
                // We'll implement a simple fetch and parse title from HTML.
                const response = await fetch(url, { mode: 'no-cors' }); // This won't work due to CORS.
                // Fallback: use a third-party service like api.allorigins.win? Might be complex.
                // For now, we'll return a basic object with url as title.
                console.warn('Fetch metadata via proxy not implemented. Using fallback.');
                return { title: url, favicon: `https://www.google.com/s2/favicons?domain=${url}`, description: '' };
            } catch (e) {
                return { title: url, favicon: `https://www.google.com/s2/favicons?domain=${url}`, description: '' };
            }
        }

        // =============================================================
        // 9. NOTES WIDGET
        // =============================================================

        function renderNotes() {
            const grid = document.getElementById('noteGrid');
            const notes = allItems.filter(i => i.type === 'note' && !i.trash);
            // Sort by createdAt descending
            notes.sort((a, b) => b.createdAt - a.createdAt);
            let html = '';
            notes.forEach(note => {
                html += `<div class="note-box" data-id="${note.id}" title="${note.title || ''}">${note.title || 'Untitled'}</div>`;
            });
            if (notes.length === 0) {
                html = `<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted);">No notes yet.</div>`;
            }
            grid.innerHTML = html;

            // Click to open note
            grid.querySelectorAll('.note-box').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    openNote(id);
                });
            });
        }

        document.getElementById('noteAdd').addEventListener('click', () => {
            const title = prompt('Enter note title:');
            if (!title || !title.trim()) return;
            const content = prompt('Enter note content (optional):') || '';
            const newItem = {
                type: 'note',
                title: title.trim(),
                content: content,
                favorite: false,
                trash: false,
                createdAt: Date.now()
            };
            const newRef = push(itemsRef);
            set(newRef, newItem);
            showToast('Note created!', 'success');
        });

        // =============================================================
        // 10. PROJECTS WIDGET
        // =============================================================

        function renderProjects() {
            const list = document.getElementById('projectList');
            const projects = allItems.filter(i => i.type === 'project' && !i.trash);
            projects.sort((a, b) => b.createdAt - a.createdAt);
            let html = '';
            projects.forEach(proj => {
                html += `<div class="project-item" data-id="${proj.id}">${proj.title || 'Untitled'}</div>`;
            });
            if (projects.length === 0) {
                html = `<div style="padding:12px;text-align:center;color:var(--text-muted);">No projects yet.</div>`;
            }
            list.innerHTML = html;

            list.querySelectorAll('.project-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    openProject(id);
                });
            });
        }

        document.getElementById('projectAdd').addEventListener('click', () => {
            const title = prompt('Enter project title:');
            if (!title || !title.trim()) return;
            const newItem = {
                type: 'project',
                title: title.trim(),
                status: 'Active',
                favorite: false,
                trash: false,
                createdAt: Date.now()
            };
            const newRef = push(itemsRef);
            set(newRef, newItem);
            showToast('Project created!', 'success');
        });

        // =============================================================
        // 11. RECENTS
        // =============================================================

        function renderRecents() {
            // Credentials recent (3 latest)
            const creds = allItems.filter(i => i.type === 'credential' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('credRecentItems', creds, openCredential);

            // Bookmarks recent (3 latest)
            const books = allItems.filter(i => i.type === 'bookmark' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('bookRecentItems', books, (id) => {
                const item = allItems.find(i => i.id === id);
                if (item && item.url) window.open(item.url, '_blank');
            });

            // Notes recent (3 latest)
            const notes = allItems.filter(i => i.type === 'note' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('noteRecentItems', notes, openNote);

            // Projects recent (3 latest)
            const projects = allItems.filter(i => i.type === 'project' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('projectRecentItems', projects, openProject);
        }

        function renderRecentItems(containerId, items, onClick) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (items.length === 0) {
                container.innerHTML = '<span class="recent-item" style="color:var(--text-muted);">None</span>';
                return;
            }
            container.innerHTML = items.map(item => `
                <span class="recent-item" data-id="${item.id}">${item.title || 'Untitled'}</span>
            `).join('');
            container.querySelectorAll('.recent-item').forEach(el => {
                el.addEventListener('click', () => {
                    onClick(el.dataset.id);
                });
            });
        }

        // =============================================================
        // 12. OPEN FUNCTIONS (placeholder, will navigate to detail pages)
        // =============================================================

        function openCredential(id) {
            // Open credential.html with id
            window.open(`credential.html?id=${id}`, '_blank');
        }

        function openNote(id) {
            window.open(`note.html?id=${id}`, '_blank');
        }

        function openProject(id) {
            window.open(`project.html?id=${id}`, '_blank');
        }

        // =============================================================
        // 13. DELETE / TRASH
        // =============================================================

        function moveToTrash(id) {
            update(ref(database, `vault-items/${id}`), { trash: true, trashedAt: Date.now() });
        }

        // =============================================================
        // 14. SEARCH (global search across all widgets)
        // =============================================================

        const globalSearch = document.getElementById('globalSearch');
        globalSearch.addEventListener('input', debounce((e) => {
            const term = e.target.value.trim();
            globalSearchTerm = term;
            // Apply to credential and bookmark searches
            document.getElementById('credSearch').value = term;
            document.getElementById('bookSearch').value = term;
            credSearchTerm = term;
            bookSearchTerm = term;
            renderCredentials();
            renderBookmarks();
        }, 300));

        // Credential search
        document.getElementById('credSearch').addEventListener('input', debounce((e) => {
            credSearchTerm = e.target.value.trim();
            renderCredentials();
        }, 300));

        // Bookmark search
        document.getElementById('bookSearch').addEventListener('input', debounce((e) => {
            bookSearchTerm = e.target.value.trim();
            renderBookmarks();
        }, 300));

        // =============================================================
        // 15. TOAST
        // =============================================================

        function showToast(message, type = 'info') {
            const container = document.createElement('div');
            container.className = 'toast-container';
            // We'll append to body
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconMap = {
                info: 'mdi:information',
                success: 'mdi:check-circle',
                error: 'mdi:alert-circle',
                warning: 'mdi:alert'
            };
            toast.innerHTML = `
                <iconify-icon icon="${iconMap[type] || 'mdi:information'}"></iconify-icon>
                <span class="toast-text">${message}</span>
            `;
            // Append to body
            const existing = document.querySelector('.toast-container');
            if (!existing) {
                const cont = document.createElement('div');
                cont.className = 'toast-container';
                cont.style.cssText = 'position:fixed;bottom:2rem;right:2rem;z-index:2000;display:flex;flex-direction:column;gap:0.5rem;max-width:340px;width:100%;';
                document.body.appendChild(cont);
            }
            const cont = document.querySelector('.toast-container');
            cont.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // =============================================================
        // 16. INITIAL LOG
        // =============================================================

        console.log('🔐 Vault dashboard loaded with full widgets.');
    </script>
</body>
</html>
