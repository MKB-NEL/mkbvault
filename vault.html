<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Vault · Dashboard</title>

    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ===== ICONIFY ===== -->
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f6f8f6;
            --bg-card: #ffffff;
            --bg-input: #f2f2f2;
            --text-primary: #333333;
            --text-secondary: #7A7A7A;
            --text-muted: #aaaaaa;
            --accent: #2395ed;
            --accent-hover: #016fc6;
            --accent-light: #e8f4fd;
            --success: #1aaa4d;
            --error: #dc2626;
            --warning: #f59e0b;
            --border-light: #f0f0f0;
            --border-medium: #cccccc;
            --radius-sm: 6px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.10);
            --transition: 0.2s ease;
            --header-bg: #2395ed;
            --header-bg-scrolled: #1180d6;
            --yellow-light: #fff9e6;
            --yellow-box: #fef3c7;
            --sidebar-width: 30%;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- AUTH GUARD ---------- */
        #authGuard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 1.5rem;
            transition: opacity 0.6s ease;
        }
        #authGuard.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #authGuard .spinner-ring {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #authGuard p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        #authGuard .error-icon { font-size: 3rem; color: var(--error); }
        #authGuard .error-text { font-size: 1rem; color: var(--text-primary); font-weight: 500; }
        #authGuard .error-sub { font-size: 0.85rem; color: var(--text-secondary); font-weight: 300; }
        #authGuard .redirect-btn {
            margin-top: 0.5rem;
            padding: 0.7rem 2rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
        }
        #authGuard .redirect-btn:hover {
            background: var(--accent-hover);
        }

        /* ---------- VAULT CONTENT ---------- */
        #vaultContent {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 16px 24px;
        }
        #vaultContent.visible {
            display: block;
            opacity: 1;
        }

        /* ============================================================ */
        /* ===== HERO SECTION ===== */
        /* ============================================================ */
        .hero {
            position: relative;
            height: 140px;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 20px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            background-size: cover;
            background-position: center;
        }
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 1rem 2rem;
        }
        .hero-content h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .hero-content p {
            font-size: 0.95rem;
            font-weight: 300;
            opacity: 0.9;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* ============================================================ */
        /* ===== HEADER (Start.me style) ===== */
        /* ============================================================ */
        .vault-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            height: 52px;
            max-height: 52px;
            padding: 0 16px;
            margin: 0 -16px 16px;
            background: var(--header-bg);
            color: #fff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
        }

        .vault-header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .vault-header .brand .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
        }
        .vault-header .brand .logo-icon iconify-icon {
            font-size: 1.2rem;
        }
        .vault-header .brand h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .vault-header .brand .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 400;
            opacity: 0.7;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.05rem 0.5rem;
            border-radius: 20px;
            margin-left: 4px;
        }

        .vault-header .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .vault-header .actions .btn {
            padding: 0.4rem 0.9rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s ease, transform 0.15s ease;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .vault-header .actions .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .vault-header .actions .btn:active {
            transform: scale(0.97);
        }
        .vault-header .actions .btn-danger {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .vault-header .actions .btn-danger:hover {
            background: rgba(220, 38, 38, 0.3);
            border-color: #dc2626;
        }

        /* ============================================================ */
        /* ===== MAIN LAYOUT (sidebar + right area) ===== */
        /* ============================================================ */
        .dashboard-layout {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            min-height: 600px;
        }

        /* ---------- SIDEBAR (Credential Widget) ---------- */
        .sidebar {
            flex: 0 0 var(--sidebar-width);
            min-width: 260px;
            max-width: 380px;
        }

        /* ---------- RIGHT AREA ---------- */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        /* ---------- WIDGET COMMON ---------- */
        .widget {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .widget-header {
            padding: 10px 14px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .widget-header .widget-title {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .widget-header .widget-title iconify-icon {
            font-size: 1.1rem;
        }
        .widget-header .widget-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .widget-header .widget-controls .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 0 8px;
            height: 28px;
            transition: border-color 0.2s;
        }
        .widget-header .widget-controls .search-box:focus-within {
            border-color: var(--accent);
        }
        .widget-header .widget-controls .search-box iconify-icon {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .widget-header .widget-controls .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.8rem;
            padding: 0 4px;
            width: 80px;
            font-family: 'Inter', sans-serif;
        }
        .widget-header .widget-controls .search-box input:focus {
            width: 120px;
        }
        .widget-header .widget-controls .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            gap: 3px;
            transition: background 0.2s;
        }
        .widget-header .widget-controls .btn-icon:hover {
            background: var(--bg-primary);
        }
        .widget-header .widget-controls .btn-icon.primary {
            color: var(--accent);
        }
        .widget-header .widget-controls .btn-icon.danger {
            color: var(--error);
        }
        .widget-header .widget-controls .btn-icon:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .widget-header .widget-controls .match-count {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 2px;
        }

        /* Recents below header */
        .widget-recents {
            padding: 4px 12px 6px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .widget-recents .recent-label {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-right: 4px;
        }
        .widget-recents .recent-item {
            background: var(--bg-card);
            padding: 1px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            cursor: pointer;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: background 0.2s;
            font-size: 0.7rem;
        }
        .widget-recents .recent-item:hover {
            background: var(--accent-light);
            color: var(--text-primary);
        }

        .widget-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            position: relative;
        }
        .widget-body::-webkit-scrollbar {
            width: 5px;
        }
        .widget-body::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 10px;
        }

        /* ---------- CREDENTIALS WIDGET (sidebar) ---------- */
        .credential-groups {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .credential-group {
            border-bottom: 1px solid var(--border-light);
        }
        .credential-group:last-child {
            border-bottom: none;
        }
        .group-header {
            display: flex;
            align-items: center;
            padding: 6px 0;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            gap: 6px;
            user-select: none;
        }
        .group-header iconify-icon {
            transition: transform 0.2s;
            font-size: 1rem;
        }
        .group-header .group-name {
            flex: 1;
        }
        .group-header .group-count {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-right: 4px;
        }
        .group-header .group-actions {
            display: flex;
            gap: 4px;
        }
        .group-header .group-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 4px;
            font-size: 0.8rem;
        }
        .group-header .group-actions button:hover {
            color: var(--text-primary);
        }
        .group-content {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            padding-left: 24px;
        }
        .group-content.expanded {
            max-height: 3000px;
        }
        .credential-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-light);
            transition: background 0.1s;
        }
        .credential-item:last-child {
            border-bottom: none;
        }
        .credential-item .item-checkbox {
            display: none;
        }
        .credential-item .item-checkbox.show {
            display: inline-flex;
        }
        .credential-item .item-title {
            flex: 1;
            cursor: pointer;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .credential-item .item-title .highlight {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }
        .credential-item .item-title:hover {
            text-decoration: underline;
        }
        .credential-item .item-actions {
            display: flex;
            gap: 4px;
        }
        .credential-item .item-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 0 4px;
        }
        .credential-item .item-actions button:hover {
            color: var(--text-primary);
        }
        .credential-item .item-actions .delete:hover {
            color: var(--error);
        }
        .multi-select-actions {
            display: none;
            padding: 4px 0 8px;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-light);
            margin-top: 4px;
        }
        .multi-select-actions.show {
            display: flex;
        }
        .multi-select-actions .btn-icon {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 2px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .multi-select-actions .btn-icon:hover {
            background: var(--accent-light);
        }

        /* ---------- BOOKMARK WIDGET (full width) ---------- */
        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 4px 0;
        }
        .bookmark-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
            position: relative;
            text-align: center;
        }
        .bookmark-item:hover {
            border-color: var(--accent-light);
            background: var(--accent-light);
        }
        .bookmark-item .bookmark-checkbox {
            position: absolute;
            top: 4px;
            left: 4px;
            display: none;
        }
        .bookmark-item .bookmark-checkbox.show {
            display: block;
        }
        .bookmark-item .favicon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-bottom: 4px;
        }
        .bookmark-item .b-title {
            font-size: 0.7rem;
            font-weight: 500;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bookmark-item .b-title .highlight {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }
        .bookmark-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 8px 0 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .bookmark-pagination button {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 2px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .bookmark-pagination button:hover {
            background: var(--bg-primary);
        }
        .bookmark-pagination button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* ---------- NOTES WIDGET (grid) ---------- */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .note-box {
            background: var(--yellow-box);
            border-radius: var(--radius-sm);
            padding: 12px 8px;
            text-align: center;
            font-weight: 500;
            color: #1a1a1a;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            font-size: 0.85rem;
        }
        .note-box:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* ---------- PROJECTS WIDGET (list) ---------- */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .project-item {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.1s;
        }
        .project-item:hover {
            background: var(--bg-primary);
        }
        .project-item:last-child {
            border-bottom: none;
        }

        /* ---------- CUSTOM MODAL / POPUP ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            max-width: 460px;
            width: 100%;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            animation: modalSlide 0.25s ease;
        }
        @keyframes modalSlide {
            from { transform: scale(0.95) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-box .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .modal-box .modal-body {
            margin-bottom: 20px;
        }
        .modal-box .modal-body label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .modal-box .modal-body input,
        .modal-box .modal-body textarea,
        .modal-box .modal-body select {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            background: var(--bg-input);
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }
        .modal-box .modal-body input:focus,
        .modal-box .modal-body textarea:focus,
        .modal-box .modal-body select:focus {
            border-color: var(--accent);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-box .modal-actions .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .modal-box .modal-actions .btn-primary:hover {
            background: var(--accent-hover);
        }
        .modal-box .modal-actions .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-secondary);
        }
        .modal-box .modal-actions .btn-secondary:hover {
            background: var(--border-light);
        }
        .modal-box .modal-actions .btn-danger {
            background: var(--error);
            color: #fff;
        }
        .modal-box .modal-actions .btn-danger:hover {
            background: #b91c1c;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 992px) {
            .dashboard-layout {
                flex-direction: column;
            }
            .sidebar {
                flex: none;
                max-width: none;
                width: 100%;
            }
            .bookmark-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 768px) {
            /* Redirect to mobile version, but we'll handle with JS */
            .hero { height: 100px; }
            .hero-content h1 { font-size: 1.2rem; }
            .hero-content p { font-size: 0.8rem; }
            .vault-header {

    <!-- ============================================================ -->

    <!-- ============================================================ -->
    <div class="modal-overlay" id="modalOverlay">

    <!-- ============================================================ -->
    <!-- ===== FIREBASE + VAULT LOGIC ===== -->
    <!-- ============================================================ -->

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        // =============================================================
        // 1. IMPORTS & CONFIG
        // =============================================================
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, onValue, push, set, update, remove } from 'firebase/database';

        const firebaseConfig = {
            apiKey: 'AIzaSyBbrRHlakmOdKwuDGwYAx5qf-e6DOHW7s0',
            authDomain: 'joefootball-15e7a.firebaseapp.com',
            databaseURL: 'https://joefootball-15e7a-default-rtdb.firebaseio.com',
            projectId: 'joefootball-15e7a',
            storageBucket: 'joefootball-15e7a.firebasestorage.app',
            messagingSenderId: '976347287101',
            appId: '1:976347287101:web:93a93c519fff7e60986454',
            measurementId: 'G-3Q10KV3HE3'
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const itemsRef = ref(database, 'vault-items');

        // =============================================================
        // 2. SESSION / AUTH
        // =============================================================
        const SESSION_KEY = 'vault_authenticated';
        const SESSION_TIME_KEY = 'vault_login_time';
        const SESSION_DURATION_MS = 24 * 60 * 60 * 1000;

        const authGuard = document.getElementById('authGuard');
        const authStatus = document.getElementById('authStatus');
        const authSpinner = document.getElementById('authSpinner');
        const vaultContent = document.getElementById('vaultContent');

        // Mobile redirect
        const isMobile = window.innerWidth < 768;
        if (isMobile) {
            // Redirect to vaultp.html
            window.location.replace('vaultp.html');
            // Stop execution
            throw new Error('Redirecting to mobile version.');
        }

        function checkAuthentication() {
            const isAuth = sessionStorage.getItem(SESSION_KEY);
            const loginTime = parseInt(sessionStorage.getItem(SESSION_TIME_KEY) || '0');
            const now = Date.now();
            if (isAuth !== 'true' || now - loginTime > SESSION_DURATION_MS) {
                sessionStorage.removeItem(SESSION_KEY);
                sessionStorage.removeItem(SESSION_TIME_KEY);
                showAuthError('Your session has expired or is invalid.');
                return false;
            }
            return true;
        }

        function showAuthError(message) {
            authSpinner.style.display = 'none';
            authStatus.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;text-align:center;">
                    <iconify-icon icon="mdi:alert-circle" style="font-size:3rem;color:#ef4444;"></iconify-icon>
                    <span style="font-size:1rem;font-weight:500;color:#0f172a;">Access Denied</span>
                    <span style="font-size:0.85rem;color:#64748b;font-weight:300;">${message}</span>
                    <a href="index.html" class="redirect-btn">Return to Login</a>
                </div>
            `;
        }

        function grantAccess() {
            authGuard.classList.add('hidden');
            vaultContent.classList.add('visible');
            sessionStorage.setItem(SESSION_TIME_KEY, Date.now().toString());
            initVault();
        }

        setTimeout(() => {
            if (checkAuthentication()) grantAccess();
        }, 400);

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem(SESSION_KEY);
            sessionStorage.removeItem(SESSION_TIME_KEY);
            window.location.href = 'index.html';
        });

        document.getElementById('footerYear').textContent = new Date().getFullYear();

        // =============================================================
        // 3. MODAL / POPUP SYSTEM
        // =============================================================

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalActions = document.getElementById('modalActions');

        function showModal(title, bodyHTML, actionsHTML) {
            modalTitle.textContent = title;
            modalBody.innerHTML = bodyHTML;
            modalActions.innerHTML = actionsHTML;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Close on overlay click
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Simple prompt replacement
        function customPrompt(title, label, defaultValue = '', inputType = 'text', options = null) {
            return new Promise((resolve) => {
                let bodyHTML = `<label>${label}</label>`;
                if (options) {
                    // Select dropdown
                    bodyHTML += `<select id="modalSelect">${options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>`;
                } else {
                    bodyHTML += `<input type="${inputType}" id="modalInput" value="${defaultValue}" />`;
                }
                const actionsHTML = `
                    <button class="btn btn-secondary" data-action="cancel">Cancel</button>
                    <button class="btn btn-primary" data-action="confirm">OK</button>
                `;
                showModal(title, bodyHTML, actionsHTML);
                const input = document.getElementById('modalInput');
                const select = document.getElementById('modalSelect');
                if (input) {
                    input.focus();
                    input.select();
                }
                const confirmBtn = modalActions.querySelector('[data-action="confirm"]');
                const cancelBtn = modalActions.querySelector('[data-action="cancel"]');
                const handleConfirm = () => {
                    const value = input ? input.value : (select ? select.value : '');
                    closeModal();
                    resolve(value);
                };
                const handleCancel = () => {
                    closeModal();
                    resolve(null);
                };
                confirmBtn.addEventListener('click', handleConfirm);
                cancelBtn.addEventListener('click', handleCancel);
                // Enter key
                const onKey = (e) => {
                    if (e.key === 'Enter') handleConfirm();
                    if (e.key === 'Escape') handleCancel();
                };
                document.addEventListener('keydown', onKey, { once: true });
                // Also handle if input exists
                if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleConfirm(); });
            });
        }

        // Confirm dialog
        function customConfirm(message) {
            return new Promise((resolve) => {
                const bodyHTML = `<p>${message}</p>`;
                const actionsHTML = `
                    <button class="btn btn-secondary" data-action="cancel">Cancel</button>
                    <button class="btn btn-danger" data-action="confirm">Confirm</button>
                `;
                showModal('Confirm', bodyHTML, actionsHTML);
                const confirmBtn = modalActions.querySelector('[data-action="confirm"]');
                const cancelBtn = modalActions.querySelector('[data-action="cancel"]');
                const handle = (result) => {
                    closeModal();
                    resolve(result);
                };
                confirmBtn.addEventListener('click', () => handle(true));
                cancelBtn.addEventListener('click', () => handle(false));
            });
        }

        // =============================================================
        // 4. STATE
        // =============================================================
        let allItems = [];
        let credentialGroups = {}; // { groupName: [itemIds] }
        let bookmarkCategories = {}; // { categoryName: [itemIds] }
        let credentialSelectMode = false;
        let bookmarkSelectMode = false;
        let selectedCredIds = new Set();
        let selectedBookIds = new Set();

        // Bookmark pagination
        let bookPage = 0;
        const BOOKS_PER_PAGE = 10;

        // Search state
        let credSearchTerm = '';
        let bookSearchTerm = '';

        // =============================================================
        // 5. FIREBASE READ
        // =============================================================

        function initVault() {
            onValue(itemsRef, (snapshot) => {
                const data = snapshot.val();
                allItems = data ? Object.entries(data).map(([id, value]) => ({
                    id,
                    ...value,
                    createdAt: value.createdAt || Date.now()
                })) : [];
                buildIndexes();
                renderAll();
            }, (error) => {
                console.error('Firebase read error:', error);
                showToast('Error loading vault data.', 'error');
            });
        }

        function buildIndexes() {
            // Credential groups
            credentialGroups = {};
            const creds = allItems.filter(i => i.type === 'credential' && !i.trash);
            creds.forEach(item => {
                const group = item.group || 'General';
                if (!credentialGroups[group]) credentialGroups[group] = [];
                credentialGroups[group].push(item.id);
            });
            if (!credentialGroups['General']) credentialGroups['General'] = [];

            // Bookmark categories (not used for grouping in UI but for future)
            bookmarkCategories = {};
            const books = allItems.filter(i => i.type === 'bookmark' && !i.trash);
            books.forEach(item => {
                const cat = item.category || 'Uncategorized';
                if (!bookmarkCategories[cat]) bookmarkCategories[cat] = [];
                bookmarkCategories[cat].push(item.id);
            });
        }

        // =============================================================
        // 6. RENDER ALL WIDGETS
        // =============================================================

        function renderAll() {
            renderCredentials();
            renderBookmarks();
            renderNotes();
            renderProjects();
            renderRecents();
        }

        // =============================================================
        // 7. CREDENTIALS WIDGET
        // =============================================================

        function renderCredentials() {
            const container = document.getElementById('credGroups');
            const searchTerm = credSearchTerm.toLowerCase().trim();
            const matchCount = document.getElementById('credMatchCount');

            let filteredGroups = {};
            let totalMatches = 0;

            const allGroups = Object.keys(credentialGroups);
            allGroups.forEach(group => {
                const ids = credentialGroups[group] || [];
                const items = ids.map(id => allItems.find(i => i.id === id)).filter(Boolean);
                let matchedItems = items;
                if (searchTerm) {
                    matchedItems = items.filter(item =>
                        (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                        (item.username && item.username.toLowerCase().includes(searchTerm)) ||
                        (item.url && item.url.toLowerCase().includes(searchTerm))
                    );
                }
                if (matchedItems.length > 0 || !searchTerm) {
                    filteredGroups[group] = matchedItems;
                    totalMatches += matchedItems.length;
                }
            });

            matchCount.textContent = searchTerm ? `(${totalMatches} matches)` : '';

            let html = '';
            const groupNames = Object.keys(filteredGroups).sort((a, b) => a.localeCompare(b));
            if (groupNames.includes('General')) {
                groupNames.splice(groupNames.indexOf('General'), 1);
                groupNames.unshift('General');
            }

            groupNames.forEach(group => {
                const items = filteredGroups[group];
                const isExpanded = true;

                html += `<div class="credential-group" data-group="${group}">
                    <div class="group-header" data-toggle="group">
                        <iconify-icon icon="mdi:chevron-down"></iconify-icon>
                        <span class="group-name">${group}</span>
                        <span class="group-count">(${items.length})</span>
                        <div class="group-actions">
                            <button class="btn-icon" data-action="renameGroup" title="Rename">✎</button>
                            <button class="btn-icon danger" data-action="deleteGroup" title="Delete group">✕</button>
                        </div>
                    </div>
                    <div class="group-content expanded">
                        ${items.map(item => {
                            const isSelected = selectedCredIds.has(item.id);
                            const titleHtml = item.title ? item.title.replace(new RegExp(searchTerm, 'gi'), match => `<span class="highlight">${match}</span>`) : 'Untitled';
                            return `
                                <div class="credential-item" data-id="${item.id}">
                                    <span class="item-checkbox ${credentialSelectMode ? 'show' : ''}">
                                        <input type="checkbox" ${isSelected ? 'checked' : ''} data-id="${item.id}" class="cred-check" />
                                    </span>
                                    <span class="item-title" data-action="openCred" title="${item.title || ''}">${titleHtml}</span>
                                    <div class="item-actions">
                                        <button data-action="openCred" title="Open">📂</button>
                                        <button class="delete" data-action="deleteCred" title="Delete">🗑</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
            });

            container.innerHTML = html;

            // Toggle group expansion
            container.querySelectorAll('[data-toggle="group"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.group-actions')) return;
                    const content = el.parentElement.querySelector('.group-content');
                    if (content) {
                        content.classList.toggle('expanded');
                        const icon = el.querySelector('iconify-icon');
                        if (icon) icon.setAttribute('icon', content.classList.contains('expanded') ? 'mdi:chevron-down' : 'mdi:chevron-right');
                    }
                });
            });

            // Item actions
            container.querySelectorAll('[data-action="openCred"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const itemEl = el.closest('.credential-item');
                    if (!itemEl) return;
                    const id = itemEl.dataset.id;
                    openCredential(id);
                });
            });

            container.querySelectorAll('[data-action="deleteCred"]').forEach(el => {
                el.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const itemEl = el.closest('.credential-item');
                    if (!itemEl) return;
                    const id = itemEl.dataset.id;
                    const confirmed = await customConfirm('Move this credential to trash?');
                    if (confirmed) {
                        moveToTrash(id);
                    }
                });
            });

            // Select checkboxes
            container.querySelectorAll('.cred-check').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = cb.dataset.id;
                    if (cb.checked) selectedCredIds.add(id);
                    else selectedCredIds.delete(id);
                    updateCredMultiActions();
                });
            });

            updateCredMultiActions();
        }

        function updateCredMultiActions() {
            const container = document.getElementById('credMultiActions');
            const show = credentialSelectMode && selectedCredIds.size > 0;
            container.classList.toggle('show', show);
            document.getElementById('credOpenMulti').disabled = !show;
            document.getElementById('credDeleteMulti').disabled = !show;
        }

        // Toggle select mode
        document.getElementById('credSelectToggle').addEventListener('change', (e) => {
            credentialSelectMode = e.target.checked;
            if (!credentialSelectMode) {
                selectedCredIds.clear();
            }
            renderCredentials();
        });

        // Multi-select actions
        document.getElementById('credOpenMulti').addEventListener('click', () => {
            if (selectedCredIds.size === 0) return;
            selectedCredIds.forEach(id => openCredential(id));
        });

        document.getElementById('credDeleteMulti').addEventListener('click', async () => {
            if (selectedCredIds.size === 0) return;
            const confirmed = await customConfirm(`Delete ${selectedCredIds.size} credential(s)?`);
            if (confirmed) {
                selectedCredIds.forEach(id => moveToTrash(id));
                selectedCredIds.clear();
                renderCredentials();
                showToast('Credentials moved to trash', 'warning');
            }
        });

        // Add group
        document.getElementById('credAddGroup').addEventListener('click', async () => {
            const name = await customPrompt('New Group', 'Enter group name:');
            if (name && name.trim() && !credentialGroups[name.trim()]) {
                credentialGroups[name.trim()] = [];
                renderCredentials();
                showToast(`Group "${name.trim()}" created`, 'success');
            } else if (name && name.trim()) {
                showToast('Group already exists.', 'warning');
            }
        });

        // Add credential
        document.getElementById('credAddItem').addEventListener('click', async () => {
            const title = await customPrompt('New Credential', 'Enter title:');
            if (!title || !title.trim()) return;
            const username = await customPrompt('Username/Email', 'Enter username or email:', '', 'text');
            const password = await customPrompt('Password', 'Enter password:', '', 'password');
            const url = await customPrompt('Website URL', 'Enter URL (optional):', '', 'url');
            // Group selection
            const groups = Object.keys(credentialGroups);
            const group = await customPrompt('Select Group', 'Choose group:', 'General', 'select', groups);
            const finalGroup = group || 'General';
            const newItem = {
                type: 'credential',
                title: title.trim(),
                username: username || '',
                password: password || '',
                url: url || '',
                group: finalGroup,
                favorite: false,
                trash: false,
                createdAt: Date.now()
            };
            const newRef = push(itemsRef);
            set(newRef, newItem);
            showToast('Credential added!', 'success');
        });

        // Group rename/delete via delegated events
        document.getElementById('credBody').addEventListener('click', async (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            const groupHeader = target.closest('.group-header');
            if (!groupHeader) return;
            const groupName = groupHeader.querySelector('.group-name')?.textContent;
            if (!groupName) return;

            if (action === 'renameGroup') {
                const newName = await customPrompt('Rename Group', `Rename "${groupName}" to:`, groupName);
                if (newName && newName.trim() && newName.trim() !== groupName) {
                    const ids = credentialGroups[groupName] || [];
                    const updates = {};
                    ids.forEach(id => {
                        updates[`vault-items/${id}/group`] = newName.trim();
                    });
                    update(ref(database), updates);
                    showToast(`Group renamed to "${newName.trim()}"`, 'success');
                }
            } else if (action === 'deleteGroup') {
                const confirmed = await customConfirm(`Delete group "${groupName}" and move its items to "General"?`);
                if (confirmed) {
                    const ids = credentialGroups[groupName] || [];
                    const updates = {};
                    ids.forEach(id => {
                        updates[`vault-items/${id}/group`] = 'General';
                    });
                    update(ref(database), updates);
                    showToast(`Group "${groupName}" deleted, items moved to General`, 'warning');
                }
            }
        });

        // =============================================================
        // 8. BOOKMARK WIDGET
        // =============================================================

        function renderBookmarks() {
            const grid = document.getElementById('bookGrid');
            const searchTerm = bookSearchTerm.toLowerCase().trim();
            const matchCount = document.getElementById('bookMatchCount');

            let books = allItems.filter(i => i.type === 'bookmark' && !i.trash);
            if (searchTerm) {
                books = books.filter(item =>
                    (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                    (item.url && item.url.toLowerCase().includes(searchTerm)) ||
                    (item.description && item.description.toLowerCase().includes(searchTerm))
                );
            }
            matchCount.textContent = searchTerm ? `(${books.length} matches)` : '';

            const totalPages = Math.ceil(books.length / BOOKS_PER_PAGE) || 1;
            if (bookPage >= totalPages) bookPage = totalPages - 1;
            if (bookPage < 0) bookPage = 0;
            const start = bookPage * BOOKS_PER_PAGE;
            const pageBooks = books.slice(start, start + BOOKS_PER_PAGE);

            let html = '';
            pageBooks.forEach(item => {
                const isSelected = selectedBookIds.has(item.id);
                const titleDisplay = item.title ? item.title.slice(0, 5) : 'Link';
                const titleHtml = item.title ? item.title.replace(new RegExp(searchTerm, 'gi'), match => `<span class="highlight">${match}</span>`) : 'Link';
                html += `
                    <div class="bookmark-item" data-id="${item.id}" title="${item.title || ''}">
                        <span class="bookmark-checkbox ${bookmarkSelectMode ? 'show' : ''}">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} data-id="${item.id}" class="book-check" />
                        </span>
                        <img class="favicon" src="${item.favicon || 'https://www.google.com/s2/favicons?domain=' + (item.url || '')}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>'" />
                        <span class="b-title">${titleHtml}</span>
                    </div>
                `;
            });

            if (pageBooks.length === 0) {
                html = `<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted);">No bookmarks found.</div>`;
            }

            grid.innerHTML = html;

            document.getElementById('bookPageInfo').textContent = `${bookPage + 1} / ${totalPages}`;
            document.getElementById('bookPrev').disabled = bookPage === 0;
            document.getElementById('bookNext').disabled = bookPage >= totalPages - 1;

            grid.querySelectorAll('.bookmark-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.book-check')) return;
                    const id = el.dataset.id;
                    const item = allItems.find(i => i.id === id);
                    if (item && item.url) {
                        window.open(item.url, '_blank');
                    }
                });
            });

            grid.querySelectorAll('.book-check').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = cb.dataset.id;
                    if (cb.checked) selectedBookIds.add(id);
                    else selectedBookIds.delete(id);
                    updateBookMultiActions();
                });
            });

            updateBookMultiActions();
        }

        function updateBookMultiActions() {
            const container = document.getElementById('bookMultiActions');
            const show = bookmarkSelectMode && selectedBookIds.size > 0;
            container.classList.toggle('show', show);
            document.getElementById('bookOpenMulti').disabled = !show;
            document.getElementById('bookDeleteMulti').disabled = !show;
        }

        document.getElementById('bookSelectToggle').addEventListener('change', (e) => {
            bookmarkSelectMode = e.target.checked;
            if (!bookmarkSelectMode) {
                selectedBookIds.clear();
            }
            renderBookmarks();
        });

        document.getElementById('bookOpenMulti').addEventListener('click', () => {
            if (selectedBookIds.size === 0) return;
            selectedBookIds.forEach(id => {
                const item = allItems.find(i => i.id === id);
                if (item && item.url) window.open(item.url, '_blank');
            });
        });

        document.getElementById('bookDeleteMulti').addEventListener('click', async () => {
            if (selectedBookIds.size === 0) return;
            const confirmed = await customConfirm(`Delete ${selectedBookIds.size} bookmark(s)?`);
            if (confirmed) {
                selectedBookIds.forEach(id => moveToTrash(id));
                selectedBookIds.clear();
                renderBookmarks();
                showToast('Bookmarks moved to trash', 'warning');
            }
        });

        document.getElementById('bookPrev').addEventListener('click', () => {
            if (bookPage > 0) { bookPage--; renderBookmarks(); }
        });
        document.getElementById('bookNext').addEventListener('click', () => {
            const total = Math.ceil(allItems.filter(i => i.type === 'bookmark' && !i.trash).length / BOOKS_PER_PAGE);
            if (bookPage < total - 1) { bookPage++; renderBookmarks(); }
        });

        document.getElementById('bookAddLink').addEventListener('click', async () => {
            const url = await customPrompt('Add Bookmark', 'Enter URL:', '', 'url');
            if (!url || !url.trim()) return;
            const trimmedUrl = url.trim();
            // Simple fetch metadata (we'll just use the URL as title)
            const title = await customPrompt('Title (optional)', 'Enter title (or leave blank to use URL):', trimmedUrl, 'text');
            const category = await customPrompt('Category (optional)', 'Enter category:', 'Uncategorized', 'text');
            const newItem = {
                type: 'bookmark',
                title: title || trimmedUrl,
                url: trimmedUrl,
                favicon: `https://www.google.com/s2/favicons?domain=${trimmedUrl}`,
                description: '',
                category: category || 'Uncategorized',
                favorite: false,
                trash: false,
                createdAt: Date.now()
            };
            const newRef = push(itemsRef);
            set(newRef, newItem);
            showToast('Bookmark added!', 'success');
        });

        // =============================================================
        // 9. NOTES WIDGET
        // =============================================================

        function renderNotes() {
            const grid = document.getElementById('noteGrid');
            const notes = allItems.filter(i => i.type === 'note' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt);
            let html = '';
            notes.forEach(note => {
                html += `<div class="note-box" data-id="${note.id}" title="${note.title || ''}">${note.title || 'Untitled'}</div>`;
            });
            if (notes.length === 0) {
                html = `<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted);">No notes yet.</div>`;
            }
            grid.innerHTML = html;

            grid.querySelectorAll('.note-box').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    openNote(id);
                });
            });
        }

        document.getElementById('noteAdd').addEventListener('click', async () => {
            const title = await customPrompt('New Note', 'Enter note title:');
            if (!title || !title.trim()) return;
            const content = await customPrompt('Content (optional)', 'Enter note content:', '', 'text');
            const newItem = {
                type: 'note',
                title: title.trim(),
                content: content || '',
                favorite: false,
                trash: false,
                createdAt: Date.now()
            };
            const newRef = push(itemsRef);
            set(newRef, newItem);
            showToast('Note created!', 'success');
        });

        // =============================================================
        // 10. PROJECTS WIDGET
        // =============================================================

        function renderProjects() {
            const list = document.getElementById('projectList');
            const projects = allItems.filter(i => i.type === 'project' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt);
            let html = '';
            projects.forEach(proj => {
                html += `<div class="project-item" data-id="${proj.id}">${proj.title || 'Untitled'}</div>`;
            });
            if (projects.length === 0) {
                html = `<div style="padding:12px;text-align:center;color:var(--text-muted);">No projects yet.</div>`;
            }
            list.innerHTML = html;

            list.querySelectorAll('.project-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    openProject(id);
                });
            });
        }

        document.getElementById('projectAdd').addEventListener('click', async () => {
            const title = await customPrompt('New Project', 'Enter project title:');
            if (!title || !title.trim()) return;
            const newItem = {
                type: 'project',
                title: title.trim(),
                status: 'Active',
                favorite: false,
                trash: false,
                createdAt: Date.now()
            };
            const newRef = push(itemsRef);
            set(newRef, newItem);
            showToast('Project created!', 'success');
        });

        // =============================================================
        // 11. RECENTS (displayed under headers)
        // =============================================================

        function renderRecents() {
            // Credentials recent (3 latest)
            const creds = allItems.filter(i => i.type === 'credential' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('credRecentItems', creds, openCredential);

            // Bookmarks recent (3 latest)
            const books = allItems.filter(i => i.type === 'bookmark' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('bookRecentItems', books, (id) => {
                const item = allItems.find(i => i.id === id);
                if (item && item.url) window.open(item.url, '_blank');
            });

            // Notes recent (3 latest)
            const notes = allItems.filter(i => i.type === 'note' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('noteRecentItems', notes, openNote);

            // Projects recent (3 latest)
            const projects = allItems.filter(i => i.type === 'project' && !i.trash)
                .sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
            renderRecentItems('projectRecentItems', projects, openProject);
        }

        function renderRecentItems(containerId, items, onClick) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (items.length === 0) {
                container.innerHTML = '<span class="recent-item" style="color:var(--text-muted);">None</span>';
                return;
            }
            container.innerHTML = items.map(item => `
                <span class="recent-item" data-id="${item.id}">${item.title || 'Untitled'}</span>
            `).join('');
            container.querySelectorAll('.recent-item').forEach(el => {
                el.addEventListener('click', () => {
                    onClick(el.dataset.id);
                });
            });
        }

        // =============================================================
        // 12. OPEN FUNCTIONS (navigate to detail pages)
        // =============================================================

        function openCredential(id) {
            window.open(`credential.html?id=${id}`, '_blank');
        }

        function openNote(id) {
            window.open(`note.html?id=${id}`, '_blank');
        }

        function openProject(id) {
            window.open(`project.html?id=${id}`, '_blank');
        }

        // =============================================================
        // 13. DELETE / TRASH
        // =============================================================

        function moveToTrash(id) {
            update(ref(database, `vault-items/${id}`), { trash: true, trashedAt: Date.now() });
        }

        // =============================================================
        // 14. SEARCH (per widget)
        // =============================================================

        document.getElementById('credSearch').addEventListener('input', debounce((e) => {
            credSearchTerm = e.target.value.trim();
            renderCredentials();
        }, 300));

        document.getElementById('bookSearch').addEventListener('input', debounce((e) => {
            bookSearchTerm = e.target.value.trim();
            renderBookmarks();
        }, 300));

        // =============================================================
        // 15. DEBOUNCE
        // =============================================================

        function debounce(fn, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        // =============================================================
        // 16. TOAST (simple)
        // =============================================================

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: var(--bg-card);
                padding: 10px 18px;
                border-radius: var(--radius-sm);
                box-shadow: var(--shadow-lg);
                border-left: 4px solid ${type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--error)' : 'var(--accent)'};
                z-index: 9999;
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 0.9rem;
                max-width: 400px;
                animation: slideIn 0.3s ease;
                color: var(--text-primary);
            `;
            const iconMap = {
                info: 'mdi:information',
                success: 'mdi:check-circle',
                error: 'mdi:alert-circle',
                warning: 'mdi:alert'
            };
            toast.innerHTML = `
                <iconify-icon icon="${iconMap[type] || 'mdi:information'}"></iconify-icon>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // =============================================================
        // 17. INITIAL LOG
        // =============================================================

        console.log('🔐 Vault dashboard loaded (desktop layout).');
        console.log('📦 Items loaded:', allItems.length);
    </script>
</body>
</html>
