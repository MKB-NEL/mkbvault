<!-- vault.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vault · secure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: black;
      color: #7ab7ef;
      font-family: 'SFMono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2rem;
    }
    .container {
      text-align: center;
      border: 1px solid #1f3447;
      padding: 3rem;
      border-radius: 12px;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 400;
    }
    .accent {
      color: #7ab7ef;
      border-bottom: 2px solid #7ab7ef;
      display: inline-block;
      padding-bottom: 0.3rem;
    }
    p {
      color: #b8cdf5;
      line-height: 1.6;
      font-size: 1.1rem;
    }
    .glow {
      text-shadow: 0 0 10px rgba(122, 183, 239, 0.3);
    }
    .blink {
      animation: blink 2s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="glow">🔐 <span class="accent">vault</span> access</h1>
    <p>authentication successful · secure channel established</p>
    <p style="margin-top: 2rem; font-size: 0.9rem;" class="blink">▌ session active</p>
  </div>
</body>
</html>
